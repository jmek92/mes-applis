<style>
/* VOICE : calme, direct, sans jargon inutile — comme un chef d'atelier au téléphone.
   IDEA : la fiche de triage du dépanneur : un verdict, des gestes, des pistes classées.
   PICTURE : grandes tuiles d'urgence et bandeau de verdict couleur feu tricolore.
   COLOUR : fond neutre, bleu acier pour l'outil ; rouge / ambre / vert réservés au verdict.
   TYPE & LAYOUT : police système ; une colonne au pouce sur iPhone, deux colonnes sur ordinateur. */
:root{
  --bg:#f4f4f1;--card:#fff;--card2:#f6f6f3;--line:#e3e2dd;--field:#fff;--text:#0b0b0b;--muted:#5d5c57;--soft:#86857e;--track:#ebeae6;
  --accent:#0f4c81;--accent-ink:#fff;--accent-soft:#e3edf7;
  --stop:#b42320;--stop-bg:#fbe8e7;--stop-s:#d03b3b;
  --warn:#7a4f00;--warn-bg:#fdf1d4;--warn-s:#e7a100;
  --ok:#0a6d0a;--ok-bg:#e4f3e4;--ok-s:#16a34a;
  --info:#1d5fb0;--info-bg:#e4eefa;
  --na:#5f5e58;--na-bg:#eeede9;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 6px 18px rgba(0,0,0,.05);
}
:root[data-theme=dark]{
  --bg:#111110;--card:#1b1b1a;--card2:#232322;--line:#35352f;--field:#151514;--text:#f0efec;--muted:#b9b8b0;--soft:#8f8e87;--track:#2e2e2b;
  --accent:#6cb2f0;--accent-ink:#04213a;--accent-soft:#16273d;
  --stop:#ff8a86;--stop-bg:#3a1b1a;--stop-s:#e5534b;--warn:#f5bf4f;--warn-bg:#33290f;--warn-s:#f0a500;--ok:#6ad86a;--ok-bg:#15301a;--ok-s:#22b35a;
  --info:#7cb3f5;--info-bg:#16273d;--na:#b3b2aa;--na-bg:#2a2a27;--shadow:none;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#111110;--card:#1b1b1a;--card2:#232322;--line:#35352f;--field:#151514;--text:#f0efec;--muted:#b9b8b0;--soft:#8f8e87;--track:#2e2e2b;
  --accent:#6cb2f0;--accent-ink:#04213a;--accent-soft:#16273d;
  --stop:#ff8a86;--stop-bg:#3a1b1a;--stop-s:#e5534b;--warn:#f5bf4f;--warn-bg:#33290f;--warn-s:#f0a500;--ok:#6ad86a;--ok-bg:#15301a;--ok-s:#22b35a;
  --info:#7cb3f5;--info-bg:#16273d;--na:#b3b2aa;--na-bg:#2a2a27;--shadow:none;
}}
:root{color-scheme:light dark}:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;padding-bottom:calc(78px + env(safe-area-inset-bottom));-webkit-tap-highlight-color:transparent;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{touch-action:manipulation;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h2{font-size:24px;line-height:1.15;margin:4px 0 10px;letter-spacing:-.015em}
h3{font-size:17px;margin:0}
p{margin:6px 0}
small{font-size:13px}
.muted{color:var(--muted)}.soft{color:var(--soft)}
[hidden]{display:none!important}
ul.plain{margin:4px 0;padding-left:20px}ul.plain li{margin:3px 0}
ol.steps{margin:4px 0;padding-left:22px}ol.steps li{margin:6px 0}

/* En-tête */
header.top{position:sticky;top:0;z-index:30;background:var(--bg);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top) + 8px) 12px 8px}
.bar{display:flex;align-items:center;gap:8px;max-width:1100px;margin:0 auto}
.logo{flex:none;width:34px;height:34px;border-radius:9px;display:block}
.ctxchip{flex:1;display:flex;align-items:center;gap:8px;min-height:44px;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:6px 10px;text-align:left}
.ctxchip b{display:block;font-size:13px;color:var(--muted);font-weight:600;line-height:1.1}
.ctxchip span{display:block;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.25}
.ctxchip.empty span{color:var(--accent)}
.ctxchip svg{flex:none;margin-left:auto;color:var(--soft)}
.ctxchip>div{flex:1;min-width:0}
.icbtn{flex:none;width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:flex;align-items:center;justify-content:center;position:relative}
.icbtn svg{width:22px;height:22px}
.saved{position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--ok-s)}
.saved.ko{background:var(--stop-s)}

/* Barre d'onglets (pouce) */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;background:var(--card);border-top:1px solid var(--line);padding:4px 2px calc(4px + env(safe-area-inset-bottom))}
nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;font-weight:600;background:none;border:0;color:var(--soft);padding:6px 0 4px;min-height:58px;position:relative}
nav.tabs button svg{width:26px;height:26px}
nav.tabs button[aria-selected=true]{color:var(--accent)}
nav.tabs button.urg[aria-selected=true]{color:var(--stop)}
nav.tabs .nb{position:absolute;top:3px;left:calc(50% + 7px);min-width:19px;height:19px;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 5px}
@media (min-width:900px){
  body{padding-bottom:32px}
  nav.tabs{position:static;border:0;background:none;padding:0;gap:4px;justify-content:center;max-width:1100px;margin:10px auto 0}
  nav.tabs button{flex:0 0 auto;flex-direction:row;gap:7px;font-size:15px;padding:8px 16px;border-radius:999px;min-height:auto}
  nav.tabs button svg{width:20px;height:20px}
  nav.tabs button[aria-selected=true]{background:var(--accent-soft)}
  nav.tabs button.urg[aria-selected=true]{background:var(--stop-bg)}
  nav.tabs .nb{position:static;margin-left:2px}
}
main{max-width:1100px;margin:0 auto;padding:12px 12px 24px}

/* Cartes */
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.sect{font-size:14px;font-weight:700;color:var(--muted);margin:20px 4px 8px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.note{font-size:14px;color:var(--muted)}
.lnk{background:none;border:0;color:var(--accent);font-weight:600;padding:6px 0;font-size:15px;text-align:left}

/* Boutons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 16px;border-radius:14px;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:16px;text-decoration:none;color:inherit;text-align:center}
.btn svg{width:20px;height:20px;flex:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--stop);border-color:var(--stop)}
.btn.danger-fill{background:var(--stop-s);border-color:var(--stop-s);color:#fff}
.btn.call{background:var(--stop-s);border-color:var(--stop-s);color:#fff;flex:1}
.btn.ghost{background:none}
.btn.sm{min-height:40px;padding:6px 12px;font-size:15px;border-radius:12px}
.btn.wide{width:100%}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btns>.btn{flex:1 1 auto}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:42px;padding:8px 13px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:15px;font-weight:500;line-height:1.2;text-align:left}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.chip.rm{padding-right:12px}
.chip.rm::after{content:" ×";font-weight:700}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:4px;background:var(--track);border-radius:14px;padding:4px}
.seg button{min-height:44px;border:0;border-radius:11px;background:none;font-weight:600;font-size:15px;padding:6px 8px}
.seg button[aria-selected=true]{background:var(--card);color:var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.in{width:100%;min-height:48px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--field);font-size:16px}
textarea.in{min-height:96px;resize:vertical}
.search{position:relative}
.search .in{padding-left:40px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--soft)}
label.fld{display:block;font-size:14px;font-weight:600;color:var(--muted);margin:10px 0 4px}
label.fld .in{margin-top:4px;color:var(--text);font-weight:400}

/* Bandeau prudence */
.disc{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.4;background:var(--warn-bg);color:var(--text);border-radius:14px;padding:10px 12px;margin-bottom:12px}
.disc b{color:var(--warn)}
.disc svg{flex:none;width:20px;height:20px;color:var(--warn);margin-top:1px}

/* Urgence */
.callrow{display:flex;gap:8px;margin-bottom:12px}
.callrow .btn{min-height:52px}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (min-width:600px){.tiles{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (min-width:900px){.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tile{display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;gap:6px;min-height:96px;padding:12px;border-radius:16px;border:1px solid var(--line);background:var(--card);text-align:left;font-weight:700;font-size:16px;line-height:1.2;box-shadow:var(--shadow)}
.tile .ic{font-size:28px;line-height:1}
.tile.s2{border-color:color-mix(in srgb,var(--stop-s) 45%,var(--line));background:linear-gradient(var(--stop-bg),var(--stop-bg)) top/100% 5px no-repeat,var(--card)}
.tile.s1{background:linear-gradient(var(--warn-s),var(--warn-s)) top/100% 5px no-repeat,var(--card)}
.tile.sn{background:linear-gradient(var(--accent),var(--accent)) top/100% 5px no-repeat,var(--card)}
.tile.s2{background:linear-gradient(var(--stop-s),var(--stop-s)) top/100% 5px no-repeat,var(--card)}
.back{display:inline-flex;align-items:center;gap:4px;min-height:44px;border:0;background:none;color:var(--accent);font-weight:600;font-size:16px;padding:0}
.emtitle{display:flex;align-items:center;gap:10px;margin:2px 0 10px}
.emtitle .ic{font-size:34px;line-height:1}
.emtitle h2{margin:0}
.verdict{border-radius:18px;padding:16px;margin-bottom:12px;border:2px solid transparent}
.verdict .vt{font-size:clamp(26px,7vw,34px);font-weight:800;letter-spacing:-.02em;line-height:1.05;display:flex;align-items:center;gap:10px}
.verdict .vt svg{width:34px;height:34px;flex:none}
.verdict p{margin:6px 0 0;font-size:16px}
.verdict .why{font-weight:600}
.v-stop{background:var(--stop-bg);border-color:var(--stop-s);color:var(--stop)}
.v-warn{background:var(--warn-bg);border-color:var(--warn-s);color:var(--warn)}
.v-ok{background:var(--ok-bg);border-color:var(--ok-s);color:var(--ok)}
.v-na{background:var(--na-bg);border-color:var(--line);color:var(--na)}
.verdict p{color:var(--text)}
.now{font-size:17px;font-weight:700;margin:0 0 12px;padding:12px 14px;border-left:5px solid var(--stop-s);background:var(--card);border-radius:0 14px 14px 0}
details.safe>summary{list-style:none;display:flex;align-items:center;justify-content:space-between;font-weight:700;font-size:17px;min-height:44px;cursor:pointer}
details.safe>summary::-webkit-details-marker{display:none}
details.safe>summary::after{content:"›";transform:rotate(90deg);font-size:22px;color:var(--soft)}
details.safe:not([open])>summary::after{transform:none}
.q{padding:12px 0;border-top:1px solid var(--line)}
.q:first-of-type{border-top:0;padding-top:4px}
.q>p{margin:0 0 8px;font-weight:600}
.yn{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.yn button{min-height:50px;border-radius:14px;border:1px solid var(--line);background:var(--card2);font-weight:700;font-size:17px}
.yn button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.ans{margin-top:8px;padding:10px 12px;border-radius:12px;font-size:15px;background:var(--card2)}
.ans.s2{background:var(--stop-bg)}.ans.s1{background:var(--warn-bg)}.ans.s0{background:var(--ok-bg)}
.ans .btn{margin-top:8px}
.opts{display:grid;gap:8px}
.opt{min-height:52px;padding:10px 14px;border-radius:14px;border:1px solid var(--line);background:var(--card2);text-align:left;font-weight:600;font-size:16px}
.opt[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.fxlist{display:grid;gap:8px}
.fxbtn{display:flex;gap:10px;align-items:center;min-height:56px;padding:10px 12px;border-radius:14px;border:1px solid var(--line);background:var(--card2);text-align:left;width:100%}
.fxbtn b{display:block;font-size:16px}
.fxbtn small{display:block;color:var(--muted)}
.fxbtn .lv{flex:none}
.fxbtn>div{flex:1}
.no{margin:0;padding-left:20px;color:var(--stop)}
.no li{margin:4px 0}
.no li span{color:var(--text)}

/* Diagnostic */
.diag-grid{display:block}
@media (min-width:900px){.seg-diag{display:none}.diag-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:16px;align-items:start}.diag-grid .seg-diag{display:none}.diag-grid .pane{display:block!important}.diag-grid .gohyp{display:none}}
.seg-diag{position:sticky;top:calc(env(safe-area-inset-top) + 69px);z-index:20;margin:-4px 0 12px;background:var(--bg);padding:4px 0}
.ctxcard{display:flex;align-items:center;gap:10px}
.ctxcard>div{flex:1}
.ctxcard b{display:block}

var FIXES=[
{id:"hose",n:"Durite d’air ou de dépression déboîtée / fendue",r:"th",lvl:1,
ctx:"Sifflement ou souffle, mode dégradé, fumée noire (turbo) ; durite de dépression fendue (ralenti instable, frein dur).",

lim:"En douceur, sans pleine charge (≈ 2 500 tr/min max), quelques dizaines de km jusqu’au garage ; contrôle tous les 20 km.",
risk:"La réparation lâche sous la pression : retour du mode dégradé. Une fuite avant le turbo (côté filtre) peut laisser entrer des débris : rouler encore plus doucement. Durite de servofrein : freinage plus dur si elle relâche."},

how:["Attendre au moins 30 min moteur coupé : ne jamais ouvrir le vase chaud.","Essuyer, sécher, bander serré en dépassant largement la fente, rilsans aux extrémités.","Refaire le niveau à froid avec de l’eau ou du liquide.","Démarrer, chauffage à fond, surveiller l’aiguille et la réparation 5 min avant de partir."],

mat:"Pince à fusibles (dans la boîte), fusible de rechange ou emprunté à un circuit non essentiel (radio, prise 12 V, sièges chauffants).",
how:["Contact coupé, repérer le fusible grâce au schéma (couvercle ou notice).","Contrôler le filament : coupé = grillé.","Remplacer par un fusible de MÊME calibre (même couleur, même ampérage).","S’il regrille aussitôt : ne pas insister, il y a un court-circuit."],
lim:"Durable si le fusible tient.",
risk:"Jamais un calibre supérieur, du papier aluminium ou un fil : incendie du faisceau."},
{id:"relay",n:"Échanger un relais (pompe, ventilateur, démarrage)",r:"",lvl:0,
ctx:"Pompe à carburant muette, ventilateur qui ne démarre pas, relais qui ne claque plus.",
mat:"Un relais identique (même référence) pris sur un circuit non essentiel : klaxon, antibrouillards, lave-phares.",
how:["Contact coupé, repérer les relais identiques dans la boîte moteur.","Échanger le relais suspect avec un relais de même référence.","Tester ; tapoter le relais suspect peut aussi le relancer un moment."],
lim:"Durable avec un relais sain ; racheter celui qui manque.",
risk:"Ne jamais ponter un relais avec un fil sans fusible (court-circuit, incendie)."},
{id:"wire",n:"Reconnecter un fil ou un connecteur",r:"",lvl:1,
ctx:"Connecteur débranché, fil coupé ou frotté (capteur, éclairage, béquille, ABS, régulateur moto).",
mat:"Couteau ou pince, ruban isolant / chatterton, rilsans, dégrippant hydrofuge (WD-40).",
how:["Contact coupé (batterie débranchée pour un fil d’alimentation).","Connecteur : nettoyer, sécher, un peu de dégrippant, renfoncer jusqu’au clic.","Fil coupé : dénuder 1 cm de chaque côté, torsader serré, isoler soigneusement, fixer au rilsan loin de l’échappement et des pièces mobiles."],
lim:"Provisoire : faire souder et gainer.",
risk:"Ne jamais toucher un fil orange (haute tension) ni jaune (airbag). Un fil mal isolé peut provoquer un court-circuit."},
{id:"standBypass",n:"Contacteur de béquille (moto) défaillant : le shunter provisoirement",t:"moto",r:"",lvl:2,
ctx:"Moto qui ne démarre pas ou coupe en passant la 1re alors que la béquille est rangée.",
mat:"Petit morceau de fil, ruban isolant, nettoyant contact ou dégrippant.",
how:["D’abord nettoyer le contacteur (boue, oxydation) et vérifier son ressort.","Sinon : débrancher le connecteur du contacteur et relier les deux fils côté faisceau (selon le schéma de la moto), isoler.","Tester au point mort puis en 1re."],
lim:"Quelques jours, jusqu’au remplacement du contacteur.",
risk:"Plus de sécurité béquille : partir béquille dépliée = chute au premier virage à gauche. Vérifier à chaque départ."},
{id:"dryIgn",n:"Sécher un allumage humide",r:"pet",lvl:0,
ctx:"Ratés ou refus de démarrer après une forte pluie, un lavage ou un passage dans l’eau.",
mat:"Chiffon sec, papier, dégrippant hydrofuge (WD-40), soufflette si possible.",
how:["Moteur coupé : essuyer bobines, capuchons de bougies, fils.","Déposer les bobines crayon si possible et sécher le puits de bougie.","Pulvériser un peu de dégrippant hydrofuge sur les connecteurs, remonter, démarrer."],
lim:"Durable si l’eau ne revient pas ; contrôler joints et capuchons poreux.",
risk:"Ne pas toucher l’allumage moteur tournant (décharge haute tension). Après un gué : si de l’eau a pu être aspirée par l’admission, NE PAS démarrer (casse moteur)."},
{id:"pumpTap",n:"Réveiller une pompe à carburant fatiguée",r:"th",lvl:1,
ctx:"Aucun bourdonnement de pompe au contact, coupure à chaud, refus de démarrer.",
mat:"Un objet dur (manche de cric, maillet) ; un relais de rechange.",
how:["Repérer la pompe (sous la banquette arrière ou sous le réservoir).","Un tiers met le contact ou actionne le démarreur pendant que vous tapez quelques coups secs sous le réservoir.","Si ça part : rouler sans couper le moteur jusqu’au garage."],
lim:"Elle peut lâcher à tout moment : trajet direct vers un garage.",
risk:"Jamais sur un réservoir abîmé ou qui fuit. Ni flamme ni étincelle."},
{id:"fuelEmpty",n:"Panne sèche",r:"th",lvl:0,
ctx:"Coupure après une longue période de jauge basse.",
mat:"Jerrican homologué (5 L), entonnoir.",
how:["Feux de détresse, se mettre à l’abri. Sur autoroute : dépanneur via borne orange ou 112.","Verser au moins 5 L.","Essence : mettre le contact 3 à 4 fois quelques secondes avant de démarrer (la pompe remplit le circuit).","Diesel : voir « Réamorcer un diesel »."],
lim:"Jusqu’à la station la plus proche.",
risk:"Jamais de carburant dans une bouteille d’eau. Ne pas insister au démarreur (batterie, catalyseur)."},
{id:"primeDiesel",n:"Réamorcer un diesel",r:"dsl",lvl:0,
ctx:"Diesel qui ne démarre plus après une panne sèche ou une intervention sur le filtre.",
mat:"Carburant, chiffon.",
how:["Moteur à poire d’amorçage : la presser jusqu’à ce qu’elle durcisse.","Common rail moderne : mettre puis couper le contact 5 à 10 fois (quelques secondes à chaque fois) pour laisser la pompe électrique remplir le circuit.","Démarreur par essais de 10 s maximum, 30 s de pause entre chaque."],
lim:"Normal une fois démarré.",
risk:"Ménager batterie et démarreur. Ne jamais desserrer un raccord haute pression moteur tournant : le jet (plus de 1 000 bars) peut causer une blessure grave."},
{id:"waterFuel",n:"Purger l’eau du filtre à gazole",r:"dsl",lvl:0,
ctx:"À-coups et perte de puissance après un plein douteux, voyant « eau dans le gazole ».",
mat:"Récipient, chiffon, tournevis ou clé selon le filtre.",
how:["Moteur arrêté : ouvrir la vis de purge en bas du filtre.","Laisser couler jusqu’à ce que le gazole sorte clair, refermer.","Réamorcer si besoin (contact mis plusieurs fois)."],
lim:"Normal si l’eau était en petite quantité ; sinon faire contrôler le réservoir.",
risk:"Essuyer le gazole tombé sur les pièces chaudes. Récupérer le liquide."},
{id:"wrongFuel",n:"Erreur de carburant",r:"th",lvl:2,
ctx:"Mauvais carburant mis dans le réservoir.",
mat:"Aucun.",
how:["Moteur PAS encore démarré : ne pas mettre le contact (la pompe se lance), pousser le véhicule hors de la piste.","S’il roule : s’arrêter dès que possible et couper le moteur.","Appeler l’assistance : vidange du réservoir et du circuit."],
lim:"Ne pas rouler.",
risk:"Chaque minute de fonctionnement peut abîmer pompe haute pression et injecteurs (diesel)."},
{id:"dslGel",n:"Gazole figé par le grand froid",r:"dsl",lvl:1,
ctx:"Refus de démarrer ou coupure par grand froid (gazole « été »).",
mat:"Couverture, bouillotte ou bouteille d’eau chaude (pas bouillante).",
how:["Si possible, mettre le véhicule à l’abri, au chaud, quelques heures.","Réchauffer le filtre à gazole avec une bouteille d’eau chaude enveloppée d’un chiffon.","Faire ensuite le plein en gazole « grand froid »."],
lim:"Ne pas repartir avant que le moteur tourne régulièrement.",
risk:"Jamais de flamme, de chalumeau ni de décapeur thermique près du circuit de carburant."},
{id:"flooded",n:"Dénoyer un moteur essence",r:"pet",lvl:0,
ctx:"Forte odeur d’essence après plusieurs essais, moteur qui ne part pas.",
mat:"Aucun.",
how:["Attendre 5 à 10 minutes.","Injection : accélérateur enfoncé à fond pendant le démarreur (l’injection est coupée), essais de 5 à 10 s.","Moto à carburateur : starter fermé, gaz ouverts en grand pendant le démarreur.","Dès que le moteur part : relâcher, laisser chauffer quelques minutes."],
lim:"Normal une fois démarré ; changer les bougies si ça recommence.",
risk:"Essais longs = batterie vide et essence dans le catalyseur."},
{id:"oilTop",n:"Compléter l’huile / rouler avec une fuite légère",r:"th",lvl:1,
ctx:"Niveau sous le minimum, petite fuite, consommation d’huile.",
mat:"Huile moteur (idéalement à la norme du constructeur ; en dépannage, toute huile moteur), chiffon, entonnoir.",
how:["Véhicule à plat, moteur arrêté depuis 5 min : lire la jauge.","Ajouter 0,5 L à la fois, attendre, relire ; ne pas dépasser MAX.","Démarrer : le voyant d’huile doit s’éteindre en 2 à 3 secondes.","Garder de l’huile à bord, contrôler tous les 100 km."],
lim:"Le temps de faire réparer ; arrêt immédiat si le voyant de pression se rallume.",
risk:"Voyant de pression allumé ou cognement : NE PAS ROULER. Trop d’huile abîme aussi moteur et catalyseur. Une fuite sur l’échappement peut prendre feu."},
{id:"dpfRegen",n:"Faire régénérer le filtre à particules en roulant",r:"fap|gpf",lvl:0,
ctx:"Voyant FAP allumé, pas encore (ou peu) de mode dégradé.",
mat:"Une voie rapide.",
how:["Rouler 15 à 20 min sans s’arrêter, vers 2 500 à 3 000 tr/min (rapport inférieur).","Ne pas couper le moteur pendant la régénération (ventilateur, ralenti haut, odeur chaude : normal).","Voyant éteint : c’est réglé ; sinon, régénération à la valise."],
lim:"Respecter les limitations ; ne pas insister si le mode dégradé est sévère.",
risk:"Inefficace si l’additif est vide ou le FAP saturé. Contrôler le niveau d’huile (dilution). Ne pas se garer sur de l’herbe sèche juste après."},
{id:"adblue",n:"Alerte AdBlue : éviter l’immobilisation",r:"adblue",lvl:0,
ctx:"Message AdBlue, compte à rebours « démarrage impossible dans X km ».",
mat:"Bidon d’AdBlue (stations, grandes surfaces).",
how:["Remplir au moins la quantité minimale de la notice (souvent plusieurs litres).","Contact mis 1 à 2 min ou rouler un peu : le message doit disparaître.","Message persistant malgré le plein : défaut du système → aller au garage AVANT la fin du compte à rebours.","Compteur presque à zéro : ne coupez pas le moteur avant d’être arrivé."],
lim:"Les km affichés ; une fois coupé à zéro, le moteur ne redémarre plus.",
risk:"Ne jamais diluer l’AdBlue ni le verser dans le gazole (bouchon bleu dédié)."},
{id:"exhaustWire",n:"Échappement ou pare-chaleur qui pend",r:"th",lvl:1,
ctx:"Ligne d’échappement, pare-chaleur ou silencieux décroché qui traîne ou cogne.",
mat:"Fil de fer, cintre métallique, collier métallique, gants (pas de rilsan plastique : il fond).",
how:["Attendre le refroidissement de l’échappement (brûlures graves).","Suspendre la partie qui pend à un point fixe de la caisse avec du fil de fer, sans la plaquer contre le plancher.","Pare-chaleur irrécupérable : le retirer, le mettre dans le coffre."],
lim:"Vitesse modérée (90 km/h max), contrôle tous les 30 km.",
risk:"Pièce tombée sur la chaussée : danger pour les suivants. Échappement contre l’herbe sèche : incendie. Fuite avant le silencieux : gaz dans l’habitacle → fenêtres entrouvertes, sans recyclage d’air."},
{id:"exhaust",n:"Boucher provisoirement un trou d’échappement",r:"th",lvl:1,
ctx:"Silencieux ou tube percé, bruit fort.",
mat:"Bande ou pâte d’échappement, ou canette découpée + colliers métalliques / fil de fer.",
how:["Échappement froid : brosser la rouille autour du trou.","Appliquer la pâte, ou envelopper la canette ouverte autour du tube et serrer avec 2 colliers métalliques.","Faire chauffer le moteur au ralenti pour durcir la pâte."],
lim:"Quelques centaines de km au mieux.",
risk:"Monoxyde de carbone : jamais de fuite non surveillée près de l’habitacle ; somnolence ou maux de tête = s’arrêter et aérer."},
{id:"bodywork",n:"Pare-chocs, carénage ou garde-boue qui pend",r:"",lvl:0,
ctx:"Élément de carrosserie ou de carénage cassé qui frotte la roue ou risque de tomber.",
mat:"Rilsans, ruban adhésif toilé, sangle, fil de fer.",
how:["Utiliser les trous existants ou percer, relier à une partie fixe avec 2 à 3 rilsans.","Couvrir les arêtes coupantes de ruban adhésif.","Irrécupérable : démonter et ranger dans le coffre."],
lim:"Vitesse modérée, éviter l’autoroute pour un grand élément.",
risk:"Une pièce arrachée à grande vitesse met les autres en danger. Rien ne doit toucher pneu ou frein."},
{id:"noClutch",n:"Rouler sans embrayage (pédale au plancher, câble cassé)",r:"clutch",lvl:2,
ctx:"Câble ou commande d’embrayage cassé, embrayage qui ne débraye plus.",
mat:"Aucun.",
how:["Moteur coupé, route dégagée devant : engager la 1re, pied sur le frein.","Relâcher le frein et actionner le démarreur : le véhicule avance en démarrant (moto : démarrage à la poussette en 2e).","Changer de rapport sans embrayer : relâcher l’accélérateur et pousser le levier en douceur au bon régime.","Pour s’arrêter : point mort à l’approche, puis couper le moteur."],
lim:"Itinéraire court et dégagé, sans circulation dense, jusqu’au garage le plus proche.",
risk:"Démarreur très sollicité (essais de 3 à 4 s maximum). Boîte malmenée si le régime n’est pas synchronisé. Pas de manœuvre fine : risque de collision. Un contacteur de sécurité peut empêcher le démarrage en vitesse."},
{id:"clutchPump",n:"Récupérer un embrayage hydraulique en pompant",r:"clutch",lvl:1,
ctx:"Pédale d’embrayage molle ou au plancher, vitesses qui craquent.",
mat:"Liquide de frein DOT (même type que celui du bocal) si le niveau est bas.",
how:["Vérifier le bocal (souvent commun avec les freins) : compléter si bas.","Pomper rapidement la pédale 10 à 20 fois, puis la relever à la main.","Pression revenue : rouler en anticipant, sans attendre longtemps pédale relâchée."],
lim:"Quelques km ; sinon « Rouler sans embrayage ».",
risk:"Bocal commun avec les freins : un niveau très bas peut aussi menacer le freinage — vérifier la pédale de frein."},
{id:"chainMoto",n:"Chaîne de moto déraillée ou trop détendue",t:"moto",r:"chainT",lvl:2,
ctx:"Chaîne sortie de la couronne ou qui claque fort.",
mat:"Trousse à outils de la moto (clés d’axe et de tendeurs), gants, chiffon.",
how:["Moto sur béquille, moteur coupé, point mort.","Remettre la chaîne sur le pignon, puis la guider sur la couronne en tournant la roue à la main.","Desserrer l’axe, régler les tendeurs du même nombre de tours de chaque côté (flèche du manuel), resserrer fort l’axe.","Vérifier l’alignement de la roue et la goupille / l’écrou d’axe."],
lim:"50 km/h max, contrôle tous les 10 km, jusqu’au garage.",
risk:"Une chaîne qui saute peut bloquer la roue arrière ou percer le carter : chute. Chaîne cassée : ne pas rouler (sauf attache rapide de rechange)."},
{id:"puncture",n:"Crevaison voiture : roue de secours ou kit",t:"car",r:"",lvl:1,
ctx:"Pneu à plat ou qui se dégonfle, objet planté dans la bande de roulement.",
mat:"Roue de secours ou galette, cric et clé, ou kit anti-crevaison (compresseur + produit), gants.",
how:["Sol dur et plat, loin de la circulation : feux de détresse, gilet, triangle si sans danger.","Kit : injecter le produit par la valve, regonfler à la pression indiquée, rouler 5 km, recontrôler.","Roue : débloquer les écrous au sol, lever, changer, serrer en croix ; resserrer après 50 km."],
lim:"Galette ou kit : 80 km/h maximum (voir l’étiquette), de quelques dizaines à 200 km selon la notice.",
risk:"Le kit ne marche pas sur un flanc entaillé ou une grande coupure. Ne jamais rouler à plat. Sur autoroute, faire intervenir le dépanneur."},
{id:"punctureMoto",n:"Crevaison moto : mèche ou bombe",t:"moto",r:"",lvl:2,
ctx:"Pneu tubeless percé par un clou ou une vis dans la bande de roulement.",
mat:"Kit mèches (râpe, aiguille, mèches, colle), cartouches CO₂ ou mini-compresseur ; bombe anti-crevaison.",
how:["Repérer l’objet et l’extraire à la pince.","Passer la râpe, enfiler une mèche dans l’aiguille, l’enfoncer aux deux tiers, retirer l’aiguille d’un coup sec, couper la mèche à 5 mm.","Regonfler, vérifier l’étanchéité à l’eau savonneuse."],
lim:"80 km/h max, angles prudents, direct chez un professionnel (remplacement conseillé).",
risk:"Perte de pression soudaine = chute. Pneu à chambre à air : pas de mèche (bombe seulement). Jamais sur le flanc."},
{id:"tow",n:"Remorquage et attente du dépannage",r:"",lvl:1,
ctx:"Panne non réparable sur place : freins, direction, voyant d’huile, casse moteur, fuite de carburant.",
mat:"Barre de remorquage rigide de préférence, anneau de remorquage vissable (dans le coffre).",
how:["Autoroute ou voie rapide : uniquement un dépanneur agréé (borne orange ou 112).","Ailleurs, sur courte distance : anneau vissé à fond, barre rigide, contact mis (direction déverrouillée), feux de détresse.","Boîte automatique, hybride, électrique, 4x4 : voir la notice (souvent interdit roues motrices au sol)."],
lim:"Quelques km à faible vitesse jusqu’au lieu sûr le plus proche.",
risk:"Moteur coupé : direction et freins sans assistance (efforts bien plus grands). Jamais une sangle souple pour un véhicule sans freins."},
{id:"gplPetrol",n:"Basculer sur l’essence (panne GPL)",r:"gpl",lvl:0,
ctx:"Le GPL coupe, rebascule tout seul, à-coups en mode GPL.",

how:["Appuyer sur le commutateur pour forcer le mode essence.","Laisser chauffer le moteur plus longtemps avant de repasser en GPL (détendeur froid).","Odeur de gaz : fermer la vanne manuelle du réservoir GPL (selon le kit), aucune flamme, ne plus rouler en GPL."],
lim:"Aucune en mode essence.",
risk:"Le GPL est plus lourd que l’air et s’accumule au sol : pas de parking souterrain en cas de fuite."},
{id:"runaway",n:"Diesel qui s’emballe tout seul",r:"dsl",lvl:3,
ctx:"Le régime monte seul jusqu’au rupteur, fumée bleue ou blanche épaisse, le moteur ne s’arrête pas en coupant le contact (il brûle son huile via le turbo).",
mat:"Aucun (extincteur si disponible).",
how:["Boîte manuelle : s’arrêter, frein à main serré, pied sur le frein, engager le rapport le plus haut (5e / 6e) et relâcher l’embrayage d’un coup pour caler le moteur.","Sinon, ou si ça ne marche pas : faire sortir tout le monde et s’éloigner du véhicule."],
lim:"Ne pas redémarrer : dépanneuse.",
risk:"Phénomène violent (casse moteur, incendie). Ne pas ouvrir le capot, ne pas approcher les mains de l’admission."},
{id:"batDisconnect",n:"Isoler la batterie (odeur de brûlé électrique)",r:"",lvl:2,
ctx:"Odeur de plastique brûlé, fumée sous le tableau de bord ou le capot, fusible qui regrille.",
mat:"Clé de 10, gants.",
how:["Couper le contact, faire sortir tout le monde.","Aucune flamme : ouvrir le capot prudemment et débrancher la borne – de la batterie.","Flammes : ne pas ouvrir grand le capot, s’éloigner, appeler le 18 ou le 112."],
lim:"Ne pas repartir avant contrôle.",

{id:"steerAssist",n:"Direction assistée perdue",t:"car",r:"",lvl:2,
ctx:"Direction soudainement très dure.",

how:["Se garer, couper le moteur, attendre 1 min, redémarrer (assistance électrique).","Hydraulique : vérifier le niveau du bocal et la courroie, compléter si bas.","Toujours dure : au pas jusqu’à un lieu sûr en anticipant chaque virage."],
lim:"Petite vitesse uniquement (30 km/h max), trajet court.",
risk:"Effort de braquage très élevé : risque de ne pas tourner à temps. Jeu ou bruit dans la direction : NE PAS ROULER."}

function $(s,r){return (r||document).querySelector(s);}
function $$(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function norm(s){return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();}
function lbl(list,k){for(var i=0;i<list.length;i++)if(list[i][0]===k)return list[i][1];return '';}
function fIso(iso){var d=Date.parse(iso);return isFinite(d)?new Date(d).toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'}):'—';}
function fIsoT(iso){var d=Date.parse(iso);return isFinite(d)?new Date(d).toLocaleString('fr-FR',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'—';}
function daysSince(iso){var d=Date.parse(iso);return isFinite(d)?(Date.now()-d)/864e5:Infinity;}
function inDaysIso(n){return new Date(Date.now()+n*864e5).toISOString();}
function todayISO(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function isIOS(){var u=navigator.userAgent||'';return /iPhone|iPad|iPod/.test(u)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);}
function isStandalone(){try{return window.navigator.standalone===true||window.matchMedia('(display-mode: standalone)').matches;}catch(e){return false;}}
function envFrame(){try{return window.self!==window.top;}catch(e){return true;}}

  o.en=inList(o.type==='car'?EN_CAR:EN_MOTO,str(c.en));
  var eq=obj(c.eq);Object.keys(EQ_L).forEach(function(k){if(eq[k])o.eq[k]=1;});
  o.box=inList(BOX,str(c.box));o.dist=inList(DIST,str(c.dist));o.km=inList(KMS,str(c.km));o.arch=inList(ARCH,str(c.arch));o.trans=inList(TRANS,str(c.trans));o.cool=inList(COOL,str(c.cool));
  o.fam=FAM[str(c.fam)]&&FAM[str(c.fam)].t===o.type?str(c.fam):'';o.vname=str(c.vname).slice(0,60);return o;}
function cleanCase(c){c=obj(c);var o=newCase();o.id=str(c.id)||uid();o.title=str(c.title).slice(0,120);o.notes=str(c.notes);
  o.sym=(Array.isArray(c.sym)?c.sym:[]).filter(function(s){return SYM[s];});o.cond=(Array.isArray(c.cond)?c.cond:[]).filter(function(s){return lbl(CONDS,s);});
  var ck=obj(c.ck);Object.keys(ck).forEach(function(k){if(!CA[k])return;var m=obj(ck[k]),x={};Object.keys(m).forEach(function(i){if(m[i]===1||m[i]===-1)x[i]=m[i];});o.ck[k]=x;});
  var st=obj(c.st);Object.keys(st).forEach(function(k){if(CA[k]&&(st[k]===1||st[k]===-1))o.st[k]=st[k];});
  var ea=obj(c.eans);Object.keys(ea).forEach(function(k){if(!EM[k])return;var m=obj(ea[k]),x={};Object.keys(m).forEach(function(i){if(m[i]==='y'||m[i]==='n')x[i]=m[i];});o.eans[k]=x;});
  var ec=obj(c.ech);Object.keys(ec).forEach(function(k){if(EM[k]&&typeof ec[k]==='number')o.ech[k]=ec[k];});
  if(c.ctx)o.ctx=cleanCtx(c.ctx);if(c.top)o.top=str(c.top);
  o.created=str(c.created)||o.created;o.updated=str(c.updated)||o.updated;return o;}
function migrate(d){
  if(!d||typeof d!=='object') return blank();
  var o=blank();
  o.ctx=cleanCtx(d.ctx);o.cur=cleanCase(d.cur);delete o.cur.ctx;
  o.cases=(Array.isArray(d.cases)?d.cases:[]).filter(function(c){return c&&typeof c==='object';}).map(cleanCase);
  var k=obj(d.kit);KIT.forEach(function(x,i){if(k[i])o.kit[i]=1;});
  o.settings.assist=str(obj(d.settings).assist).replace(/[^\d+ ]/g,'').slice(0,20);
  var u=obj(d.ui);for(var uk in o.ui){if(u[uk]!=null&&typeof u[uk]===typeof o.ui[uk])o.ui[uk]=u[uk];}
  var m=obj(d.meta);for(var mk in o.meta){if(typeof m[mk]==='string')o.meta[mk]=m[mk];}
  return o;
}

/* ================= Contexte → traits ================= */
var T={},U={};
function computeTraits(){
  var c=S.ctx;T={};U={};T[c.type]=1;var e=c.en;
  if(c.type==='car'){
    if(!e){U.en=1;}
    else if(e==='ev'){T.ev=1;T.hv=1;T.plug=1;}
    else{T.th=1;T.liq=1;if(e==='diesel')T.dsl=1;else T.pet=1;if(e==='ess_turbo')T.turbo=1;if(e==='hev'||e==='phev'){T.hyb=1;T.hv=1;}if(e==='phev')T.plug=1;if(e==='gpl')T.gpl=1;
      (EQ_BY[e]||[]).forEach(function(k){if(c.eq[k])T[k]=1;});}
    if(e!=='ev'){if(c.box){T[c.box]=1;if(c.box==='man')T.clutch=1;}else U.box=1;
      if(c.dist)T[c.dist]=1;else{U.dist=1;T.dUnk=1;}}
  }else{
    if(!e)U.en=1;else if(e==='ev'){T.ev=1;T.hv=1;T.plug=1;}else{T.th=1;T.pet=1;T[e]=1;T.dChain=1;}
    if(c.trans){T[c.trans]=1;if(c.trans!=='cvt'){T.clutch=1;T.man=1;}}else{U.trans=1;U.box=1;}
    if(e!=='ev'){if(c.cool)T[c.cool]=1;else U.cool=1;}
    if(c.arch){if(c.arch!=='mono')T.multi=1;}else U.arch=1;
  }
}
function softF(a){var b=0;for(var g in U){if(SOFT[g]&&SOFT[g][a]&&SOFT[g][a]>b)b=SOFT[g][a];}return b;}
function reqF(r){
  if(!r)return 1;var f=1,t=r.split(' ');
  for(var i=0;i<t.length;i++){var tok=t[i];if(!tok)continue;
    if(tok.charAt(0)==='!'){if(T[tok.slice(1)])return 0;continue;}
    var alts=tok.split('|'),best=0;
    for(var j=0;j<alts.length;j++){var a=alts[j],v=T[a]?1:softF(a);if(v>best)best=v;}
    if(!best)return 0;f*=best;}
  return f;
}
function symOK(id){var s=SYM[id];return s&&reqF(s.r)>0;}
function fixOK(f){return (!f.t||f.t===S.ctx.type)&&reqF(f.r)>0;}
function curFam(){var f=FAM[S.ctx.fam];return f&&f.t===S.ctx.type?f:null;}
function ctxParts(){
  var c=S.ctx,p=[];
  p.push(c.type==='moto'?'Moto':'Voiture');
  if(c.en)p.push(lbl(c.type==='car'?EN_CAR:EN_MOTO,c.en));
  if(c.type==='car'&&c.en)(EQ_BY[c.en]||[]).forEach(function(k){if(c.eq[k]&&!(c.en==='ess_turbo'&&k==='di'))p.push(EQ_L[k]);});
  if(c.type==='moto'&&c.trans)p.push(lbl(TRANS,c.trans));
  var f=curFam();if(f)p.push(f.n.replace(/\s*\(.*$/,''));
  return p;
}

/* ================= Moteur de déduction ================= */
var M=null;
function compute(){
  computeTraits();
  var sel=S.cur.sym.filter(symOK),n=sel.length,conds=S.cur.cond,fam=curFam(),res=[],excl=[],pen={};
  CAUSES.forEach(function(c){
    var rf=reqF(c.r);if(!rf)return;
    if(c.fo){if(fam&&c.fo.indexOf(fam.id)<0)return;if(!fam)rf*=0.6;}
    var st=S.cur.st[c.id]||0,m=[],raw=0,strong=0;
    sel.forEach(function(s){var w=c.syw[s];if(w){raw+=w;m.push([s,w]);if(w===3)strong++;}});
    if(!raw&&st!==1)return;
    if(st===-1){excl.push(c);return;}
    var cov=n?m.length/n:0,sc=Math.max(raw,1)*(0.35+0.65*cov)*(strong?1.15:1),cm=[],tn=[];
    conds.forEach(function(k){var w=c.cw[k];if(w){sc*=1+0.22*w;cm.push(k);}});
    sc*=[0,0.75,1,1.25][c.b]||1;
    for(var t in c.fw){if(T[t]){sc*=c.fw[t];if(c.fw[t]>1)tn.push(t);}}
    var kmf=c.kmw[S.ctx.km]||1;sc*=kmf;
    var dz=fam&&fam.dm[c.id];if(dz)sc*=dz[0];
    sc*=rf;
    var ck=S.cur.ck[c.id]||{},nA=0,nN=0,nA2=0;
    c.ck.forEach(function(k,i){var a=ck[i];if(a===1){sc*=1+0.35*k[3];nA++;if(k[3]===2)nA2++;}else if(a===-1){sc*=1-0.22*k[3];nN++;}});
    if(st===1)sc*=5;
    if(st===1||nA2){c.alt.forEach(function(a){pen[a[0]]=(pen[a[0]]||1)*(st===1?0.6:Math.pow(0.85,nA2));});}
    res.push({c:c,sc:sc,m:m,cm:cm,tn:tn,kmf:kmf,dz:dz,rf:rf,nA:nA,nN:nN,st:st});
  });
  res.forEach(function(r){if(pen[r.c.id]&&r.st!==1)r.sc*=pen[r.c.id];});
  res.sort(function(a,b){return (b.st===1)-(a.st===1)||b.sc-a.sc;});
  var tot=0;res.slice(0,15).forEach(function(r){tot+=r.sc;});
  res.forEach(function(r){r.pct=tot?Math.min(99,Math.round(r.sc/tot*100)):0;r.rel=res.length?r.sc/res[0].sc:0;});
  return {res:res,excl:excl,sel:sel,n:n};
}
function probLbl(r){if(r.st===1)return 'Piste confirmée';return r.pct>=35?'Très probable':r.pct>=18?'Probable':r.pct>=8?'Possible':'Peu probable';}

function emOK(e){return (!e.t||e.t===S.ctx.type)&&reqF(e.r)>0;}
function qOK(q){return reqF(q.r)>0;}
function emVerdict(e){
  var A=S.cur.eans[e.id]||{},best=null,txt='';
  e.qs.forEach(function(q,i){if(!qOK(q))return;var a=A[i];if(!a)return;var r=q[a];if(!r||r.v==null)return;if(best===null||r.v>best){best=r.v;txt=r.t||'';}});
  return best===null?{v:e.v,t:''}:{v:best,t:txt};
}

function vdBox(v,txt){var k=v==null?'na':v,d=VERD[k],ic={ok:IC.ok,warn:IC.warn,stop:IC.stop,na:IC.na}[d[0]];

function vEm(e){

    h+='<div class="card"><div class="card-h"><h3>'+esc(e.choice.q)+'</h3></div><div class="opts">'+e.choice.o.map(function(o,i){if(o[3]&&!reqF(o[3]))return '';return '<button class="opt" data-act="ech" data-id="'+e.id+'" data-i="'+i+'" aria-pressed="'+(ci===i)+'">'+esc(o[0])+'</button>';}).join('')+'</div></div>';
    if(ci!=null&&e.choice.o[ci]){var o=e.choice.o[ci];fx=o[2].concat(fx);syms=syms.concat(o[1]);}}
  var qs=e.qs.map(function(q,i){return [q,i];}).filter(function(x){return qOK(x[0]);});
  if(qs.length){h+='<div class="card"><div class="card-h"><h3>Vérifications rapides</h3><small class="muted">sans outil</small></div>'+qs.map(function(x){var q=x[0],i=x[1],a=A[i],r=a?q[a]:null;
      if(r){(r.fx||[]).forEach(function(f){fx.unshift(f);});(r.sym||[]).forEach(function(s){syms.push(s);});}

      (r&&(r.t||r.go||r.v!=null)?'<div class="ans s'+(r.v==null?'':r.v)+'">'+(r.v!=null?'<b>'+esc(VERD[r.v][1])+'.</b> ':'')+esc(r.t||'')+(r.go&&EM[r.go]?'<div><button class="btn sm" data-act="em" data-id="'+r.go+'">Voir : '+esc(EM[r.go].n)+' ›</button></div>':'')+'</div>':'')+'</div>';}).join('')+'</div>';}
  var seen={};fx=fx.filter(function(f){if(seen[f]||!FX[f]||!fixOK(FX[f]))return false;seen[f]=1;return true;});

  return h;

function symList(){
  var q=norm(S.ui.q).trim(),words=q.split(/\s+/).filter(Boolean),out='',last='';
  var L=SYM0.map(function(a){return SYM[a[0]];}).filter(function(s){

    return S.ui.sf==='all'||s.fam===S.ui.sf;});
  if(!L.length)return '<p class="muted" style="padding:8px 4px">Aucun symptôme ne correspond'+(q?' à « '+esc(S.ui.q)+' »':'')+'.</p>';
  out='<div class="symlist">';

function paneHyp(){

  }

function whyLines(r){
  var c=r.c,L=[],un=M.sel.filter(function(s){return !c.syw[s];});
  L.push('Colle avec : '+r.m.map(function(x){return SYM[x[0]].n.toLowerCase()+(x[1]===3?' (signe typique)':'');}).join(', ')+'.');
  if(un.length)L.push('N’explique pas : '+un.map(function(s){return SYM[s].n.toLowerCase();}).join(', ')+'.');
  if(r.cm.length)L.push('Conditions cohérentes : '+r.cm.map(function(k){return lbl(CONDS,k).toLowerCase();}).join(', ')+'.');
  var eqs=c.r.split(' ').map(function(t){return t.split('|')[0];}).filter(function(t){return t&&t.charAt(0)!=='!'&&TRAIT_TXT[t]&&T[t]&&['car','moto','th'].indexOf(t)<0;});
  if(eqs.length)L.push('Concerne votre '+eqs.map(function(t){return TRAIT_TXT[t];}).join(' / ')+'.');
  if(r.tn.length)L.push('Piste plus fréquente sur '+r.tn.map(function(t){return TRAIT_TXT[t]||t;}).join(', ')+'.');
  if(r.kmf>1)L.push('Plus fréquent à ce kilométrage.');else if(r.kmf<1)L.push('Moins fréquent à ce kilométrage.');
  if(r.rf<1)L.push('À confirmer : le contexte du véhicule est incomplet.');
  if(r.nA||r.nN)L.push('Contrôles : '+r.nA+' anomalie'+(r.nA>1?'s':'')+', '+r.nN+' normal'+(r.nN>1?'aux':'')+'.');
  return L;
}
function hypCard(r,rank){

  h+='<h4>Réparation durable</h4><p>'+esc(c.rep)+'</p><p class="note">Difficulté : '+DIFF[c.d]+' · Gravité : '+SEV[c.v][1]+'</p>';

    '<li>Touchez <b>Partager</b> '+SHARE_ICON+' dans Safari (sur les iPhone récents, touchez d’abord <b>•••</b>).</li><li>Choisissez <b>« Sur l’écran d’accueil »</b>, puis <b>Ajouter</b>.</li><li>Ouvrez ensuite <b>Diagnostic</b> depuis son icône, et seulement depuis elle.</li></ol>'+
    (S.cases.length?'<p class="note">Déjà des cas ici ? L’appli installée a son propre espace : <b>Réglages → Sauvegarder</b> ici, puis <b>Importer</b> dans l’appli.</p>':'')+'</div>';
  if(deferredPrompt)return '<div class="install"><button class="x close" data-act="hideInstall" aria-label="Masquer">×</button><h3>Installer Diagnostic</h3><p class="muted">Utilisable hors ligne, comme une appli.</p><div class="btns"><button class="btn primary" data-act="installApp">Installer</button></div></div>';
  return '';
}

/* ================= Feuilles & messages ================= */
var toastT=null,SH=null;
function toast(msg,undo,label){var tt=$('#toast');clearTimeout(toastT);
  tt.innerHTML='<span>'+esc(msg)+'</span>'+(undo?'<button class="btn sm" id="toastUndo">'+esc(label||'Annuler')+'</button>':'');tt.classList.add('on');
  if(undo)$('#toastUndo').onclick=function(){tt.classList.remove('on');undo();if(!label)toast('Action annulée');};
  toastT=setTimeout(function(){tt.classList.remove('on');},label?15000:undo?6500:2600);}
function openSheet(kind,title,body,foot){var m=$('#modal');SH=kind;
  m.innerHTML='<div class="sheet" role="dialog" aria-modal="true" aria-label="'+esc(title)+'"><div class="sheet-h"><b>'+esc(title)+'</b><button class="x" data-act="closeModal" aria-label="Fermer">×</button></div><div class="sheet-b">'+body+'</div>'+(foot?'<div class="sheet-f">'+foot+'</div>':'')+'</div>';
  m.hidden=false;document.body.style.overflow='hidden';}
function closeSheet(){var m=$('#modal');m.hidden=true;m.innerHTML='';SH=null;document.body.style.overflow='';}
function confirmBox(title,text,ok,danger,fn){openSheet('confirm',title,'<p class="muted" style="margin:0">'+esc(text)+'</p>','<button class="btn" data-act="closeModal">Annuler</button><button class="btn '+(danger?'danger-fill':'primary')+'" id="cfOk">'+esc(ok)+'</button>');$('#cfOk').onclick=function(){closeSheet();fn();};}
function fixSheet(id){var f=FX[id];if(!f)return;openSheet('fix',f.n,'<p style="margin-top:0">'+lvTag(f.lvl)+'</p>'+fixBody(f),'<button class="btn primary" data-act="closeModal">Fermer</button>');}
function causeSheet(id){var c=CA[id];if(!c)return;computeTraits();var r=M&&M.res.filter(function(x){return x.c.id===id;})[0];
  openSheet('cause',c.n,'<div class="meta">'+sevPill(c.v)+'<span class="pill p-na">'+esc(c.s)+'</span></div>'+causeBody(c,r||null,false),(r?'<button class="btn" data-act="gohyp" data-id="'+id+'">Voir dans le diagnostic</button>':'')+'<button class="btn primary" data-act="closeModal">Fermer</button>');}
/* Contexte du véhicule */
function ctxSheet(){openSheet('ctx','Véhicule et motorisation','<div id="ctxBody">'+ctxBody()+'</div>','<button class="btn primary" data-act="closeModal">Terminé</button>');}
function chipRow(k,list,val,none){return '<div class="chips">'+list.map(function(o){return '<button class="chip" data-act="cx" data-k="'+k+'" data-v="'+o[0]+'" aria-pressed="'+(val===o[0])+'">'+esc(o[1])+'</button>';}).join('')+(none?'<button class="chip" data-act="cx" data-k="'+k+'" data-v="" aria-pressed="'+(!val)+'">Je ne sais pas</button>':'')+'</div>';}
function ctxBody(){
  var c=S.ctx,h='';
  h+='<div class="seg"><button data-act="cx" data-k="type" data-v="car" aria-selected="'+(c.type==='car')+'">Voiture</button><button data-act="cx" data-k="type" data-v="moto" aria-selected="'+(c.type==='moto')+'">Moto / scooter</button></div>';
  h+='<div class="sect"><span>Motorisation / carburant</span></div>'+chipRow('en',c.type==='car'?EN_CAR:EN_MOTO,c.en,false);
  if(c.type==='car'&&EQ_BY[c.en]){h+='<div class="sect"><span>Équipements</span></div><div class="chips">'+EQ_BY[c.en].map(function(k){if(c.en==='ess_turbo'&&k==='turbo')return '';return '<button class="chip" data-act="eq" data-k="'+k+'" aria-pressed="'+!!c.eq[k]+'">'+esc(EQ_L[k])+'</button>';}).join('')+'</div><p class="note">FAP, EGR et AdBlue changent fortement les pistes probables. Dans le doute, laissez les valeurs proposées.</p>';}
  if(c.type==='car'&&c.en!=='ev'){h+='<div class="sect"><span>Boîte de vitesses</span></div>'+chipRow('box',BOX,c.box,true);
    h+='<div class="sect"><span>Distribution</span></div>'+chipRow('dist',DIST,c.dist,true);}
  if(c.type==='moto'){h+='<div class="sect"><span>Architecture</span></div>'+chipRow('arch',ARCH,c.arch,true)+'<div class="sect"><span>Transmission</span></div>'+chipRow('trans',TRANS,c.trans,true);
    if(c.en!=='ev')h+='<div class="sect"><span>Refroidissement</span></div>'+chipRow('cool',COOL,c.cool,true);}
  h+='<div class="sect"><span>Kilométrage</span></div>'+chipRow('km',KMS,c.km,true);
  var fl=FAMS.filter(function(f){return f.t===c.type&&(!c.en||f.en.indexOf(c.en)>=0);});
  h+='<div class="sect"><span>Moteur connu (maladies connues)</span></div><div class="opts"><button class="opt" data-act="cx" data-k="fam" data-v="" aria-pressed="'+(!c.fam)+'">Aucun / je ne sais pas</button>'+fl.map(function(f){return '<button class="opt" data-act="cx" data-k="fam" data-v="'+f.id+'" aria-pressed="'+(c.fam===f.id)+'">'+esc(f.n)+'</button>';}).join('')+'</div>';
  h+='<label class="fld">Nom du véhicule (facultatif)<input class="in" id="cxName" value="'+esc(c.vname)+'" placeholder="ex. Clio de Sam"></label>';
  return h;
}
function applyFam(id){var c=S.ctx,f=FAM[id];if(!f){c.fam='';return;}
  if(f.t!==c.type){c.type=f.t;c.en='';c.eq={};c.box='';c.dist='';c.arch='';c.trans='';c.cool='';}
  if(f.en.indexOf(c.en)<0){c.en=f.en[0];c.eq=JSON.parse(JSON.stringify(EQ_DEF[c.en]||{}));}
  var p=f.pre||{};['dist','box','arch','trans','cool'].forEach(function(k){if(p[k])c[k]=p[k];});
  if(p.eq)Object.keys(p.eq).forEach(function(k){c.eq[k]=p.eq[k];});
  c.fam=id;}
function setCtx(k,v){var c=S.ctx;
  if(k==='type'){if(c.type===v)return;c.type=v;c.en='';c.eq={};c.box='';c.dist='';c.arch='';c.trans='';c.cool='';c.fam='';}
  else if(k==='en'){c.en=v;c.eq=JSON.parse(JSON.stringify(EQ_DEF[v]||{}));var f=FAM[c.fam];if(f&&f.en.indexOf(v)<0)c.fam='';if(v==='ev'){c.box='';c.dist='';c.cool='';}}
  else if(k==='fam'){if(v)applyFam(v);else c.fam='';}
  else c[k]=c[k]===v&&v?'':v;
}
function refreshCtxSheet(){var b=$('#ctxBody');if(!b)return;var sb=$('.sheet-b'),y=sb?sb.scrollTop:0;b.innerHTML=ctxBody();if(sb)sb.scrollTop=y;}

/* ================= Sauvegarde : export / import ================= */
function buildExport(){return JSON.stringify({app:'diagnostic',version:DATA_V,exported:new Date().toISOString(),data:S});}
function exportNow(){var data=buildExport(),fn='diagnostic-'+todayISO()+'.json',blob=new Blob([data],{type:'application/json'});
  function done(){S.meta.lastExport=new Date().toISOString();S.meta.snooze='';save();render(true);toast('Copie de sauvegarde enregistrée');}
  if(DL){DL.save({filename:fn,data:data}).then(done,function(e){toast(e&&e.code==='declined'?'Téléchargement annulé':'Téléchargement impossible ici');});return;}
  if(envFrame()){copyData(data);return;}
  try{var file=new File([blob],fn,{type:'application/json'});
    if((isIOS()||isStandalone()||navigator.maxTouchPoints>0)&&navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file],title:fn}).then(done,function(err){if(err&&err.name==='AbortError')toast('Partage annulé');else dlBlob(blob,fn,done);});return;}
  }catch(e){}
  dlBlob(blob,fn,done);
}
function dlBlob(blob,name,done){try{var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},2000);if(done)done();}catch(e){toast('Téléchargement impossible.');}}
function copyData(data){data=data||buildExport();
  function show(){if(S.ui.tab!=='set'){S.ui.tab='set';render(false);}var ta=$('#expText');ta.hidden=false;ta.value=data;ta.focus();ta.select();toast('Copiez le texte sélectionné');}
  try{if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(data).then(function(){S.meta.lastExport=new Date().toISOString();save();toast('Données copiées dans le presse-papiers');},show);else show();}catch(e){show();}}
function doImport(text){var d;try{d=JSON.parse(text);}catch(e){toast('Contenu illisible : un fichier .json est attendu.');return;}
  if(d&&d.data)d=d.data;
  if(!d||typeof d!=='object'||!(Array.isArray(d.cases)||d.cur)){toast('Ce contenu ne ressemble pas à une sauvegarde de Diagnostic.');return;}
  confirmBox('Importer cette sauvegarde ?','Elle remplacera les données actuelles ('+((d.cases||[]).length)+' cas enregistré(s)).','Importer',false,function(){var prev=JSON.stringify(S),meta=S.meta;S=migrate(d);S.meta=meta;S.ui.tab='cas';save();render(false);toast('Sauvegarde importée',function(){S=migrate(JSON.parse(prev));save();render(false);});});}

/* ================= Actions ================= */
function toggle(arr,v){var i=arr.indexOf(v);if(i>=0)arr.splice(i,1);else arr.push(v);}
function loadSample(i){var s=SAMPLES[i];if(!s)return;var prev=JSON.stringify({ctx:S.ctx,cur:S.cur});
  S.ctx=cleanCtx(s.ctx);S.ctx.vname=s.vname||'';S.cur=newCase();S.cur.title=s.t;S.cur.sym=s.sym.slice();S.cur.cond=s.cond.slice();
  S.ui.tab='diag';S.ui.dtab='hyp';S.ui.open='';S.ui.eid='';touch();save();render(false);window.scrollTo(0,0);
  var top=M.res[0];if(top){S.ui.open=top.c.id;save();render(true);}
  toast('Scénario chargé',function(){var p=JSON.parse(prev);S.ctx=cleanCtx(p.ctx);S.cur=cleanCase(p.cur);delete S.cur.ctx;save();render(false);});}
function openHyp(id){S.ui.tab='diag';S.ui.dtab='hyp';S.ui.open=id;var inList=M.res.some(function(r){return r.c.id===id;});
  if(!inList){S.ui.more=true;}save();render(false);var el=document.getElementById('h-'+id);if(el)el.scrollIntoView({block:'start'});else causeSheet(id);}
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-act]');
  if(!t){if(e.target.id==='modal')closeSheet();return;}
  var a=t.dataset.act,id=t.dataset.id,c=S.cur;
  if(a==='closeModal')closeSheet();
  else if(a==='go'){closeSheet();S.ui.eid='';go(t.dataset.tab);}
  else if(a==='goSet'){go('set');setTimeout(function(){var i=$('#sAssist');if(i)i.focus();},50);}
  else if(a==='ctx')ctxSheet();
  else if(a==='cx'){setCtx(t.dataset.k,t.dataset.v);touch();save();render(true);refreshCtxSheet();}
  else if(a==='eq'){var k=t.dataset.k;if(S.ctx.eq[k])delete S.ctx.eq[k];else S.ctx.eq[k]=1;touch();save();render(true);refreshCtxSheet();}
  else if(a==='em'){closeSheet();S.ui.tab='urg';S.ui.eid=id;save();render(false);window.scrollTo(0,0);}
  else if(a==='emBack'){S.ui.eid='';save();render(false);window.scrollTo(0,0);}
  else if(a==='qa'){var A=c.eans[id]||(c.eans[id]={}),i=t.dataset.i;A[i]=A[i]===t.dataset.a?undefined:t.dataset.a;if(A[i]===undefined)delete A[i];commit();}
  else if(a==='ech'){var n=+t.dataset.i;if(c.ech[id]===n)delete c.ech[id];else c.ech[id]=n;commit();}
  else if(a==='emReset'){delete c.eans[id];delete c.ech[id];commit();}
  else if(a==='emDiag'){var ss=(t.dataset.s||'').split(',').filter(function(s){return SYM[s];});ss.forEach(function(s){if(c.sym.indexOf(s)<0)c.sym.push(s);});S.ui.tab='diag';S.ui.dtab=c.sym.length?'hyp':'sym';S.ui.open='';touch();save();render(false);window.scrollTo(0,0);}
  else if(a==='fx')fixSheet(id);
  else if(a==='fxOpen'){S.ui.fxOpen=S.ui.fxOpen===id?'':id;save();$('#fxList').innerHTML=fxList();}
  else if(a==='dtab'){S.ui.dtab=t.dataset.v;save();render(false);window.scrollTo(0,0);}
  else if(a==='sf'){S.ui.sf=t.dataset.v;S.ui.q='';save();render(true);}
  else if(a==='sym'){toggle(c.sym,id);commit();}
  else if(a==='clearSym'){var p1=c.sym.slice(),p2=c.cond.slice();c.sym=[];c.cond=[];commit();toast('Symptômes effacés',function(){c.sym=p1;c.cond=p2;commit();});}
  else if(a==='cond'){toggle(c.cond,id);commit();}
  else if(a==='clearCond'){c.cond=[];commit();}
  else if(a==='hyp'){S.ui.open=S.ui.open===id?'':id;save();render(true);}
  else if(a==='alt'||a==='gohyp'){closeSheet();if(M.res.some(function(r){return r.c.id===id;}))openHyp(id);else causeSheet(id);}
  else if(a==='ck'){var m=c.ck[id]||(c.ck[id]={}),i2=t.dataset.i,v=+t.dataset.v;if(m[i2]===v)delete m[i2];else m[i2]=v;commit();}
  else if(a==='ckReset'){delete c.ck[id];commit();}
  else if(a==='st'){var v2=+t.dataset.v;if(v2)c.st[id]=v2;else delete c.st[id];if(v2===-1&&S.ui.open===id)S.ui.open='';commit();if(v2===-1)toast('Piste écartée',function(){delete c.st[id];commit();});}
  else if(a==='more'){S.ui.more=!S.ui.more;save();render(true);}
  else if(a==='showEx'){S.ui.showEx=!S.ui.showEx;save();render(true);}
  else if(a==='cause')causeSheet(id);
  else if(a==='mt'){S.ui.mt=t.dataset.v;S.ui.mopen='';save();render(true);}
  else if(a==='mopen'){S.ui.mopen=S.ui.mopen===id?'':id;save();render(true);}
  else if(a==='famSel'){if(id)applyFam(id);else S.ctx.fam='';touch();save();render(true);toast(id?'Moteur choisi : '+FAM[id].n.replace(/\s*\(.*$/,''):'Moteur retiré');}
  else if(a==='dzDiag'){if(S.ctx.fam!==t.dataset.f)applyFam(t.dataset.f);computeTraits();var cz=CA[id];Object.keys(cz.syw).forEach(function(s){if(cz.syw[s]===3&&symOK(s)&&c.sym.indexOf(s)<0)c.sym.push(s);});closeSheet();touch();save();M=compute();openHyp(id);}
  else if(a==='saveCase'){var snap=snapCase(),ix=-1;S.cases.forEach(function(k,j){if(k.id===snap.id)ix=j;});if(ix>=0)S.cases[ix]=snap;else S.cases.push(snap);if(!c.title)c.title=snap.title;save();render(true);toast(ix>=0?'Cas mis à jour':'Cas enregistré');}
  else if(a==='newCase'){var pc=JSON.stringify(S.cur);S.cur=newCase();S.ui.open='';S.ui.dtab='sym';commit();toast('Nouveau diagnostic',function(){S.cur=cleanCase(JSON.parse(pc));delete S.cur.ctx;commit();});}
  else if(a==='openCase'){var k2=S.cases.filter(function(k){return k.id===id;})[0];if(!k2)return;if(k2.ctx)S.ctx=cleanCtx(k2.ctx);S.cur=cleanCase(k2);delete S.cur.ctx;S.ui.tab='diag';S.ui.dtab=S.cur.sym.length?'hyp':'sym';S.ui.open='';save();render(false);window.scrollTo(0,0);toast('Cas ouvert');}
  else if(a==='delCase'){var j2=-1;S.cases.forEach(function(k,j){if(k.id===id)j2=j;});if(j2<0)return;var del=S.cases.splice(j2,1)[0];save();render(true);toast('Cas supprimé',function(){S.cases.splice(j2,0,del);save();render(true);});}
  else if(a==='sample')loadSample(+t.dataset.i);
  else if(a==='export')exportNow();
  else if(a==='copy')copyData();
  else if(a==='importText'){var tx=$('#impText');if(tx&&tx.value.trim())doImport(tx.value.trim());}
  else if(a==='snooze'){S.meta.snooze=inDaysIso(7);save();render(true);}
  else if(a==='hideInstall'){S.meta.installHide=inDaysIso(14);save();render(true);}
  else if(a==='showInstall'){S.meta.installHide='';save();render(true);window.scrollTo(0,0);}
  else if(a==='installApp'){if(deferredPrompt){deferredPrompt.prompt();deferredPrompt.userChoice.then(function(){deferredPrompt=null;render(true);});}}
  else if(a==='checkUpdate'){if(swReg)swReg.update().then(function(){toast('Vérification faite');},function(){toast('Pas de réseau');});}
  else if(a==='reset')confirmBox('Tout effacer ?','Véhicule, diagnostic en cours, cas enregistrés et trousse seront effacés sur cet appareil.','Tout effacer',true,function(){var prev=JSON.stringify(S),meta=S.meta;S=blank();S.meta=meta;save();render(false);toast('Données effacées',function(){S=migrate(JSON.parse(prev));save();render(false);});});
});
document.addEventListener('input',function(e){var t=e.target;
  if(t.id==='sq'){S.ui.q=t.value;save();$('#symList').innerHTML=symList();}
  else if(t.id==='fxq'){S.ui.fxq=t.value;save();$('#fxList').innerHTML=fxList();}
  else if(t.id==='cTitle'){S.cur.title=t.value.slice(0,120);touch();save();}
  else if(t.id==='cNotes'){S.cur.notes=t.value;touch();save();}
  else if(t.id==='cVname'||t.id==='cxName'){S.ctx.vname=t.value.slice(0,60);save();renderHead();}
  else if(t.id==='sAssist'){S.settings.assist=t.value.replace(/[^\d+ ]/g,'').slice(0,20);save();}
});
document.addEventListener('change',function(e){var t=e.target;
  if(t.id==='fxMine'){S.ui.fxAll=!t.checked;save();$('#fxList').innerHTML=fxList();}
  else if(t.dataset&&t.dataset.kit!=null){if(t.checked)S.kit[t.dataset.kit]=1;else delete S.kit[t.dataset.kit];save();render(true);}
  else if(t.id==='impFile'){var fl=t.files&&t.files[0];if(!fl)return;var r=new FileReader();r.onload=function(){doImport(String(r.result));};r.readAsText(fl);t.value='';}
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!$('#modal').hidden)closeSheet();});
$('#tabs').addEventListener('click',function(e){var b=e.target.closest('[data-tab]');if(!b)return;var tab=b.dataset.tab;if(tab==='urg'&&S.ui.tab==='urg')S.ui.eid='';closeSheet();go(tab);});
$('#ctxChip').addEventListener('click',ctxSheet);
$('#setBtn').addEventListener('click',function(){go('set');});
window.addEventListener('pagehide',save);
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='hidden')save();});

/* ================= Démarrage ================= */
S=load();
var upgraded=S.meta.seenVersion!==APP_VERSION&&!!S.meta.seenVersion;
S.meta.seenVersion=APP_VERSION;
save();render(false);
if(upgraded&&!envFrame())setTimeout(function(){toast('Diagnostic est passé en version '+APP_VERSION+'. Vos cas sont intacts.');},400);
if(window.claude&&typeof window.claude.use==='function'){try{window.claude.use('downloads').then(function(d){DL=d||null;},function(){});}catch(e){}}
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)&&!envFrame()){
  var hadController=!!navigator.serviceWorker.controller;
  window.addEventListener('load',function(){try{navigator.serviceWorker.register('sw.js').then(function(r){swReg=r;if(S.ui.tab==='set')render(true);}).catch(function(){});}catch(e){}});
  navigator.serviceWorker.addEventListener('controllerchange',function(){if(hadController){save();toast('Nouvelle version installée',function(){location.reload();},'Recharger');}hadController=true;});
  document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible'&&swReg)swReg.update().catch(function(){});});
}
if(navigator.storage&&navigator.storage.persisted&&!envFrame()){
  navigator.storage.persisted().then(function(p){if(p)return true;return (isStandalone()&&navigator.storage.persist)?navigator.storage.persist():false;}).then(function(p){persisted=!!p;if(S.ui.tab==='set')render(true);}).catch(function(){});
}
window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();deferredPrompt=e;render(true);});
window.addEventListener('appinstalled',function(){deferredPrompt=null;render(true);toast('Diagnostic est installé');});
window.__d={state:function(){return S;},M:function(){return compute();},env:function(){return {standalone:isStandalone(),frame:envFrame(),sw:!!swReg,persisted:persisted,storageOK:storageOK};},migrate:migrate,traits:function(){computeTraits();return T;}};

})();
</script>
