["Organisations",3,"num","Combien de pays de l’Union européenne font partie de la zone euro en 2026 ?",["21","vingt et un"],"La Bulgarie en est devenue le 21e membre le 1er janvier 2026. D’autres territoires (Monaco, Vatican, Kosovo, Monténégro…) utilisent l’euro sans être membres de la zone."],
["Ressources",2,"qcm","Quel détroit, entre l’Iran et la péninsule Arabique, voit passer environ un cinquième du pétrole consommé dans le monde ?",["Ormuz","Bab-el-Mandeb","Malacca","Le Bosphore"],"Large d’environ 40 km au plus étroit, il relie le golfe Persique à la mer d’Oman. Bab-el-Mandeb, lui, ouvre la mer Rouge sur l’océan Indien."],
["Frontières",2,"qcm","Quelle est la plus longue frontière terrestre entre deux pays ?",["Canada – États-Unis","Russie – Kazakhstan","Chine – Mongolie","Argentine – Chili"],"Environ 8 900 km, Alaska compris. La frontière Russie – Kazakhstan, environ 7 600 km, est la plus longue d’un seul tenant."],
["Ressources",1,"qcm","Quel canal relie la mer Méditerranée à la mer Rouge ?",["Le canal de Suez","Le canal de Panama","Le canal de Corinthe","Le canal de Kiel"],"Inauguré en 1869 sous la direction de Ferdinand de Lesseps, il évite le contournement de l’Afrique. L’Égypte l’a nationalisé en 1956."],
["Relations internationales",2,"qcm","Quel traité de 1957 crée la Communauté économique européenne ?",["Le traité de Rome","Le traité de Paris","Le traité de Maastricht","Le traité de Lisbonne"],"Signé le 25 mars 1957 par six pays : France, RFA, Italie, Belgique, Pays-Bas et Luxembourg. Le traité de Paris (1951) avait créé la CECA."],
["Organisations",2,"qcm","Lequel de ces pays n’est pas membre de l’OTAN ?",["L’Autriche","La Finlande","La Suède","La Norvège"],"L’Autriche est neutre depuis 1955. La Finlande (2023) et la Suède (2024) ont rejoint l’Alliance après l’invasion de l’Ukraine par la Russie."],
["Organisations",1,"vf","La Suisse est membre de l’Union européenne.",false,"Faux. La Suisse est liée à l’UE par des accords bilatéraux et fait partie de l’espace Schengen, mais elle n’est pas membre de l’Union."],
["Frontières",2,"qcm","Autour de quel parallèle se situe la ligne de démarcation entre les deux Corées ?",["Le 38e parallèle","Le 17e parallèle","Le 49e parallèle","Le 45e parallèle"],"Fixée en 1945, la limite suit depuis l’armistice de 1953 la ligne de front, bordée d’une zone démilitarisée de 4 km de large. Le 17e parallèle a séparé les deux Vietnam."],
["Ressources",2,"qcm","Quel pays fournit environ les trois quarts du cobalt extrait dans le monde, essentiel aux batteries ?",["La République démocratique du Congo","L’Australie","Le Chili","La Bolivie"],"La RDC domine très largement l’extraction, en partie artisanale. Le raffinage est, lui, majoritairement réalisé en Chine."],
["Ressources",2,"qcm","Quel pays assure la grande majorité du raffinage mondial des terres rares ?",["La Chine","Les États-Unis","La Russie","Le Brésil"],"La Chine raffine environ 90 % des terres rares, indispensables aux aimants des moteurs électriques et des éoliennes."],
["Organisations",2,"qcm","Quel groupe de pays s’élargit en 2024 à l’Égypte, l’Éthiopie, l’Iran et aux Émirats arabes unis ?",["Les BRICS","Le G7","L’Organisation de coopération de Shanghai","La Ligue arabe"],"Lancé par le Brésil, la Russie, l’Inde et la Chine (premier sommet en 2009), rejoint par l’Afrique du Sud en 2011. L’Indonésie y est entrée en 2025."],
["Relations internationales",1,"qcm","Quel accord de 2015 vise à contenir le réchauffement climatique « nettement en dessous de 2 °C » ?",["L’accord de Paris","Le protocole de Kyoto","Le protocole de Montréal","L’accord de Copenhague"],"Adopté à la COP21 par la quasi-totalité des pays du monde. Le protocole de Montréal (1987), lui, protège la couche d’ozone."],
["Frontières",3,"qcm","Comment s’appelle la ligne qui sépare les zones contrôlées par l’Inde et le Pakistan au Cachemire ?",["La ligne de contrôle","La ligne Durand","La ligne McMahon","La ligne Curzon"],"Issue de l’accord de Simla (1972). La ligne Durand sépare l’Afghanistan du Pakistan, la ligne McMahon l’Inde de la Chine (contestée), la ligne Curzon la Pologne de ses voisins de l’Est."],
["Frontières",2,"qcm","Quelle mer est revendiquée en grande partie par la Chine au moyen de la « ligne en neuf traits » ?",["La mer de Chine méridionale","La mer Jaune","La mer du Japon","La mer de Chine orientale"],"Ces revendications empiètent sur les zones du Vietnam, des Philippines, de la Malaisie et de Brunei. Un tribunal arbitral les a jugées sans fondement juridique en 2016."],
["Frontières",2,"qcm","Lequel de ces pays n’a aucun accès à la mer ?",["La Bolivie","Le Pérou","L’Équateur","La Colombie"],"La Bolivie a perdu son littoral face au Chili lors de la guerre du Pacifique (1879-1884) et le réclame toujours."],
["Relations internationales",2,"qcm","Quelle doctrine américaine de 1823 s’oppose à toute ingérence européenne sur le continent américain ?",["La doctrine Monroe","La doctrine Truman","La doctrine Brejnev","La doctrine Wilson"],"« L’Amérique aux Américains » : en échange, les États-Unis promettent de ne pas intervenir dans les affaires européennes. La doctrine Truman (1947) vise l’endiguement du communisme."],
["Relations internationales",3,"ordre","Classez ces élargissements de la construction européenne du plus ancien au plus récent.",["Royaume-Uni, Irlande, Danemark","Grèce","Espagne et Portugal","Autriche, Finlande, Suède","Croatie"],"1973, 1981, 1986, 1995, 2013. Le plus grand élargissement, à dix pays, a eu lieu en 2004."],
["Organisations",2,"qcm","Quelle juridiction de l’ONU, à La Haye, tranche les différends entre États ?",["La Cour internationale de justice","La Cour pénale internationale","La Cour européenne des droits de l’homme","La Cour permanente d’arbitrage"],"La CIJ juge des États. La Cour pénale internationale, également à La Haye mais indépendante de l’ONU, juge des individus pour génocide, crimes contre l’humanité et crimes de guerre."],
["Organisations",3,"vf","La Turquie est membre de l’OTAN depuis 1952.",true,"Vrai. Elle adhère en même temps que la Grèce, lors du premier élargissement. Son armée est aujourd’hui la deuxième de l’Alliance en effectifs."],
["Ressources",3,"qcm","Quel pays possède les plus grandes réserves prouvées de pétrole ?",["Le Venezuela","L’Arabie saoudite","La Russie","Les États-Unis"],"Environ 300 milliards de barils, surtout des pétroles extra-lourds de l’Orénoque, devant l’Arabie saoudite. Sa production reste pourtant faible."],
["Organisations",2,"qcm","Quel bloc commercial, créé en 1991, réunit notamment le Brésil, l’Argentine, le Paraguay et l’Uruguay ?",["Le Mercosur","L’ALENA","L’ASEAN","La Communauté andine"],"Créé par le traité d’Asunción. La Bolivie en est devenue membre de plein droit en 2024."],
["Organisations",2,"num","Combien d’États sont membres de l’ONU ?",["193"],"Le dernier admis est le Soudan du Sud, en 2011. Le Saint-Siège et la Palestine ont un statut d’observateur."],
["Relations internationales",3,"qcm","Quels accords de 1995 mettent fin à la guerre de Bosnie-Herzégovine ?",["Les accords de Dayton","Les accords d’Oslo","Les accords de Camp David","Les accords d’Évian"],"Négociés dans l’Ohio et signés à Paris en décembre 1995, ils divisent la Bosnie en deux entités : la Fédération croato-musulmane et la Republika Srpska."],
["Frontières",2,"qcm","Quel pays possède l’enclave de Kaliningrad, entre la Pologne et la Lituanie ?",["La Russie","La Biélorussie","L’Allemagne","L’Ukraine"],"Ancienne Königsberg prussienne, rattachée à l’URSS en 1945. Elle abrite la flotte russe de la Baltique."],
["Équilibres mondiaux",2,"qcm","Quel pays est la deuxième économie mondiale en PIB nominal ?",["La Chine","Le Japon","L’Allemagne","L’Inde"],"Derrière les États-Unis. La Chine a dépassé le Japon en 2010 ; l’Allemagne est passée au troisième rang en 2023."],
["Équilibres mondiaux",3,"qcm","Quels pays sont membres du G7 ?",["Allemagne, Canada, États-Unis, France, Italie, Japon, Royaume-Uni","Allemagne, Chine, États-Unis, France, Inde, Japon, Royaume-Uni","Brésil, Canada, États-Unis, France, Italie, Japon, Russie","Allemagne, Canada, Espagne, États-Unis, France, Japon, Royaume-Uni"],"L’Union européenne y participe aussi. La Russie, associée en 1997 (G8), en a été exclue en 2014 après l’annexion de la Crimée."],
["Équilibres mondiaux",2,"vf","La France fait partie des cinq puissances nucléaires reconnues par le traité de non-prolifération (TNP).",true,"Vrai. Le TNP (1968) reconnaît cinq États dotés : États-Unis, Russie, Royaume-Uni, France et Chine, qui sont aussi les membres permanents du Conseil de sécurité."],

["Équilibres mondiaux",2,"estim","Combien d’habitants compte l’Union européenne, en millions (Eurostat, 2025) ?",[450,"millions"],"Environ 450 millions. L’Allemagne (environ 83 millions) est le pays le plus peuplé, devant la France et l’Italie."]

sci:[
["Astronomie",1,"qcm","Quelle planète est la plus proche du Soleil ?",["Mercure","Vénus","Mars","La Terre"],"Elle en fait le tour en 88 jours. Ce n’est pourtant pas la plus chaude : Vénus l’est davantage."],
["Chimie",1,"rapide","Quel est le symbole chimique de l’or ?",["Au"],"Du latin aurum. Numéro atomique 79 ; c’est l’un des métaux les moins réactifs, d’où son éclat inaltérable."],
["Chimie",1,"qcm","Quel gaz est le plus abondant dans l’atmosphère terrestre ?",["Le diazote","Le dioxygène","Le dioxyde de carbone","L’argon"],"Environ 78 % d’azote, 21 % d’oxygène et près de 1 % d’argon. Le CO₂ ne représente qu’environ 0,04 %."],
["Physique",2,"estim","Quelle est la vitesse de la lumière dans le vide, en kilomètres par seconde ?",[299792,"km/s"],"Exactement 299 792,458 km/s : depuis 1983, c’est elle qui sert à définir le mètre. La lumière du Soleil met environ 8 min 20 s à nous parvenir."],
["Biologie",2,"num","Combien d’os compte le squelette d’un adulte ?",["206"],"Un nouveau-né en possède davantage, environ 300 : certains fusionnent pendant la croissance, notamment au crâne et au bassin."],
["Physique",1,"qcm","Qui publie en 1687 les lois du mouvement et la gravitation universelle ?",["Isaac Newton","Galilée","Johannes Kepler","Albert Einstein"],"Dans les Principia mathematica. La relativité générale d’Einstein (1915) affinera la théorie de la gravitation."],
["Physique",2,"vf","Le son se propage plus vite dans l’eau que dans l’air.",true,"Vrai : environ 1 500 m/s dans l’eau contre 340 m/s dans l’air. Il va encore plus vite dans les solides, comme l’acier (près de 6 000 m/s)."],
["Chimie",2,"qcm","Quel est l’élément chimique le plus abondant dans l’Univers ?",["L’hydrogène","L’hélium","L’oxygène","Le carbone"],"Environ les trois quarts de la masse de la matière ordinaire. L’hélium vient ensuite ; dans la croûte terrestre, c’est l’oxygène qui domine."],
["Physique",2,"qcm","Quelle particule est mise en évidence au CERN en 2012 ?",["Le boson de Higgs","Le neutrino","Le quark top","Le positron"],"Prédite en 1964, elle explique la masse des particules élémentaires. Peter Higgs et François Englert reçoivent le prix Nobel en 2013."],
["Physique",2,"qcm","Quelle est l’unité de base du Système international pour la quantité de matière ?",["La mole","Le kelvin","Le coulomb","Le pascal"],"Une mole contient exactement 6,022 140 76 × 10²³ entités (nombre d’Avogadro). Le kelvin est aussi une unité de base, mais pour la température."],
["Biologie",1,"num","Combien de chromosomes contient une cellule humaine ordinaire ?",["46"],"23 paires, dont une paire de chromosomes sexuels (XX ou XY). Les ovules et les spermatozoïdes n’en contiennent que 23."],
["Mathématiques",3,"qcm","Quel mathématicien démontre le dernier théorème de Fermat en 1994 ?",["Andrew Wiles","Grigori Perelman","Alexandre Grothendieck","Terence Tao"],"Énoncé vers 1637, ce théorème a résisté plus de 350 ans. Perelman, lui, a démontré la conjecture de Poincaré."],
["Mathématiques",2,"vf","Le nombre π peut s’écrire comme une fraction de deux nombres entiers.",false,"Faux : π est irrationnel (Lambert, 1761), et même transcendant (Lindemann, 1882), ce qui rend impossible la quadrature du cercle à la règle et au compas."],
["Astronomie",2,"qcm","Sur quelle planète se trouve Olympus Mons, le plus grand volcan connu du système solaire ?",["Mars","Vénus","Jupiter","Mercure"],"Environ 22 km de hauteur au-dessus des plaines environnantes, et quelque 600 km de diamètre."],
["Astronomie",1,"ordre","Classez ces planètes de la plus proche à la plus éloignée du Soleil.",["Vénus","Terre","Mars","Jupiter","Saturne"],"Mercure, Vénus, Terre, Mars, puis la ceinture d’astéroïdes, Jupiter, Saturne, Uranus et Neptune."],
["Biologie",2,"qcm","Quel organite de la cellule est le siège de la respiration cellulaire ?",["La mitochondrie","Le noyau","Le chloroplaste","Le ribosome"],"Elle produit l’ATP, la « monnaie énergétique » de la cellule, et possède son propre ADN, transmis par la mère."],
["Chimie",1,"qcm","Quelle est la formule chimique de l’ozone ?",["O₃","O₂","CO₂","H₂O₂"],"Trois atomes d’oxygène. Dans la stratosphère, la couche d’ozone filtre une grande partie des ultraviolets du Soleil."],
["Physique",2,"num","À quelle température, en degrés Celsius, correspond le zéro absolu ?",["-273,15","−273,15","-273,15 °C","-273"],"0 kelvin = −273,15 °C : la plus basse température théoriquement possible, jamais atteinte exactement."],
["Biologie",1,"qcm","Qui découvre la pénicilline en 1928 ?",["Alexander Fleming","Louis Pasteur","Robert Koch","Joseph Lister"],"Il remarque qu’une moisissure empêche la croissance de bactéries. Florey et Chain la produiront à grande échelle pendant la Seconde Guerre mondiale."],
["Biologie",1,"qcm","Quelle structure de l’ADN Watson et Crick décrivent-ils en 1953 ?",["Une double hélice","Une triple hélice","Un anneau circulaire","Une simple chaîne linéaire"],"Leur modèle s’appuie notamment sur les clichés de diffraction de Rosalind Franklin. Prix Nobel 1962 pour Watson, Crick et Wilkins."],
["Astronomie",2,"qcm","Quelle est la planète la plus chaude du système solaire ?",["Vénus","Mercure","Mars","Jupiter"],"Environ 465 °C en surface, à cause d’un effet de serre extrême dans son atmosphère de CO₂, alors que Mercure est plus proche du Soleil."],
["Astronomie",2,"estim","Quel est l’âge estimé de l’Univers, en milliards d’années ?",[13.8,"milliards d’années"],"Environ 13,8 milliards d’années, d’après le fond diffus cosmologique mesuré notamment par le satellite Planck. La Terre a environ 4,5 milliards d’années."],
["Mathématiques",3,"qcm","Quel nombre est la base du logarithme népérien ?",["e ≈ 2,718","π ≈ 3,142","φ ≈ 1,618","√2 ≈ 1,414"],"Le nombre d’Euler e apparaît partout où une croissance est proportionnelle à elle-même : intérêts composés, populations, radioactivité."],
["Physique",3,"qcm","Quelle constante relie l’énergie d’un photon à sa fréquence (E = h·ν) ?",["La constante de Planck","La constante de Boltzmann","La constante gravitationnelle","La constante de Coulomb"],"Introduite par Max Planck en 1900, elle marque la naissance de la physique quantique. Sa valeur est fixée exactement depuis 2019 : 6,626 070 15 × 10⁻³⁴ J·s."],
["Chimie",2,"qcm","Quel élément a pour numéro atomique 6 ?",["Le carbone","L’azote","L’oxygène","Le bore"],"Six protons. Le carbone 14, radioactif, permet de dater des restes organiques jusqu’à environ 50 000 ans."],
["Biologie",3,"qcm","Quel naturaliste français propose dès 1809 une théorie de l’évolution des espèces, avant Darwin ?",["Jean-Baptiste de Lamarck","Georges Cuvier","Buffon","Étienne Geoffroy Saint-Hilaire"],"Dans sa Philosophie zoologique. Il pensait à tort que les caractères acquis se transmettent ; Darwin proposera en 1859 la sélection naturelle."],
["Mathématiques",1,"qcm","Comment appelle-t-on un triangle dont les trois côtés ont la même longueur ?",["Équilatéral","Isocèle","Scalène","Rectangle"],"Ses trois angles mesurent 60°. Un triangle isocèle n’a que deux côtés égaux."],
["Physique",3,"qcm","Quel physicien établit en 1865 les équations unifiant électricité, magnétisme et lumière ?",["James Clerk Maxwell","Michael Faraday","Heinrich Hertz","Nikola Tesla"],"Ses équations prédisent les ondes électromagnétiques, que Hertz mettra en évidence en 1887 : c’est la base de la radio."],
["Chimie",3,"qcm","Qui publie en 1869 une classification périodique des éléments en laissant des cases vides pour des éléments à découvrir ?",["Dmitri Mendeleïev","Antoine Lavoisier","John Dalton","Niels Bohr"],"Il prédit les propriétés du gallium, du scandium et du germanium, découverts dans les années qui suivent."],
["Astronomie",3,"qcm","Quelle sonde, lancée en 1977, est l’objet fabriqué par l’humanité le plus éloigné de la Terre ?",["Voyager 1","Pioneer 10","New Horizons","Voyager 2"],"Elle entre dans l’espace interstellaire en 2012. Elle est aujourd’hui si loin que ses signaux mettent près d’une journée à nous parvenir."],
["Biologie",2,"qcm","Quel moine établit les lois de l’hérédité en croisant des petits pois ?",["Gregor Mendel","Charles Darwin","Thomas Morgan","August Weismann"],"Publiés en 1866, ses travaux passent inaperçus jusqu’à leur redécouverte en 1900. Il est considéré comme le père de la génétique."],
["Chimie",1,"rapide","Quelle est la formule chimique de l’eau ?",["H₂O","H2O"],"Deux atomes d’hydrogène et un atome d’oxygène. Lavoisier a montré à la fin du XVIIIe siècle que l’eau n’est pas un élément mais un composé."],
["Physique",2,"court","Comment appelle-t-on le passage direct de l’état solide à l’état gazeux ?",["La sublimation","sublimation"],"C’est ce qui arrive à la glace carbonique (CO₂ solide) à pression ambiante. Le passage inverse s’appelle la condensation solide, ou déposition."],
["Astronomie",1,"vf","La Grande Muraille de Chine est visible à l’œil nu depuis la Lune.",false,"Faux. Depuis la Lune, à environ 384 000 km, on ne distingue aucune construction humaine. Même depuis l’orbite basse, la muraille est très difficile à repérer car elle est étroite et de la couleur du sol."],
["Astronomie",2,"estim","Quelle est la distance moyenne entre la Terre et la Lune, en kilomètres ?",[384400,"km"],"Environ 384 400 km : la lumière la parcourt en un peu plus d’une seconde. La Lune s’éloigne d’environ 3,8 cm par an."]
],
arts:[
["Peinture",1,"qcm","Qui a peint La Joconde ?",["Léonard de Vinci","Raphaël","Michel-Ange","Titien"],"Peinte au début du XVIe siècle, elle est au Louvre depuis la Révolution. Son vol en 1911 l’a rendue mondialement célèbre."],
["Peinture",1,"lieu","Dans quel musée La Joconde est-elle exposée ?",["Le Louvre","Louvre","musée du Louvre"],"Au Louvre, à Paris, derrière une vitre blindée. C’est le musée le plus visité du monde, avec près de 9 millions de visiteurs par an."],
["Peinture",2,"qcm","Quel mouvement doit son nom à un tableau de Claude Monet ?",["L’impressionnisme","Le fauvisme","Le pointillisme","Le romantisme"],"« Impression, soleil levant » (1872) inspire au critique Louis Leroy le terme moqueur d’« impressionnistes », lors de la première exposition du groupe en 1874."],
["Sculpture",1,"qcm","Qui a sculpté « Le Penseur » ?",["Auguste Rodin","Camille Claudel","Antoine Bourdelle","Aristide Maillol"],"Conçu vers 1880 pour couronner « La Porte de l’Enfer », inspirée de Dante. Un exemplaire trône dans le jardin du musée Rodin à Paris."],
["Architecture",2,"qcm","Quel architecte conçoit la pyramide du Louvre, inaugurée en 1989 ?",["Ieoh Ming Pei","Jean Nouvel","Renzo Piano","Frank Gehry"],"L’architecte sino-américain répond au besoin d’une entrée unique pour le musée. Renzo Piano a conçu, avec Richard Rogers, le Centre Pompidou."],
["Peinture",1,"qcm","Qui peint « Guernica » en 1937 ?",["Pablo Picasso","Salvador Dalí","Joan Miró","Francisco de Goya"],"Réaction au bombardement de la ville basque par l’aviation allemande et italienne. Le tableau est exposé au musée Reina Sofía de Madrid."],
["Architecture",1,"lieu","Dans quelle ville se dresse la basilique de la Sagrada Família ?",["Barcelone"],"Commencée en 1882 et reprise par Antoni Gaudí en 1883, elle est toujours en chantier près d’un siècle et demi plus tard."],
["Peinture",2,"qcm","Quel peintre néerlandais réalise « La Jeune Fille à la perle » ?",["Johannes Vermeer","Rembrandt","Frans Hals","Jérôme Bosch"],"Vers 1665, à Delft. Il ne reste qu’environ 35 tableaux attribués à Vermeer."],
["Architecture",1,"num","En quelle année la tour Eiffel est-elle inaugurée ?",["1889"],"Pour l’Exposition universelle célébrant le centenaire de la Révolution. Prévue pour 20 ans, elle a été sauvée notamment par son utilité pour la radio."],
["Architecture",2,"qcm","Quel style architectural se caractérise par la croisée d’ogives et les arcs-boutants ?",["Le gothique","Le roman","Le baroque","Le néoclassique"],"Né en Île-de-France vers 1140 (basilique de Saint-Denis), il permet des murs plus hauts et de grandes verrières."],
["Peinture",1,"qcm","Qui peint la voûte de la chapelle Sixtine entre 1508 et 1512 ?",["Michel-Ange","Raphaël","Botticelli","Le Caravage"],"Commande du pape Jules II. Michel-Ange y reviendra pour peindre « Le Jugement dernier » sur le mur de l’autel (1536-1541)."],
["Peinture",2,"ordre","Classez ces mouvements artistiques par ordre d’apparition.",["Renaissance","Baroque","Romantisme","Impressionnisme","Cubisme"],"XVe siècle, XVIIe siècle, début du XIXe, années 1870, vers 1907."],
["Peinture",3,"qcm","Quel peintre américain est associé au « dripping », la peinture projetée sur une toile posée au sol ?",["Jackson Pollock","Mark Rothko","Andy Warhol","Edward Hopper"],"Figure de l’expressionnisme abstrait à la fin des années 1940. Rothko peignait, lui, de grands champs de couleur."],
["Sculpture",2,"qcm","Quel artiste présente en 1917 un urinoir intitulé « Fontaine » ?",["Marcel Duchamp","Man Ray","Francis Picabia","Jean Arp"],"Ce « ready-made » signé « R. Mutt » pose la question de ce qui fait une œuvre d’art. L’original est perdu ; il en existe des répliques."],
["Architecture",3,"qcm","Quel architecte théorise les « cinq points d’une architecture nouvelle » (pilotis, toit-terrasse, plan libre…) ?",["Le Corbusier","Auguste Perret","Ludwig Mies van der Rohe","Walter Gropius"],"Énoncés en 1927 et appliqués à la villa Savoye de Poissy. Dix-sept de ses réalisations sont inscrites au patrimoine mondial."],
["Peinture",3,"qcm","Qui peint « Le Radeau de La Méduse » (1818-1819) ?",["Théodore Géricault","Eugène Delacroix","Jacques-Louis David","Jean-Auguste-Dominique Ingres"],"Il s’inspire du naufrage de la frégate La Méduse en 1816. L’œuvre, au Louvre, est un manifeste du romantisme."],
["Architecture",3,"qcm","Quel architecte conçoit la galerie des Glaces du château de Versailles ?",["Jules Hardouin-Mansart","Louis Le Vau","André Le Nôtre","Claude Perrault"],"Hardouin-Mansart la construit à partir de 1678, Charles Le Brun en peint la voûte. Le Vau avait mené les premiers agrandissements, Le Nôtre dessiné les jardins."],
["Peinture",2,"qcm","Quel peintre se mutile l’oreille en 1888 à Arles ?",["Vincent van Gogh","Paul Gauguin","Paul Cézanne","Henri de Toulouse-Lautrec"],"Après une violente dispute avec Gauguin. Il peint un autoportrait à l’oreille bandée en janvier 1889."],
["Architecture",3,"qcm","Quel architecte bâtit la coupole de la cathédrale de Florence, achevée en 1436 ?",["Filippo Brunelleschi","Leon Battista Alberti","Donato Bramante","Andrea Palladio"],"Une double coupole construite sans cintre en bois, grâce notamment à des briques posées en arêtes de poisson : un exploit technique de la Renaissance."],
["Peinture",3,"qcm","Quel peintre flamand est l’auteur des « Époux Arnolfini » (1434) ?",["Jan van Eyck","Pieter Bruegel l’Ancien","Rogier van der Weyden","Hans Memling"],"Célèbre pour son miroir convexe et sa maîtrise de la peinture à l’huile en glacis. Le tableau est à la National Gallery de Londres."],
["Peinture",1,"rapide","Dans quelle ville se trouve le musée du Prado ?",["Madrid"],"Ouvert en 1819, il conserve notamment « Les Ménines » de Velázquez et de nombreuses œuvres de Goya."],
["Peinture",2,"court","Quel peintre espagnol réalise « Les Ménines » en 1656 ?",["Diego Velázquez","Velázquez","Velasquez"],"Peintre de la cour de Philippe IV, il se représente lui-même au travail dans la toile, face au spectateur."],
["Architecture",2,"vf","La tour de Pise a commencé à pencher pendant sa construction.",true,"Vrai. Le sol meuble a cédé dès les premiers étages, à la fin du XIIe siècle. Les travaux de stabilisation des années 1990-2001 ont réduit son inclinaison d’environ 40 cm."],
["Architecture",2,"estim","Quelle est la hauteur actuelle de la tour Eiffel, antennes comprises, en mètres ?",[330,"m"],"330 m depuis l’installation d’une nouvelle antenne en 2022. Elle mesurait 312 m à son inauguration en 1889."]
],
litt:[
["Roman",1,"qcm","Qui a écrit « Les Misérables » ?",["Victor Hugo","Émile Zola","Alexandre Dumas","Honoré de Balzac"],"Publié en 1862 pendant son exil à Guernesey. Jean Valjean, Cosette et Gavroche sont devenus des figures universelles."],
["Roman",1,"qcm","Qui est l’auteur du « Petit Prince » ?",["Antoine de Saint-Exupéry","Jules Verne","Marcel Pagnol","Jacques Prévert"],"Paru en 1943 à New York. C’est l’un des livres les plus traduits au monde."],
["Roman",2,"qcm","Qui écrit « Madame Bovary » (1857) ?",["Gustave Flaubert","Stendhal","Guy de Maupassant","George Sand"],"Le roman lui vaut un procès pour « outrage à la morale publique », dont il sort acquitté."],
["Roman",1,"qcm","Quelle romancière crée le détective belge Hercule Poirot ?",["Agatha Christie","Mary Higgins Clark","Dorothy L. Sayers","P. D. James"],"Il apparaît dès 1920 dans « La Mystérieuse Affaire de Styles ». Agatha Christie a aussi créé Miss Marple."],
["Poésie",2,"qcm","Quel poète publie « Les Fleurs du mal » en 1857 ?",["Charles Baudelaire","Arthur Rimbaud","Paul Verlaine","Alfred de Musset"],"Condamné pour outrage aux bonnes mœurs, le recueil est amputé de six poèmes. La condamnation n’est annulée qu’en 1949."],
["Littérature étrangère",1,"qcm","Qui écrit le roman « 1984 » ?",["George Orwell","Aldous Huxley","Ray Bradbury","H. G. Wells"],"Publié en 1949, il invente « Big Brother » et la « novlangue ». Huxley a écrit « Le Meilleur des mondes » (1932)."],
["Roman",2,"qcm","Qui est l’auteur d’« À la recherche du temps perdu » ?",["Marcel Proust","André Gide","Louis-Ferdinand Céline","Romain Rolland"],"Sept volumes parus de 1913 à 1927. « À l’ombre des jeunes filles en fleurs » obtient le prix Goncourt en 1919."],
["Roman",1,"qcm","Qui écrit « L’Étranger » (1942) ?",["Albert Camus","Jean-Paul Sartre","André Malraux","Boris Vian"],"Le roman de Meursault, figure de l’absurde. Camus reçoit le prix Nobel de littérature en 1957, à 44 ans."],
["Littérature étrangère",2,"qcm","Quel auteur russe écrit « Crime et Châtiment » ?",["Fiodor Dostoïevski","Léon Tolstoï","Anton Tchekhov","Ivan Tourgueniev"],"Paru en 1866 : l’étudiant Raskolnikov commet un meurtre et sombre dans la culpabilité."],
["Roman",3,"ordre","Classez ces œuvres par date de parution.",["Gargantua (Rabelais)","Le Cid (Corneille)","Candide (Voltaire)","Les Misérables (Hugo)","L’Étranger (Camus)"],"1534, 1637, 1759, 1862, 1942."],
["Roman",2,"qcm","Quel écrivain refuse le prix Nobel de littérature en 1964 ?",["Jean-Paul Sartre","Albert Camus","Louis Aragon","Samuel Beckett"],"Sartre refusait par principe les distinctions officielles. Boris Pasternak avait, lui, été contraint de refuser le sien en 1958."],
["Roman",3,"qcm","Dans quel roman de Balzac Eugène de Rastignac lance-t-il à Paris « À nous deux maintenant ! » ?",["Le Père Goriot","Eugénie Grandet","Illusions perdues","La Peau de chagrin"],"Paru en 1835, c’est le roman où Balzac fait revenir pour la première fois des personnages d’un livre à l’autre, principe de « La Comédie humaine »."],
["Théâtre",2,"vf","Molière est mort sur scène en jouant « Le Malade imaginaire ».",false,"Faux, ou presque : pris d’un malaise pendant la quatrième représentation, le 17 février 1673, il meurt quelques heures plus tard chez lui, rue de Richelieu."],
["Antiquité",1,"qcm","Quelle épopée attribuée à Homère raconte le long retour d’Ulysse à Ithaque ?",["L’Odyssée","L’Iliade","L’Énéide","Les Métamorphoses"],"L’Iliade raconte un épisode de la guerre de Troie, l’Énéide (Virgile) les errances d’Énée, ancêtre légendaire des Romains."],
["Littérature étrangère",2,"qcm","Qui écrit « Cent ans de solitude » (1967) ?",["Gabriel García Márquez","Jorge Luis Borges","Pablo Neruda","Mario Vargas Llosa"],"Saga de la famille Buendía dans le village imaginaire de Macondo, chef-d’œuvre du « réalisme magique ». Prix Nobel en 1982."],
["Roman",2,"qcm","Quel écrivain publie « J’accuse… ! » dans L’Aurore en janvier 1898, en pleine affaire Dreyfus ?",["Émile Zola","Anatole France","Victor Hugo","Charles Péguy"],"Lettre ouverte au président Félix Faure. Condamné pour diffamation, Zola s’exile en Angleterre ; Dreyfus sera réhabilité en 1906."],
["Poésie",2,"qcm","Quel mouvement André Breton définit-il dans un manifeste en 1924 ?",["Le surréalisme","Le dadaïsme","Le symbolisme","L’existentialisme"],"Il prône l’écriture automatique et la libération de l’inconscient. Dada, né à Zurich en 1916, l’a précédé."],
["Poésie",1,"rapide","Qui écrit les Fables, dont « Le Corbeau et le Renard » ?",["Jean de La Fontaine","La Fontaine"],"Publiées de 1668 à 1694, en douze livres. Il s’inspire notamment d’Ésope et de Phèdre."],
["Théâtre",3,"qcm","Quelle règle classique impose au théâtre une seule action, en un seul lieu, en une seule journée ?",["La règle des trois unités","La bienséance","La vraisemblance","La catharsis"],"Formulée par Boileau dans son Art poétique (1674), elle s’inspire d’Aristote. Le drame romantique de Hugo la rejettera."],
["Littérature étrangère",1,"qcm","Quel auteur écrit « Don Quichotte » ?",["Miguel de Cervantès","Lope de Vega","Calderón","Francisco de Quevedo"],"Publié en deux parties (1605 et 1615), souvent considéré comme le premier roman moderne. Cervantès meurt en 1616, la même année que Shakespeare."],
["Poésie",2,"num","Combien de syllabes compte un alexandrin ?",["12","douze"],"Le vers de la tragédie classique et de la grande poésie française, traditionnellement coupé en deux hémistiches de six syllabes."],
["Théâtre",2,"qcm","Quelle pièce d’Edmond Rostand (1897) met en scène un cadet de Gascogne au long nez ?",["Cyrano de Bergerac","Chantecler","L’Aiglon","Ruy Blas"],"La pièce triomphe dès sa création. « Ruy Blas » est de Victor Hugo (1838)."],
["Roman",3,"qcm","Quel écrivain obtient le prix Goncourt à deux reprises, dont une fois sous pseudonyme ?",["Romain Gary","Marguerite Duras","Michel Houellebecq","Patrick Modiano"],"En 1956 pour « Les Racines du ciel », puis en 1975 sous le nom d’Émile Ajar pour « La Vie devant soi ». La supercherie n’est révélée qu’après sa mort."],
["Littérature étrangère",3,"qcm","Quel écrivain crée le personnage de Gregor Samsa, transformé en insecte ?",["Franz Kafka","Thomas Mann","Robert Musil","Stefan Zweig"],"Dans « La Métamorphose » (1915). Kafka avait demandé à son ami Max Brod de brûler ses manuscrits ; celui-ci les a publiés."],
["Roman",1,"court","Comment s’appelle le capitaine du Nautilus chez Jules Verne ?",["Nemo","le capitaine Nemo"],"Dans « Vingt mille lieues sous les mers » (1870). Nemo signifie « personne » en latin."],
["Roman",2,"vf","Victor Hugo a eu droit à des funérailles nationales et repose au Panthéon.",true,"Vrai. À sa mort en 1885, plus d’un million de personnes suivent le cortège ; le Panthéon est rendu à sa vocation laïque à cette occasion."]
],
cine:[
["Musique classique",1,"qcm","Qui compose l’opéra « La Flûte enchantée » (1791) ?",["Mozart","Haydn","Beethoven","Rossini"],"Créé à Vienne quelques semaines avant la mort de Mozart, à 35 ans. On y entend le célèbre air de la Reine de la nuit."],
["Cinéma",1,"qcm","Quels frères organisent en 1895 à Paris la première projection publique payante du Cinématographe ?",["Les frères Lumière","Les frères Pathé","Les frères Warner","Les frères Méliès"],"Le 28 décembre 1895, au Salon indien du Grand Café, boulevard des Capucines. Georges Méliès, présent ce soir-là, deviendra le premier magicien du cinéma."],
["Cinéma",2,"qcm","Qui réalise « Le Voyage dans la Lune » en 1902 ?",["Georges Méliès","Louis Lumière","Charles Pathé","Abel Gance"],"Ancien illusionniste, Méliès invente de nombreux trucages. L’image de l’obus planté dans l’œil de la Lune est devenue culte."],
["Musique classique",1,"qcm","Quel compositeur, devenu sourd, écrit la 9e symphonie et son « Ode à la joie » ?",["Ludwig van Beethoven","Jean-Sébastien Bach","Joseph Haydn","Franz Schubert"],"Créée en 1824 à Vienne. L’« Ode à la joie », sur un poème de Schiller, est devenue l’hymne européen."],
["Cinéma",2,"qcm","Quel film de 1927 est considéré comme le premier long métrage parlant ?",["Le Chanteur de jazz","Les Temps modernes","Metropolis","L’Aurore"],"Produit par Warner Bros. avec le procédé Vitaphone, il contient surtout des chansons et quelques répliques synchronisées."],
["Musique classique",1,"qcm","Quel compositeur écrit le « Boléro » (1928) ?",["Maurice Ravel","Claude Debussy","Erik Satie","Camille Saint-Saëns"],"Commandé par la danseuse Ida Rubinstein : un unique thème répété en crescendo pendant environ un quart d’heure."],
["Chanson & jazz",1,"qcm","Quelle chanteuse française était surnommée « la Môme » ?",["Édith Piaf","Barbara","Juliette Gréco","Dalida"],"Découverte en 1935 par Louis Leplée, qui la baptise « la Môme Piaf ». Elle meurt en 1963."],
["Cinéma",2,"qcm","Qui réalise « Les Quatre Cents Coups » (1959), film emblématique de la Nouvelle Vague ?",["François Truffaut","Jean-Luc Godard","Claude Chabrol","Éric Rohmer"],"Prix de la mise en scène à Cannes. Antoine Doinel, incarné par Jean-Pierre Léaud, reviendra dans quatre autres films."],
["Musique classique",1,"num","Combien de cordes compte un violon ?",["4","quatre"],"Accordées en quintes : sol, ré, la, mi. L’alto et le violoncelle en ont aussi quatre."],
["Musique classique",1,"qcm","Qui compose « Les Quatre Saisons » ?",["Antonio Vivaldi","Jean-Sébastien Bach","Georg Friedrich Haendel","Arcangelo Corelli"],"Quatre concertos pour violon publiés en 1725, chacun accompagné d’un sonnet descriptif."],
["Musique classique",2,"ordre","Classez ces compositeurs par date de naissance.",["Bach","Mozart","Beethoven","Chopin","Debussy"],"1685, 1756, 1770, 1810, 1862."],
["Cinéma",2,"qcm","Qui réalise « 2001 : l’Odyssée de l’espace » (1968) ?",["Stanley Kubrick","Steven Spielberg","George Lucas","Ridley Scott"],"Coécrit avec Arthur C. Clarke. Ses effets spéciaux valent à Kubrick le seul Oscar de sa carrière."],
["Cinéma",1,"lieu","Dans quelle ville se tient le festival de cinéma qui décerne la Palme d’or ?",["Cannes"],"Prévu dès 1939 mais reporté par la guerre, il se tient depuis 1946. La Palme d’or remplace le Grand Prix en 1955."],
["Musique classique",2,"qcm","Quel opéra de Georges Bizet (1875) met en scène une cigarière à Séville ?",["Carmen","La Traviata","Tosca","Les Pêcheurs de perles"],"Accueilli froidement à sa création, c’est aujourd’hui l’un des opéras les plus joués au monde. Bizet meurt trois mois après la première."],
["Musique classique",3,"qcm","Qui compose le « Prélude à l’après-midi d’un faune » (1894) ?",["Claude Debussy","Gabriel Fauré","Paul Dukas","Vincent d’Indy"],"Inspiré d’un poème de Mallarmé, il est souvent considéré comme l’acte de naissance de la musique moderne. Nijinski en fait un ballet en 1912."],
["Cinéma",3,"vf","Le premier Oscar du meilleur film est décerné en 1929 aux « Ailes » (Wings), un film muet.",true,"Vrai. Ce film de William Wellman sur des pilotes de la Grande Guerre récompense la saison 1927-1928. Il faudra attendre « The Artist » (2011) pour qu’un autre film muet obtienne cette récompense."],
["Chanson & jazz",2,"qcm","De quel instrument jouait Django Reinhardt, maître du jazz manouche ?",["La guitare","Le violon","Le piano","La contrebasse"],"Malgré deux doigts de la main gauche paralysés après un incendie, il fonde avec le violoniste Stéphane Grappelli le Quintette du Hot Club de France."],
["Cinéma",1,"qcm","Quel acteur et réalisateur incarne le personnage de Charlot ?",["Charlie Chaplin","Buster Keaton","Harold Lloyd","Max Linder"],"Chapeau melon, canne et démarche chaloupée dès 1914. Chaplin résiste longtemps au parlant : on n’entend la voix de Charlot qu’en 1936, quand il chante dans « Les Temps modernes »."],
["Chanson & jazz",2,"qcm","Quel trompettiste et chanteur américain enregistre « What a Wonderful World » (1967) ?",["Louis Armstrong","Miles Davis","Dizzy Gillespie","Chet Baker"],"Surnommé « Satchmo », il est aussi l’un des grands inventeurs du solo de jazz dans les années 1920."],
["Cinéma",3,"qcm","Quel réalisateur japonais signe « Les Sept Samouraïs » (1954) ?",["Akira Kurosawa","Yasujirō Ozu","Kenji Mizoguchi","Hayao Miyazaki"],"Le film inspire le western « Les Sept Mercenaires » (1960). Kurosawa reçoit un Oscar d’honneur en 1990."],
["Musique classique",3,"qcm","Quel compositeur crée à Paris en 1913 « Le Sacre du printemps », qui provoque un scandale ?",["Igor Stravinsky","Sergueï Prokofiev","Maurice Ravel","Arnold Schönberg"],"Créé au théâtre des Champs-Élysées par les Ballets russes de Diaghilev, sur une chorégraphie de Nijinski."],
["Chanson & jazz",2,"qcm","Quel auteur-compositeur belge écrit « Ne me quitte pas » (1959) ?",["Jacques Brel","Salvatore Adamo","Georges Brassens","Charles Aznavour"],"Reprise dans le monde entier, notamment par Nina Simone. Brassens était sétois, Aznavour parisien."],
["Chanson & jazz",1,"rapide","Qui compose « La Marseillaise » en 1792 ?",["Rouget de Lisle","Claude Joseph Rouget de Lisle"],"Composée à Strasbourg pour l’armée du Rhin, elle doit son nom aux fédérés marseillais qui la chantent en entrant à Paris. Elle devient hymne national en 1795, puis définitivement en 1879."],
["Cinéma",1,"court","Quel réalisateur tourne « Psychose » (1960) ?",["Alfred Hitchcock","Hitchcock"],"Surnommé le « maître du suspense ». La scène de la douche, environ 45 secondes à l’écran, a demandé une semaine de tournage."],
["Cinéma",2,"ordre","Classez ces films par date de sortie.",["Le Voyage dans la Lune","Le Chanteur de jazz","Les Temps modernes","À bout de souffle","2001 : l’Odyssée de l’espace"],"1902, 1927, 1936, 1960, 1968."],
["Cinéma",2,"vf","« Blanche-Neige et les Sept Nains » est le premier long métrage d’animation des studios Disney.",true,"Vrai. Sorti en 1937, il a été surnommé « la folie de Disney » pendant sa production. Son succès finance les studios de Burbank."]
],
inst:[
["France",1,"num","Quelle est la durée du mandat du président de la République française, en années ?",["5","cinq"],"Le quinquennat est adopté par référendum en 2000 et appliqué dès 2002. Depuis 2008, nul ne peut exercer plus de deux mandats consécutifs."],
["France",2,"num","En quelle année la Constitution de la Ve République est-elle adoptée ?",["1958"],"Approuvée par référendum le 28 septembre 1958 et promulguée le 4 octobre. Elle a été révisée plus de vingt fois depuis."],
["France",2,"num","Combien de députés siègent à l’Assemblée nationale ?",["577"],"Élus pour cinq ans au scrutin majoritaire à deux tours dans autant de circonscriptions, dont 11 pour les Français de l’étranger."],
["Europe",2,"lieu","Dans quelle ville le Parlement européen tient-il la plupart de ses sessions plénières ?",["Strasbourg"],"Douze sessions par an y sont prévues par les traités. Les commissions et des sessions additionnelles se tiennent à Bruxelles."],
["France",1,"qcm","Qui nomme le Premier ministre en France ?",["Le président de la République","L’Assemblée nationale","Le Sénat","Le Conseil constitutionnel"],"Article 8 de la Constitution. Le gouvernement reste responsable devant l’Assemblée, qui peut le renverser par une motion de censure."],
["France",2,"qcm","Quel article de la Constitution permet au gouvernement de faire adopter un texte sans vote, sauf motion de censure ?",["L’article 49, alinéa 3","L’article 16","L’article 89","L’article 11"],"Depuis 2008, il est limité aux textes budgétaires et à un autre texte par session. L’article 16 donne des pouvoirs exceptionnels au président, l’article 89 encadre la révision, l’article 11 le référendum."],
["France",1,"qcm","Quelle institution vérifie la conformité des lois à la Constitution ?",["Le Conseil constitutionnel","Le Conseil d’État","La Cour de cassation","La Cour des comptes"],"Depuis 2010, tout justiciable peut aussi le saisir indirectement par une question prioritaire de constitutionnalité (QPC)."],
["France",3,"num","Combien de membres nommés compte le Conseil constitutionnel ?",["9","neuf"],"Trois sont nommés par le président de la République, trois par celui de l’Assemblée, trois par celui du Sénat, pour neuf ans. Les anciens présidents de la République sont membres de droit."],
["France",2,"num","Quelle est la durée du mandat d’un sénateur, en années ?",["6","six"],"Le Sénat est renouvelé par moitié tous les trois ans. Les sénateurs sont élus au suffrage universel indirect par des grands électeurs, surtout des élus locaux."],
["France",2,"vf","Les Françaises ont obtenu le droit de vote en 1944.",true,"Vrai : ordonnance du 21 avril 1944. Elles votent pour la première fois aux élections municipales d’avril 1945."],
["France",2,"num","En quelle année la loi de séparation des Églises et de l’État est-elle promulguée ?",["1905"],"Loi du 9 décembre 1905 : la République garantit le libre exercice des cultes mais n’en reconnaît ni n’en finance aucun."],

function normBank(th,i,e){var t=e[2],q={id:th+'-'+(i+1),th:th,sub:e[0],lv:e[1],t:t,q:e[3],ex:e[5],src:'b'};

  case 'qcm':return (q.ch||[])[q.a]||'';case 'vf':return q.a?'Vrai':'Faux';

  default:return q.a||'';}}

function altText(q){var seen={},a=[];seen[bare(q.a)]=1;(q.alt||[]).forEach(function(x){var k=bare(x);if(!seen[k]){seen[k]=1;a.push(x);}});return a.join(' · ');}

function fixQ(q){if(!isObj(q))return null;q.t=FMT[q.t]?q.t:'court';q.lv=Math.min(3,Math.max(1,q.lv|0||1));q.q=String(q.q||'');q.ex=String(q.ex||'');q.th=String(q.th||'auto');
  if(q.t==='qcm'){q.ch=Array.isArray(q.ch)?q.ch.map(String):['',''];q.a=Math.min(q.ch.length-1,Math.max(0,q.a|0));}
  else if(q.t==='vf'){q.a=!!q.a;}else if(q.t==='estim'){q.a=parseNum(q.a)||0;q.unit=String(q.unit||'');}
  else if(q.t==='ordre'){q.items=Array.isArray(q.items)?q.items.map(String):[];if(!Array.isArray(q.sh)||q.sh.length!==q.items.length)q.sh=permNotId(q.items.length);}
  else{q.a=String(q.a==null?'':q.a);q.alt=Array.isArray(q.alt)?q.alt.map(String):[];}

/* ---------- Générateur ---------- */
function poolFor(cfg){var th=cfg.themes||{},subs=cfg.subs||{},f=(cfg.formats&&cfg.formats.length)?cfg.formats:ALLF;
  return allQ().filter(function(q){if(!(th[q.th]>0))return false;if(f.indexOf(q.t)<0)return false;var s=subs[q.th];if(s&&s.length&&s.indexOf(q.sub||'')<0)return false;return true;});}
function interleave(list,r){var g={},order=[];list.forEach(function(q){if(!g[q.th]){g[q.th]=[];order.push(q.th);}g[q.th].push(q);});
  var out=[],last=null;while(out.length<list.length){var best=null,bn=-Infinity;order.forEach(function(t){var n=g[t].length;if(!n)return;var sc=n+(t===last?-1000:0)+r()*0.5;if(sc>bn){bn=sc;best=t;}});out.push(g[best].shift());last=best;}return out;}
function toQuizQ(q,r){var c=clone(q);c.org=q.src||q.org||'';c.ref=(q.src==='b'||q.src==='u'||q.src==='g')?q.id:(q.ref||'');c.id=uid('q');delete c.src;delete c.ek;delete c.fam;
  if(c.t==='qcm'){var idx=c.ch.map(function(_,i){return i;});shuffle(idx,r);c.ch=idx.map(function(i){return q.ch[i];});c.a=idx.indexOf(q.a);}
  if(c.t==='ordre'){c.sh=permNotId(c.items.length,r);}
  return c;}
var GEN_W=0;
function qAnsKey(q){return (q.t==='vf'||q.t==='ordre'||q.t==='estim')?'':bare(answerText(q));}
function qSig(q){return gSig(q.q+' '+answerText(q));}
function qSimilar(a,b){var ka=Object.keys(a),n=0;if(ka.length<2)return false;var kb=Object.keys(b);if(kb.length<2)return false;ka.forEach(function(w){if(b[w])n++;});return n/Math.min(ka.length,kb.length)>=0.6;}
function generate(cfg,seed,opt){opt=opt||{};
  var r=rng(seed||Math.floor(Math.random()*4e9)),N=Math.max(1,Math.min(100,cfg.n|0||10)),ex=opt.exclude||{},avoid=opt.avoid!=null?opt.avoid:cfg.avoid;
  var pool=poolFor(cfg).filter(function(q){return !ex[q.id];}),byTh={};
  pool.forEach(function(q){(byTh[q.th]=byTh[q.th]||[]).push(q);});
  var gth={};Object.keys(cfg.themes||{}).forEach(function(t){if(cfg.themes[t]>0&&genHas(t,cfg))gth[t]=1;});
  var ths=Object.keys(byTh);Object.keys(gth).forEach(function(t){if(ths.indexOf(t)<0)ths.push(t);});
  var quota={},avail={},left=N,active=ths.slice();
  ths.forEach(function(t){avail[t]=(byTh[t]||[]).length+(gth[t]?1e5:0);quota[t]=0;});
  var guard=0;while(left>0&&active.length&&guard++<20){
    var sw=active.reduce(function(s,t){return s+(cfg.themes[t]||1);},0),alloc={},given=0,rems=[];
    active.forEach(function(t){var x=left*(cfg.themes[t]||1)/sw,f=Math.floor(x);alloc[t]=f;given+=f;rems.push([x-f+r()*1e-6,t]);});
    rems.sort(function(a,b){return b[0]-a[0];});for(var k=0;k<left-given;k++)alloc[rems[k%rems.length][1]]++;
    var spill=0;active.forEach(function(t){var cap=avail[t]-quota[t],g=Math.min(cap,alloc[t]);quota[t]+=g;spill+=alloc[t]-g;});
    active=active.filter(function(t){return avail[t]-quota[t]>0;});left=spill;}
  var L=cfg.level,fixed=typeof L==='number',picked=[],fc={},relaxed=0,seenUsed=0,usedEnt={},usedAns={},famN={},sigs=[],genN=0;
  function seenOf(c){return S.seen[c.id]||(c.gk&&S.seen[c.gk]);}
  ths.forEach(function(t){var stat=shuffle((byTh[t]||[]).slice(),r),gen=gth[t]?genCands(t,cfg,r,Math.min(400,Math.max(60,quota[t]*14)),fixed?L:undefined,{ex:ex}):[],cand=stat.concat(gen),start=Math.floor(r()*3),guard2=0;
    for(var j=0;j<quota[t]&&guard2++<quota[t]*6;){var pref=fixed?L:((start+j)%3)+1,best=-1,bs=1e9;
      for(var ci=0;ci<cand.length;ci++){var c=cand[ci];if(c.ek&&c.ek.some(function(e){return usedEnt[e];}))continue;var ak=qAnsKey(c);if(ak&&usedAns[ak])continue;
        var s=Math.abs(c.lv-pref)*(fixed?10:3)+(avoid&&seenOf(c)?8:0)+(fc[c.t]||0)*0.35+r()*0.9+(c.src==='g'?GEN_W+(famN[c.fam]||0)*1.6:0);if(s<bs){bs=s;best=ci;}}
      if(best<0)break;var c2=cand.splice(best,1)[0],sg=qSig(c2);
      if(sigs.some(function(x){return x.th===c2.th&&x.fam!==c2.fam&&qSimilar(sg,x.s);}))continue;
      if(fixed&&c2.lv!==L)relaxed++;if(seenOf(c2))seenUsed++;fc[c2.t]=(fc[c2.t]||0)+1;if(c2.src==='g'){famN[c2.fam]=(famN[c2.fam]||0)+1;genN++;}
      (c2.ek||[]).forEach(function(e){usedEnt[e]=1;});var ak2=qAnsKey(c2);if(ak2)usedAns[ak2]=1;sigs.push({th:c2.th,fam:c2.fam||'',s:sg});picked.push(c2);j++;}});
  var order=interleave(picked,r);
  if(L==='prog')order=order.map(function(q,i){return [q,i];}).sort(function(a,b){return a[0].lv-b[0].lv||a[1]-b[1];}).map(function(x){return x[0];});
  return {qs:order.map(function(q){return toQuizQ(q,r);}),relaxed:relaxed,short:N-order.length,seenUsed:seenUsed,pool:pool.length,gen:genN};}
function autoTitle(cfg){var ids=Object.keys(cfg.themes||{}).filter(function(k){return cfg.themes[k]>0;});
  var names=ids.map(function(id){return themeById(id).s||themeById(id).n;});
  var base=!names.length?'Mon quiz':names.length===1?names[0]:names.length<=4?names.slice(0,-1).join(', ')+' & '+names[names.length-1]:'Culture générale · '+names.length+' thèmes';
  var lv=cfg.level;return base+(typeof lv==='number'?' · '+LVN[lv]:lv==='prog'?' · progressif':'');}

/* =====================================================================

   ===================================================================== */
function groupByTheme(qs){var order=[],g={};qs.forEach(function(q){if(!g[q.th]){g[q.th]=[];order.push(q.th);}g[q.th].push(q);});var out=[];order.forEach(function(t){out=out.concat(g[t]);});return out;}
function finStart(g){return g.opts.finale?Math.max(0,g.qs.length-3):1e9;}
function isFinale(g,i){return i>=finStart(g);}
function curTeam(g){return g.mech==='tour'&&g.teams.length?g.teams[g.turn%g.teams.length]:null;}
function betTeams(g){var c=curTeam(g);return c?[c]:g.teams;}
function isNewRound(g,i){return g.opts.rounds&&(i===0||g.qs[i-1].th!==g.qs[i].th);}
function roundInfo(g){var K=0,k=0;g.qs.forEach(function(q,i){if(i===0||g.qs[i-1].th!==q.th){K++;if(i<=g.i)k=K;}});return {k:k,K:K};}
function roundLen(g,i){var th=g.qs[i].th,n=0;for(var j=i;j<g.qs.length&&g.qs[j].th===th;j++)n++;return n;}
function qDur(g,q){if(!g.timer)return 0;if(q.t==='rapide')return Math.max(10,Math.round(g.timer/2));if(q.t==='ordre'||q.t==='estim')return Math.round(g.timer*1.5);return g.timer;}
function mainMark(g,i,tid){for(var k=0;k<g.marks.length;k++){var m=g.marks[k];if(m.q===i&&m.t===tid&&(m.k==='ok'||m.k==='half'||m.k==='ko'))return m.k;}return null;}
function hasSpd(g,i,tid){return g.marks.some(function(m){return m.q===i&&m.t===tid&&m.k==='spd';});}
function score(g,tid){var s=0;g.marks.forEach(function(m){if(m.t===tid)s+=m.p;});return Math.round(s*100)/100;}
function ranked(g){var a=g.teams.map(function(t,i){return Object.assign({},t,{score:score(g,t.id),o:i});});a.sort(function(x,y){return y.score-x.score||x.o-y.o;});var r=0,p=null;a.forEach(function(t,i){if(p===null||t.score!==p){r=i+1;p=t.score;}t.rank=r;});return a;}
function ptsFor(g,tid,kind){var mult=isFinale(g,g.i)?2:1,b=g.opts.bet?(g.bets[tid]||0):0;
  if(kind==='spd')return 0.5;var base=b||1;if(kind==='ok')return base*mult;if(kind==='half')return base*mult/2;if(kind==='ko')return b?-b*mult:0;return 0;}
function setMark(tid,kind){var g=S.game,i=g.i;
  if(kind==='spd'){var sx=-1;g.marks.forEach(function(m,k){if(m.q===i&&m.t===tid&&m.k==='spd')sx=k;});if(sx>=0)g.marks.splice(sx,1);else g.marks.push({q:i,t:tid,k:'spd',p:0.5});return;}
  var ix=-1;g.marks.forEach(function(m,k){if(m.q===i&&m.t===tid&&(m.k==='ok'||m.k==='half'||m.k==='ko'))ix=k;});
  var prev=ix>=0?g.marks[ix].k:null;if(ix>=0)g.marks.splice(ix,1);
  if(prev!==kind)g.marks.push({q:i,t:tid,k:kind,p:ptsFor(g,tid,kind),b:g.opts.bet?(g.bets[tid]||0):0});}
function startGame(p){p=p||{};
  var z=p.qs?null:setupQuiz(),src=p.qs||(z&&z.qs);
  if(!src||!src.length){toast('Choisissez un quiz contenant au moins une question.');return;}
  if(!S.teams.length){toast('Ajoutez au moins une équipe ou un joueur.');return;}
  var o=S.setup,qs=clone(src);if(p.shuffle)shuffle(qs);if(o.rounds)qs=groupByTheme(qs);
  var tm=o.timer==='quiz'?(p.qs?(p.timer||0):quizTimer(z)):(+o.timer||0);
  S.game={id:uid('g'),quizId:p.quizId||(z&&z.id)||'',title:p.title||(z&&z.title)||'Quiz',started:nowISO(),qs:qs,i:0,phase:'',
    teams:S.teams.map(function(t,k){return {id:t.id,name:String(t.name||'').trim()||('Équipe '+(k+1)),c:t.c,sh:t.sh};}),
    mech:o.mech==='buzzer'?'buzzer':'tour',opts:{rounds:!!o.rounds,bet:!!o.bet,half:!!o.half,speed:!!o.speed,finale:!!o.finale&&qs.length>=6},
    timer:tm,turn:0,turnOf:[],marks:[],bets:{},pick:null,est:{},tm:null};

}
function enterQ(i){var g=S.game;g.i=i;g.pick=null;g.bets={};g.est={};g.tm=null;ANIM='in';
  if(g.mech==='tour'){var c=curTeam(g);g.turnOf[i]=c?c.id:'';}
  if(isNewRound(g,i)||(g.opts.finale&&i===finStart(g))){g.phase='round';return;}
  afterIntro();}
function afterIntro(){var g=S.game;if(g.opts.bet){g.phase='bet';betTeams(g).forEach(function(t){g.bets[t.id]=1;});}else ask();ANIM='in';}
function ask(){var g=S.game;g.phase='ask';var d=qDur(g,g.qs[g.i]);g.tm=d?{d:d,end:Date.now()+d*1000,left:d,run:true,out:false}:null;lastTickSec=-1;}
function reveal(){var g=S.game;if(!g||g.phase!=='ask')return;tmStop();g.phase='reveal';ANIM='rev';
  var q=g.qs[g.i],ct=curTeam(g);
  if(ct&&g.pick!=null&&(q.t==='qcm'||q.t==='vf')){var right=q.t==='qcm'?g.pick===q.a:(g.pick===1)===q.a;setMark(ct.id,right?'ok':'ko');sfx(right?'ok':'ko');}
  else sfx('reveal');}
function next(){var g=S.game;if(g.i>=g.qs.length-1){endGame(false);return;}if(g.mech==='tour')g.turn++;enterQ(g.i+1);}
function tmStop(){var t=S.game&&S.game.tm;if(t&&t.run){t.left=Math.max(0,(t.end-Date.now())/1000);t.run=false;}}
var lastTickSec=-1;
function tmTick(){var g=S.game;if(!g||g.phase!=='ask'||!g.tm)return;var t=g.tm;if(t.run&&Date.now()>=t.end){t.run=false;t.out=true;t.left=0;save();sfx('out');}updTimerDom();}
function updTimerDom(){var g=S.game;if(!g||g.phase!=='ask'||!g.tm)return;var el=$('#tmr');if(!el)return;
  var t=g.tm,left=t.run?Math.max(0,(t.end-Date.now())/1000):t.left,C=2*Math.PI*27;
  var c=$('#tmrC');if(c)c.style.strokeDashoffset=String(C*(1-(t.d?Math.min(1,left/t.d):0)));
  var tx=$('#tmrT');if(tx){var v=t.out?'Temps<br>écoulé':String(Math.ceil(left));if(tx.innerHTML!==v)tx.innerHTML=v;}
  var warn=!t.out&&t.run&&left<=Math.max(5,t.d*.25);el.classList.toggle('warn',warn);el.classList.toggle('out',!!t.out);el.classList.toggle('paused',!t.run&&!t.out);

function rankMap(T,st){var a=T.map(function(t,i){return {id:t.id,s:st[t.id].cum,o:i};});a.sort(function(x,y){return y.s-x.s||x.o-y.o;});var m={},r=0,p=null;a.forEach(function(x,i){if(p===null||x.s!==p){r=i+1;p=x.s;}m[x.id]=r;});return m;}
function ordP(n){return n===1?'1re':n+'e';}
function summarize(g){
  var n=g.done!=null?g.done:g.qs.length,qs=g.qs.slice(0,n),T=g.teams,st={},byQ={};
  T.forEach(function(t){st[t.id]={ok:0,half:0,ko:0,att:0,own:0,cur:0,best:0,spd:0,th:{},cum:0};});
  g.marks.forEach(function(m){(byQ[m.q]=byQ[m.q]||[]).push(m);});
  var thS={},unsolved=[],expertOk=0,betWin=null,betLoss=null,leader=null,changes=0,lastChange=null,mid=null,ledAll=true;
  qs.forEach(function(q,i){var ms=byQ[i]||[],res={},solved=0;
    ms.forEach(function(m){var s=st[m.t];if(!s)return;s.cum+=m.p;if(m.k!=='adj')s.th[q.th]=(s.th[q.th]||0)+m.p;if(m.k==='spd')s.spd++;
      if(m.k==='ok'||m.k==='half'||m.k==='ko')res[m.t]=m.k;
      if(m.k==='ok'&&m.b&&(!betWin||m.p>betWin.p))betWin={t:m.t,p:m.p,i:i};
      if(m.k==='ko'&&m.b&&(!betLoss||m.p<betLoss.p))betLoss={t:m.t,p:m.p,i:i};});
    var curT=g.mech==='tour'?g.turnOf[i]:null;
    T.forEach(function(t){var s=st[t.id],r=res[t.id],own=curT===t.id;if(own)s.own++;
      if(r){if(!own&&g.mech==='tour')s.att++;if(r==='ok')s.ok++;else if(r==='half')s.half++;else s.ko++;}
      if(r==='ok'){s.cur++;if(s.cur>s.best)s.best=s.cur;}else if(g.mech==='buzzer'||own||r)s.cur=0;
      if(r==='ok')solved=1;else if(r==='half'&&solved<1)solved=0.5;});
    var o=thS[q.th]=thS[q.th]||{n:0,s:0};o.n++;o.s+=solved;if(!solved)unsolved.push(i);if(q.lv===3&&solved===1)expertOk++;
    var best=-1e9,who=[];T.forEach(function(t){var c=st[t.id].cum;if(c>best+1e-9){best=c;who=[t.id];}else if(Math.abs(c-best)<1e-9)who.push(t.id);});
    if(who.length===1&&best>0){if(leader&&leader!==who[0]){changes++;lastChange={t:who[0],i:i};ledAll=false;}leader=who[0];}else if(who.length>1&&leader)ledAll=false;
    if(T.length>2&&i===Math.floor(n/2)-1)mid=rankMap(T,st);});
  var Rk=ranked(g),R=Rk.map(function(t){var s=st[t.id],den=g.mech==='tour'?(s.own+s.att):n,bt=null,bv=0;Object.keys(s.th).forEach(function(k){if(s.th[k]>bv){bv=s.th[k];bt=k;}});
    return {id:t.id,name:t.name,c:t.c,sh:t.sh,score:t.score,rank:t.rank,ok:s.ok,half:s.half,ko:s.ko,rate:den?Math.min(1,(s.ok+s.half/2)/den):0,best:bt,streak:s.best,spd:s.spd};});
  var ths=Object.keys(thS),bestTh=null,worstTh=null;
  if(ths.length>1){ths.sort(function(a,b){return thS[b].s/thS[b].n-thS[a].s/thS[a].n;});bestTh=ths[0];worstTh=ths[ths.length-1];if(thS[bestTh].s/thS[bestTh].n===thS[worstTh].s/thS[worstTh].n){bestTh=null;worstTh=null;}}
  var tot=ths.reduce(function(s,k){return s+thS[k].s;},0),dur=Math.max(1,Math.round((Date.parse(g.ended||nowISO())-Date.parse(g.started))/60000));
  var M=[];function nm(id){var t=byId(T,id);return t?'<b>'+esc(t.name)+'</b>':'?';}
  if(R.length>1){var w=R[0],gap=R[0].score-R[1].score;
    if(changes===0&&leader&&ledAll&&w.id===leader&&w.score>0&&gap>0)M.push(['crown',nm(w.id)+' a mené de bout en bout.']);
    else if(changes>0)M.push(['flame','La tête a changé de mains '+pl(changes,'fois','fois')+'. Dernier renversement à la question '+(lastChange.i+1)+' : '+nm(lastChange.t)+' passe devant.']);
    if(gap>0&&gap<=1)M.push(['target','Arrivée serrée : '+fNum(gap)+' point d’écart seulement.']);else if(gap===0&&w.score>0)M.push(['users','Égalité parfaite en tête, à '+fScore(w.score)+' points.']);}
  var sb=R.slice().sort(function(a,b){return b.streak-a.streak;})[0];if(sb&&sb.streak>=3)M.push(['bolt','Série de '+sb.streak+' bonnes réponses d’affilée pour '+nm(sb.id)+'.']);
  if(betWin)M.push(['medal','Plus beau pari : '+nm(betWin.t)+' empoche '+fNum(betWin.p)+' points sur « '+esc(cut(qs[betWin.i].q,70))+' ».']);
  if(betLoss)M.push(['warn','Pari perdu : '+nm(betLoss.t)+' laisse '+fNum(-betLoss.p)+' points sur « '+esc(cut(qs[betLoss.i].q,70))+' ».']);
  if(mid){for(var k=0;k<R.length;k++){var m0=mid[R[k].id];if(m0&&m0-R[k].rank>=2){M.push(['up','Belle remontée : '+nm(R[k].id)+', '+ordP(m0)+' à mi-parcours, termine '+ordP(R[k].rank)+'.']);break;}}}
  if(expertOk)M.push(['star',pl(expertOk,'question')+' de niveau Expert trouvée'+(expertOk>1?'s':'')+'.']);
  if(unsolved.length){var hard=unsolved.map(function(i){return qs[i];}).sort(function(a,b){return b.lv-a.lv;})[0];M.push(['lightbulb',pl(unsolved.length,'question')+' sans bonne réponse, dont « '+esc(cut(hard.q,80))+' » (réponse : '+esc(cut(answerText(hard),60))+').']);}
  else if(n>=3)M.push(['check','Aucune question n’est restée sans bonne réponse.']);
  var sp=R.slice().sort(function(a,b){return b.spd-a.spd;})[0];if(sp&&sp.spd>=2)M.push(['bolt',nm(sp.id)+' a été la plus rapide : '+pl(sp.spd,'bonus','bonus')+' de rapidité.']);
  return {n:n,ranking:R,rate:n?tot/n:0,bestTh:bestTh,worstTh:worstTh,unsolved:unsolved.length,expertOk:expertOk,dur:dur,moments:M.slice(0,7)};
}
function pruneSeen(){var k=Object.keys(S.seen);if(k.length<=4000)return;k.sort(function(a,b){return S.seen[b]-S.seen[a];});k.slice(4000).forEach(function(x){delete S.seen[x];});}
function resMap(g,i){var r={};g.teams.forEach(function(t){var k=mainMark(g,i,t.id);if(k)r[t.id]=k;});return r;}
function endGame(early){var g=S.game;if(!g)return;tmStop();
  g.done=early?(g.phase==='reveal'?g.i+1:g.i):g.qs.length;
  if(!g.done){S.game=null;FOCUS=false;applyFocus();save();render(false);toast('Partie arrêtée avant la première question : rien n’est enregistré.');return;}
  g.ended=nowISO();g.phase='end';g.sum=summarize(g);

function confetti(){if(motionReduced())return;var c=$('#fx');if(!c||!c.getContext)return;var dpr=Math.min(2,window.devicePixelRatio||1),W=window.innerWidth,H=window.innerHeight;c.width=W*dpr;c.height=H*dpr;var x=c.getContext('2d');x.setTransform(dpr,0,0,dpr,0,0);
  var cols=['#b51f5b','#f2c14e','#2f74d0','#1f9d55','#e0463c','#8e44c9','#0e98a5'],P=[];
  for(var i=0;i<140;i++)P.push({x:W/2+(Math.random()-.5)*W*.35,y:H*.28+(Math.random()-.5)*40,vx:(Math.random()-.5)*10,vy:-Math.random()*10-3,s:5+Math.random()*5,r:Math.random()*6,vr:(Math.random()-.5)*.35,c:cols[i%cols.length]});
  var t0=performance.now(),last=t0;(function f(t){var dt=Math.min(2,(t-last)/16.7);last=t;x.clearRect(0,0,W,H);var a=Math.max(0,1-(t-t0)/2600);
    P.forEach(function(p){p.vy+=0.28*dt;p.vx*=0.99;p.x+=p.vx*dt;p.y+=p.vy*dt;p.r+=p.vr*dt;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.globalAlpha=a;x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/3,p.s,p.s*0.66);x.restore();});

function shareBlob(blob,name,done){
  if(DL){var rd=new FileReader();rd.onload=function(){DL.save({filename:name,data:rd.result}).then(function(){if(done)done();},function(e){if(e&&e.code==='declined')toast('Téléchargement annulé');else toast('Téléchargement impossible ici');});};rd.readAsText(blob);return true;}
  if(envFrame()&&!window.claude)return dlBlob(blob,name,done);
  try{var file=new File([blob],name,{type:blob.type});
    if((isIOS()||isStandalone()||navigator.maxTouchPoints>0)&&navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file],title:name}).then(function(){if(done)done();},function(err){if(err&&err.name==='AbortError')toast('Partage annulé');else dlBlob(blob,name,done);});return true;}}catch(e){}
  return dlBlob(blob,name,done);}
function dlBlob(blob,name,done){try{var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},2000);if(done)done();return true;}catch(e){toast('Téléchargement impossible.');return false;}}

function doImport(text){var d;try{d=JSON.parse(text);}catch(e){toast('Contenu illisible : un fichier .json est attendu.');return;}
  if(d&&d.app==='quiz'&&d.kind==='quiz'&&d.quiz){var prev=snap(),z=fixQuiz(clone(d.quiz));if(!z){toast('Quiz illisible.');return;}mergeThemes(d.themes);z.id=uid('z');z.created=z.updated=nowISO();delete z.sample;z.qs.forEach(function(q){q.id=uid('q');});S.quizzes.unshift(z);save();render(true);toast('Quiz « '+cut(z.title,40)+' » importé ('+pl(z.qs.length,'question')+')',function(){restore(prev);});return;}

    d.questions.map(function(q){return fixQ(clone(q));}).filter(Boolean).forEach(function(q){q.src='u';if(ids[q.id]||!/^u-/.test(q.id))q.id=uid('u-');delete q.sh;S.mine.push(q);n++;});save();render(true);toast(pl(n,'question importée','questions importées'),function(){restore(prev2);});return;}

  if(!data||!Array.isArray(data.quizzes)||!isObj(data.gen)){toast('Ce contenu ne ressemble pas à une sauvegarde de Quiz.');return;}
  confirmBox('Importer cette sauvegarde ?','Elle remplacera les données de cet appareil : '+pl(data.quizzes.length,'quiz')+', '+pl((data.mine||[]).length,'question personnelle','questions personnelles')+', '+pl((data.history||[]).length,'partie')+'.','Importer',false,function(){

document.addEventListener('click',function(ev){
  if(ev.target&&ev.target.id==='modal'){closeSheet(true);return;}

  if(d.qch!=null&&SH&&SH.w){SH.w.ch[+d.qch]=t.value;return;}
  if(d.qit!=null&&SH&&SH.w){SH.w.items[+d.qit]=t.value;return;}

  if(d.bk){S.ui.bk[d.bk]=t.value;S.ui.bk.lim=40;saveSoon();var b=$('#bkList');if(b)b.innerHTML=bankListHTML();return;}
  if(d.est&&S.game){S.game.est[d.est]=t.value;saveSoon();return;}});

document.addEventListener('keydown',function(ev){
  var mo=$('#modal'),open=mo&&!mo.hidden;
  if(ev.key==='Escape'&&open){closeSheet();return;}
  var ae=document.activeElement,typing=ae&&(/INPUT|TEXTAREA|SELECT/.test(ae.tagName)||ae.isContentEditable);
  if((ev.key==='Enter'||ev.key===' ')&&ae&&ae.getAttribute&&ae.getAttribute('role')==='button'&&!typing){ev.preventDefault();ae.click();return;}
  if(typing||open||ev.metaKey||ev.ctrlKey||ev.altKey)return;

  var k=ev.key,code=ev.code||'';

  if(k==='p'||k==='P'){ACT.tPause();return;}

  if(g.phase==='reveal'){var m=/^(Digit|Numpad)([1-9])$/.exec(code),n=m?+m[2]:(/^[1-9]$/.test(k)?+k:0);
    if(n&&g.teams[n-1]){var kind=ev.shiftKey&&g.opts.half?'half':'ok';ACT.mark({dataset:{v:g.teams[n-1].id,k:kind}});ev.preventDefault();}}});
