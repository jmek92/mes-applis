<style>
/* VOICE : enjoué mais net, phrases courtes. IDEA : un plateau de quiz de salon, trois espaces séparés (Créer · Jouer · Revue).
   COLOUR : fond neutre légèrement prune, accent framboise, or réservé aux classements, une couleur par thème, une couleur par équipe.
   TYPE : police système, gros chiffres tabulaires. MOTION : courte, lisible, désactivable. */
:root{color-scheme:light dark;
  --bg:#f5f3f6;--card:#fff;--card2:#f8f6f9;--line:#e6e1e8;--field:#fff;--text:#121015;--muted:#5f5966;--soft:#8a8490;
  --accent:#b51f5b;--accent-ink:#fff;--accent-soft:#fbe9f0;--accent-line:#efc3d4;
  --gold:#a87400;--gold-bg:#fdf3d8;--silver:#6b7380;--bronze:#a0582a;
  --good:#16804a;--good-bg:#e2f4e9;--bad:#bf2f2a;--bad-bg:#fbe7e6;--warn:#9a5d00;--warn-bg:#fdf0d6;--info:#2258a8;--info-bg:#e5eefb;
  --stage:linear-gradient(165deg,#ffffff 0%,#fbf7fb 100%);--stage-line:#eadfea;
  --shadow:0 1px 2px rgba(30,10,30,.05),0 8px 24px rgba(30,10,30,.06);--shadow-lg:0 2px 6px rgba(30,10,30,.06),0 18px 48px rgba(30,10,30,.12);
  --r:16px;--r-sm:11px;--tabh:64px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#111014;--card:#1b191f;--card2:#222027;--line:#36323c;--field:#16141a;--text:#f2eff4;--muted:#bbb4c2;--soft:#8d8694;
  --accent:#ff7aa6;--accent-ink:#2a0613;--accent-soft:#3a1626;--accent-line:#6a2e47;
  --gold:#f2c14e;--gold-bg:#3a2e10;--silver:#c3cad4;--bronze:#e3a070;
  --good:#5fd38a;--good-bg:#15301f;--bad:#ff7d78;--bad-bg:#3a1b1a;--warn:#f5b93a;--warn-bg:#33290f;--info:#7cb3f5;--info-bg:#16273d;
  --stage:linear-gradient(165deg,#221f29 0%,#1a1820 100%);--stage-line:#3a3542;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);--shadow-lg:0 2px 6px rgba(0,0,0,.35),0 18px 48px rgba(0,0,0,.4);
}}
:root[data-theme=dark]{
  --bg:#111014;--card:#1b191f;--card2:#222027;--line:#36323c;--field:#16141a;--text:#f2eff4;--muted:#bbb4c2;--soft:#8d8694;
  --accent:#ff7aa6;--accent-ink:#2a0613;--accent-soft:#3a1626;--accent-line:#6a2e47;
  --gold:#f2c14e;--gold-bg:#3a2e10;--silver:#c3cad4;--bronze:#e3a070;
  --good:#5fd38a;--good-bg:#15301f;--bad:#ff7d78;--bad-bg:#3a1b1a;--warn:#f5b93a;--warn-bg:#33290f;--info:#7cb3f5;--info-bg:#16273d;
  --stage:linear-gradient(165deg,#221f29 0%,#1a1820 100%);--stage-line:#3a3542;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);--shadow-lg:0 2px 6px rgba(0,0,0,.35),0 18px 48px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
:root[data-big] body{font-size:18px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
svg.i{width:1.15em;height:1.15em;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.2em}
.tnum{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}.soft{color:var(--soft)}
.sm{font-size:14px}.xs{font-size:12.5px}
.mt0{margin-top:0}.mb0{margin-bottom:0}
.hide{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
a{color:var(--accent)}

/* ---------- Structure ---------- */
#app{min-height:100vh;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 8px) max(14px,env(safe-area-inset-right)) 8px max(14px,env(safe-area-inset-left));background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:saturate(1.4) blur(14px);backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--line)}
@supports not (background:color-mix(in srgb,red 50%,blue)){.top{background:var(--bg)}}
.brand{display:flex;align-items:center;gap:9px;min-width:0}
.logo{width:34px;height:34px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none;box-shadow:0 2px 8px rgba(181,31,91,.25)}
.logo svg{width:20px;height:20px}
.brand b{font-size:18px;letter-spacing:-.01em;white-space:nowrap}
.brand small{display:block;font-size:12px;color:var(--muted);margin-top:-2px;white-space:nowrap}
.tabs-top{display:none;margin-left:auto;gap:4px;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:3px}
.tabs-top button{border:0;background:none;padding:8px 14px;border-radius:9px;font-weight:600;color:var(--muted);display:flex;gap:7px;align-items:center;min-height:40px}
.tabs-top button[aria-current=true]{background:var(--card);color:var(--text);box-shadow:var(--shadow)}
.top .sp{flex:1}
.saved{width:9px;height:9px;border-radius:50%;background:var(--good);opacity:.65;flex:none}
.saved.ko{background:var(--bad);opacity:1}
.ib{border:1px solid var(--line);background:var(--card);border-radius:11px;width:42px;height:42px;display:grid;place-items:center;flex:none;color:var(--text)}
.ib[aria-pressed=true]{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent)}
main#view{flex:1;width:100%;max-width:1180px;margin:0 auto;padding:14px max(14px,env(safe-area-inset-right)) calc(var(--tabh) + 30px + env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left))}
.tabs-bot{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(4,1fr);background:color-mix(in srgb,var(--card) 92%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:4px max(6px,env(safe-area-inset-right)) calc(4px + env(safe-area-inset-bottom)) max(6px,env(safe-area-inset-left))}
@supports not (background:color-mix(in srgb,red 50%,blue)){.tabs-bot{background:var(--card)}}
.tabs-bot button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 2px 6px;font-size:12px;font-weight:600;color:var(--soft);min-height:52px;border-radius:12px}
.tabs-bot button svg{width:24px;height:24px}
.tabs-bot button[aria-current=true]{color:var(--accent)}
.tabs-bot button{position:relative}
.tabs-bot .dotw{position:absolute;top:6px;left:calc(50% + 7px);width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 2px var(--card)}
.tabs-top .dotw{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent)}
body.modal{overflow:hidden}
@media (min-width:760px){
  .tabs-top{display:flex}.tabs-bot{display:none}
  main#view{padding-bottom:calc(40px + env(safe-area-inset-bottom))}
  :root{--tabh:0px}
}

/* ---------- Titres, cartes ---------- */
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:6px 0 14px}
.ph h1{font-size:clamp(24px,4.2vw,32px);line-height:1.1;margin:0;letter-spacing:-.02em}
.ph p{margin:4px 0 0;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px;box-shadow:var(--shadow);min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.card-h h2,.card-h h3{margin:0;font-size:17px;display:flex;gap:8px;align-items:center;letter-spacing:-.01em}
.card-h .r{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.step{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:13px;font-weight:800;flex:none}
.grid2{display:grid;gap:14px}
@media (min-width:900px){.grid2{grid-template-columns:1fr 1fr;align-items:start}.grid2>*>.card:last-child{margin-bottom:0}}
.cols{display:grid;gap:14px}
@media (min-width:980px){.cols{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);align-items:start}}
.sticky-side{position:sticky;top:76px}
.subnav{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 0 14px;padding:2px}
.subnav::-webkit-scrollbar{display:none}
.subnav button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-weight:600;white-space:nowrap;display:flex;gap:6px;align-items:center;min-height:42px;color:var(--muted)}
.subnav button[aria-pressed=true]{background:var(--text);color:var(--bg);border-color:var(--text)}
.subnav .n{font-size:12px;background:var(--card2);color:var(--muted);border-radius:999px;padding:1px 7px}
.subnav button[aria-pressed=true] .n{background:rgba(255,255,255,.2);color:inherit}

/* ---------- Boutons, champs ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:9px 16px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:650;color:var(--text);text-decoration:none;line-height:1.2;text-align:center}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:0 4px 14px rgba(181,31,91,.22)}
.btn.dark{background:var(--text);border-color:var(--text);color:var(--bg)}
.btn.good{background:var(--good);border-color:var(--good);color:#fff}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.ghost{background:none;border-color:transparent}
.btn.sm{min-height:38px;padding:6px 12px;font-size:14px;border-radius:10px}
.btn.xl{min-height:58px;padding:12px 22px;font-size:18px;border-radius:15px}
.btn.wide{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btns.end{justify-content:flex-end}
.icb{border:1px solid var(--line);background:var(--card);border-radius:10px;width:40px;height:40px;display:inline-grid;place-items:center;color:var(--muted);flex:none}
.icb:hover{color:var(--text)}
.icb.danger:hover{color:var(--bad)}
.icb[disabled]{opacity:.35;pointer-events:none}
.lbl{display:block;font-weight:650;font-size:14px;margin:0 0 6px}
.fld{margin-bottom:14px}
.fld:last-child{margin-bottom:0}
.in{width:100%;font-size:16px;min-height:46px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--field);color:var(--text);outline:none;-webkit-appearance:none;appearance:none}
textarea.in{min-height:84px;resize:vertical;line-height:1.4}
select.in{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
.in:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.in.big{font-size:20px;font-weight:700;min-height:52px}
.row{display:flex;gap:8px;align-items:center}
.row>.grow{flex:1;min-width:0}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{flex:1 1 auto;min-height:44px;padding:8px 12px;border:1px solid var(--line);background:var(--card);border-radius:11px;font-weight:650;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;line-height:1.15}
.seg button small{font-weight:500;font-size:12px;color:var(--soft)}
.seg button[aria-pressed=true]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.seg button[aria-pressed=true] small{color:inherit;opacity:.85}
.seg.tight button{flex:0 0 auto}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 12px;font-weight:600;font-size:14.5px;color:var(--muted);min-height:40px}
.chip[aria-pressed=true]{background:var(--text);border-color:var(--text);color:var(--bg)}
.chip .n{font-size:12px;opacity:.7}
.tog{display:flex;align-items:flex-start;gap:12px;padding:11px 0;border-top:1px solid var(--line);cursor:pointer}
.tog:first-child{border-top:0;padding-top:2px}
.tog input{position:absolute;opacity:0;pointer-events:none}
.tog .sw{flex:none;width:46px;height:28px;border-radius:999px;background:var(--line);position:relative;transition:background .2s;margin-top:1px}
.tog .sw:after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.tog input:checked+.sw{background:var(--accent)}
.tog input:checked+.sw:after{transform:translateX(18px)}
.tog input:focus-visible+.sw{box-shadow:0 0 0 3px var(--accent-soft)}
.tog b{display:block;font-size:15.5px}
.tog small{display:block;color:var(--muted);font-size:13.5px;margin-top:1px}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--field)}
.stepper button{border:0;background:none;width:46px;height:46px;font-size:22px;font-weight:600;color:var(--accent)}
.stepper input{width:64px;border:0;text-align:center;font-size:20px;font-weight:800;background:none;min-height:46px;-moz-appearance:textfield}
.stepper input::-webkit-inner-spin-button{-webkit-appearance:none}
.note{font-size:13.5px;color:var(--muted);display:flex;gap:6px;align-items:flex-start;margin:8px 0 0}
.note svg{margin-top:2px}
.alert{display:flex;gap:10px;align-items:flex-start;border-radius:13px;padding:12px 14px;margin-bottom:14px;border:1px solid transparent}
.alert.warn{background:var(--warn-bg);color:var(--warn)}
.alert.info{background:var(--info-bg);color:var(--info)}
.alert.good{background:var(--good-bg);color:var(--good)}
.alert .t{color:var(--text);flex:1;min-width:0}
.alert .t b{display:block}
.alert .btns{margin-top:8px}
.empty{text-align:center;padding:26px 14px;color:var(--muted)}
.empty svg{width:40px;height:40px;opacity:.6;margin-bottom:6px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--line);font-size:15px}
.kv:first-child{border-top:0}
.kv span{color:var(--muted)}
.kv b{text-align:right}

/* ---------- Badges ---------- */
.tb{--tc:#666;--tcd:#aaa;display:inline-flex;align-items:center;gap:5px;font-weight:700;font-size:13px;color:var(--tc);background:color-mix(in srgb,var(--tc) 11%,transparent);border-radius:999px;padding:3px 10px 3px 8px;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .tb{color:var(--tcd);background:color-mix(in srgb,var(--tcd) 16%,transparent)}}
:root[data-theme=dark] .tb{color:var(--tcd);background:color-mix(in srgb,var(--tcd) 16%,transparent)}
.tb svg{width:15px;height:15px}
.bd{display:inline-flex;align-items:center;gap:5px;font-weight:650;font-size:13px;color:var(--muted);background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:2px 9px;white-space:nowrap}
.bd svg{width:14px;height:14px}
.bd.acc{color:var(--accent);background:var(--accent-soft);border-color:var(--accent-line)}
.bd.gold{color:var(--gold);background:var(--gold-bg);border-color:transparent}
.bd.good{color:var(--good);background:var(--good-bg);border-color:transparent}
.bd.bad{color:var(--bad);background:var(--bad-bg);border-color:transparent}
.lv{display:inline-flex;gap:3px;align-items:center;font-weight:650;font-size:13px;color:var(--muted);white-space:nowrap}
.lv i{width:7px;height:12px;border-radius:2px;background:var(--line);display:inline-block}
.lv i.on{background:var(--accent)}
.lv.l3 i.on{background:var(--bad)}
.lv.l1 i.on{background:var(--good)}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}

/* ---------- Créer : thèmes ---------- */
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:9px}
.th{--tc:#666;--tcd:#aaa;position:relative;text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:11px 11px 9px;display:flex;flex-direction:column;gap:6px;min-height:106px;transition:border-color .15s,box-shadow .15s,transform .15s}
.th .ico{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:color-mix(in srgb,var(--tc) 13%,transparent);color:var(--tc)}
.th .ico svg{width:21px;height:21px}
.th b{font-size:14.5px;line-height:1.2}
.th small{color:var(--soft);font-size:12.5px}
.th .ck{position:absolute;top:9px;right:9px;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;color:transparent}
.th.on{border-color:var(--tc);box-shadow:0 0 0 3px color-mix(in srgb,var(--tc) 14%,transparent)}
.th.on .ck{background:var(--tc);border-color:var(--tc);color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .th .ico{background:color-mix(in srgb,var(--tcd) 16%,transparent);color:var(--tcd)}:root:not([data-theme=light]) .th.on{border-color:var(--tcd);box-shadow:0 0 0 3px color-mix(in srgb,var(--tcd) 18%,transparent)}:root:not([data-theme=light]) .th.on .ck{background:var(--tcd);border-color:var(--tcd);color:#111}}
:root[data-theme=dark] .th .ico{background:color-mix(in srgb,var(--tcd) 16%,transparent);color:var(--tcd)}
:root[data-theme=dark] .th.on{border-color:var(--tcd)}
:root[data-theme=dark] .th.on .ck{background:var(--tcd);border-color:var(--tcd);color:#111}
.th .w{display:flex;gap:4px;margin-top:auto}
.th .w button{flex:1;border:1px solid var(--line);background:var(--card2);border-radius:8px;font-size:12.5px;font-weight:700;min-height:30px;padding:0;color:var(--muted)}
.th .w button[aria-pressed=true]{background:var(--text);color:var(--bg);border-color:var(--text)}
.th .subl{font-size:12.5px;color:var(--accent);background:none;border:0;padding:4px 0 0;text-align:left;font-weight:650;min-height:24px}
.th.add{border-style:dashed;align-items:center;justify-content:center;color:var(--muted);font-weight:650}
.weightbar{display:flex;height:10px;border-radius:6px;overflow:hidden;background:var(--line);margin-top:12px}
.weightbar i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:8px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:9px;height:9px;border-radius:3px;display:inline-block}

/* ---------- Exemples ---------- */
.samples{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.sample{border:1px solid var(--line);border-radius:14px;padding:13px;background:var(--card2);display:flex;flex-direction:column;gap:6px}
.sample b{font-size:15.5px}
.sample p{margin:0;font-size:13.5px;color:var(--muted);flex:1}
.sample .dots{display:flex;gap:4px}
.sample .dots i{width:10px;height:10px;border-radius:50%}
.sample .btns{margin-top:6px}

/* ---------- Barre fixe ---------- */
.dock{position:sticky;bottom:calc(var(--tabh) + 8px + env(safe-area-inset-bottom));z-index:20;margin:12px 0 0;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-lg);padding:10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
@media (min-width:760px){.dock{bottom:12px}}
.dock .info{flex:1 1 160px;min-width:0;font-size:14px;color:var(--muted);line-height:1.3}
.dock .info b{color:var(--text);font-size:16px}
.dock .btn{flex:0 0 auto}
@media (max-width:420px){.dock .btn.primary{flex:1 1 100%}}

/* ---------- Éditeur ---------- */
.qlist{display:grid;gap:9px}
.qrow{--tc:#666;--tcd:#aaa;display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start;border:1px solid var(--line);border-left:4px solid var(--tc);border-radius:13px;padding:11px 11px 9px;background:var(--card)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .qrow{border-left-color:var(--tcd)}}
:root[data-theme=dark] .qrow{border-left-color:var(--tcd)}
.qrow .num{width:30px;height:30px;border-radius:9px;background:var(--card2);border:1px solid var(--line);display:grid;place-items:center;font-weight:800;font-size:14px}
.qrow .qt{font-weight:650;margin:5px 0 3px;overflow-wrap:anywhere}
.qrow .qa{font-size:14px;color:var(--muted);overflow-wrap:anywhere}
.qrow .qa b{color:var(--good)}
.qrow .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.qrow.flash{animation:flash 1s ease}
@keyframes flash{0%{box-shadow:0 0 0 3px var(--accent-soft)}100%{box-shadow:none}}
.distr{display:flex;flex-wrap:wrap;gap:6px}

/* ---------- Jouer : équipes ---------- */
.teams{display:grid;gap:8px}
.team{display:flex;gap:8px;align-items:center}
.team .in{flex:1;min-width:0}
.av{--c:#888;width:40px;height:40px;border-radius:50%;background:var(--c);display:inline-grid;place-items:center;flex:none;border:0;color:#fff;box-shadow:inset 0 -2px 0 rgba(0,0,0,.15)}
.av svg{width:55%;height:55%;fill:#fff;stroke:none}
.av.s{width:28px;height:28px}
.av.l{width:64px;height:64px}
.av.xl{width:84px;height:84px}
.mech{display:grid;gap:8px;grid-template-columns:1fr 1fr}
.mech button{text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:4px;min-height:96px}
.mech button b{font-size:15.5px;display:flex;gap:7px;align-items:center}
.mech button small{color:var(--muted);font-size:13px;line-height:1.35}
.mech button[aria-pressed=true]{border-color:var(--accent);background:var(--accent-soft)}
.mech button[aria-pressed=true] b{color:var(--accent)}
@media (max-width:360px){.mech{grid-template-columns:1fr}}
.quizsel{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--card2)}
.quizsel .t{flex:1;min-width:0}
.quizsel b{display:block;font-size:16px}

/* ---------- Partie ---------- */
.game{display:grid;gap:12px}
.g-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.g-top .prog{flex:1;min-width:140px}
.g-top .prog .l{display:flex;justify-content:space-between;font-size:13.5px;color:var(--muted);font-weight:650;margin-bottom:5px;gap:8px}
.bar{height:8px;border-radius:999px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .4s ease}
.g-main{display:grid;gap:12px}
@media (min-width:980px){.g-main{grid-template-columns:minmax(0,1fr) 320px;align-items:start}.g-board{position:sticky;top:76px}}
.stage{position:relative;background:var(--stage);border:1px solid var(--stage-line);border-radius:22px;padding:clamp(16px,3vw,30px);box-shadow:var(--shadow-lg);overflow:hidden;min-width:0}
.stage:before{content:"";position:absolute;inset:0 0 auto 0;height:6px;background:var(--tc,var(--accent))}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .stage:before{background:var(--tcd,var(--accent))}:root:not([data-theme=light]) .intro .big{background:color-mix(in srgb,var(--tcd,var(--accent)) 16%,transparent);color:var(--tcd,var(--accent))}}
:root[data-theme=dark] .stage:before{background:var(--tcd,var(--accent))}
:root[data-theme=dark] .intro .big{background:color-mix(in srgb,var(--tcd,var(--accent)) 16%,transparent);color:var(--tcd,var(--accent))}
.stage.in{animation:rise .32s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
.st-h{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;margin-bottom:14px}
.st-h .meta{flex:1;min-width:0}
.turn{display:flex;align-items:center;gap:10px;margin:0 0 12px;padding:9px 12px;border-radius:13px;background:var(--card2);border:1px solid var(--line);font-weight:650}
.turn small{display:block;font-weight:500;color:var(--muted);font-size:12.5px}
.qtext{font-size:clamp(21px,2.9vw,36px);line-height:1.22;font-weight:750;letter-spacing:-.015em;margin:4px 0 18px;overflow-wrap:anywhere}
.opts{display:grid;gap:10px}
@media (min-width:640px){.opts.two{grid-template-columns:1fr 1fr}}
.opt{display:flex;align-items:center;gap:12px;text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:15px;padding:12px 14px;min-height:60px;font-size:clamp(16px,1.9vw,22px);font-weight:650;transition:border-color .15s,background .15s,transform .12s;overflow-wrap:anywhere}
.opt .k{flex:none;width:34px;height:34px;border-radius:10px;background:var(--card2);border:1px solid var(--line);display:grid;place-items:center;font-weight:800;font-size:16px;color:var(--muted)}
.opt.pick{border-color:var(--accent);background:var(--accent-soft)}
.opt.pick .k{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt.ok{border-color:var(--good);background:var(--good-bg)}
.opt.ok .k{background:var(--good);border-color:var(--good);color:#fff}
.opt.ko{border-color:var(--bad);background:var(--bad-bg)}
.opt.ko .k{background:var(--bad);border-color:var(--bad);color:#fff}
.opt.dim{opacity:.55}
.opt.ok.pop{animation:pop .45s ease}
.opt.ko.shake{animation:shake .4s ease}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.025)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.vf{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.vf .opt{justify-content:center;font-size:clamp(20px,2.4vw,28px);min-height:76px}
.oral{border:1.5px dashed var(--line);border-radius:15px;padding:16px;text-align:center;color:var(--muted);font-weight:600}
.oral svg{width:26px;height:26px;display:block;margin:0 auto 6px;opacity:.7}
.items{display:grid;gap:8px;counter-reset:it}
.item{display:flex;gap:12px;align-items:center;border:1px solid var(--line);background:var(--card);border-radius:13px;padding:10px 12px;font-size:clamp(16px,1.8vw,21px);font-weight:650}
.item .k{flex:none;width:32px;height:32px;border-radius:9px;background:var(--card2);border:1px solid var(--line);display:grid;place-items:center;font-weight:800;color:var(--muted)}
.item.ok .k{background:var(--good);border-color:var(--good);color:#fff}
.item .was{margin-left:auto;font-size:13px;color:var(--soft);font-weight:600;white-space:nowrap}
.answer{margin-top:16px;border-radius:16px;background:var(--good-bg);border:1px solid color-mix(in srgb,var(--good) 35%,transparent);padding:14px 16px}
.answer .lab{font-size:13px;font-weight:750;color:var(--good);text-transform:uppercase;letter-spacing:.06em;display:flex;gap:6px;align-items:center}
.answer .val{font-size:clamp(22px,2.8vw,34px);font-weight:800;margin-top:2px;overflow-wrap:anywhere}
.answer .alt{font-size:14px;color:var(--muted);margin-top:2px}
.answer.pop{animation:pop .45s ease}
.expl{margin-top:12px;border-radius:16px;background:var(--card2);border:1px solid var(--line);padding:13px 16px;font-size:clamp(15.5px,1.6vw,19px);line-height:1.5}
.expl .lab{font-size:13px;font-weight:750;color:var(--accent);text-transform:uppercase;letter-spacing:.06em;display:flex;gap:6px;align-items:center;margin-bottom:3px}
.est{display:grid;gap:7px;margin-top:12px}
.est .r{display:flex;gap:9px;align-items:center}
.est .r .in{max-width:180px;min-height:42px}
.est .r .d{font-size:13.5px;color:var(--muted);margin-left:auto;white-space:nowrap}
.est .r.best{font-weight:750}
.est .r.best .d{color:var(--good)}

/* Chronomètre */
.tmr{position:relative;width:64px;height:64px;flex:none;border:0;background:none;padding:0;color:var(--text)}
.tmr svg{width:64px;height:64px;transform:rotate(-90deg)}
.tmr circle{fill:none;stroke-width:6}
.tmr .bg{stroke:var(--line)}
.tmr .fg{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .25s linear,stroke .3s}
.tmr b{position:absolute;inset:0;display:grid;place-items:center;font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.tmr .pz{position:absolute;bottom:-2px;right:-2px;width:22px;height:22px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;color:var(--muted)}
.tmr .pz svg{width:12px;height:12px;transform:none}
.tmr.warn .fg{stroke:var(--warn)}
.tmr.warn b{color:var(--warn)}
.tmr.warn{animation:breathe 1.2s ease-in-out infinite}
.tmr.out .fg{stroke:var(--bad)}
.tmr.out b{color:var(--bad);font-size:13px;line-height:1.1;text-align:center}
.tmr.paused{opacity:.7}
.tmr.paused{animation:none}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.stage.timeout{box-shadow:0 0 0 3px color-mix(in srgb,var(--warn) 45%,transparent),var(--shadow-lg)}

/* Scores après révélation */
.score{margin-top:16px;border-top:1px solid var(--line);padding-top:14px}
.score h3{margin:0 0 4px;font-size:15px;display:flex;gap:8px;align-items:center}
.score .hint{font-size:13px;color:var(--muted);margin:0 0 10px}
.srow{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px dashed var(--line);flex-wrap:wrap}
.srow:first-of-type{border-top:0}
.srow .nm{flex:1 1 120px;min-width:0;font-weight:700;display:flex;align-items:center;gap:9px}
.srow .nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow .nm small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.srow .bt{display:flex;gap:6px;flex-wrap:wrap}
.mk{min-height:46px;min-width:52px;padding:6px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:5px;font-size:15px;color:var(--muted)}
.mk.ok[aria-pressed=true]{background:var(--good);border-color:var(--good);color:#fff}
.mk.half[aria-pressed=true]{background:var(--warn);border-color:var(--warn);color:#fff}
.mk.ko[aria-pressed=true]{background:var(--bad);border-color:var(--bad);color:#fff}
.mk.spd[aria-pressed=true]{background:var(--info);border-color:var(--info);color:#fff}
.mk.ok{color:var(--good)}.mk.ko{color:var(--bad)}.mk.half{color:var(--warn)}.mk.spd{color:var(--info)}

/* Mises */
.bets{display:grid;gap:10px;margin-top:8px}
.bet{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border:1px solid var(--line);border-radius:14px;padding:10px 12px;background:var(--card)}
.bet .nm{flex:1 1 120px;font-weight:700;display:flex;gap:9px;align-items:center;min-width:0}
.bet .seg button{min-width:54px;flex:0 0 auto;font-size:18px}

/* Intro de manche */
.intro{text-align:center;padding:clamp(10px,3vw,30px) 4px}
.intro .big{width:96px;height:96px;border-radius:28px;margin:0 auto 14px;display:grid;place-items:center;background:color-mix(in srgb,var(--tc,var(--accent)) 14%,transparent);color:var(--tc,var(--accent))}
.intro .big svg{width:52px;height:52px}
.intro .k{font-size:14px;font-weight:750;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.intro h2{font-size:clamp(28px,4.6vw,48px);margin:4px 0 6px;letter-spacing:-.02em;line-height:1.1}
.intro p{margin:0 auto;max-width:520px;color:var(--muted)}
.intro .x2{display:inline-flex;gap:8px;align-items:center;margin-top:12px;font-weight:800;color:var(--gold);background:var(--gold-bg);border-radius:999px;padding:6px 14px}

/* Classement */
.board{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px;box-shadow:var(--shadow)}
.board h3{margin:2px 4px 8px;font-size:15px;display:flex;align-items:center;gap:7px;justify-content:space-between}
.brow{position:relative;display:flex;align-items:center;gap:10px;padding:8px 6px;border-radius:12px;width:100%;border:0;background:none;text-align:left}
.brow+.brow{margin-top:2px}
.brow.cur{background:var(--accent-soft)}
.brow .rk{width:22px;text-align:center;font-weight:800;color:var(--soft);flex:none}
.brow .rk.r1{color:var(--gold)}
.brow .nm{flex:1;min-width:0;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brow .nm small{display:block;font-weight:500;font-size:12px;color:var(--muted)}
.brow .sc{font-size:24px;font-weight:850;font-variant-numeric:tabular-nums;min-width:44px;text-align:right}
.brow .sc.bump{animation:bump .5s ease}
@keyframes bump{0%{transform:scale(1)}35%{transform:scale(1.35);color:var(--good)}100%{transform:scale(1)}}
.brow .sc.down{animation:bumpd .5s ease}
@keyframes bumpd{0%{transform:scale(1)}35%{transform:scale(1.2);color:var(--bad)}100%{transform:scale(1)}}
.float{position:absolute;right:10px;top:0;font-weight:900;color:var(--good);pointer-events:none;animation:float 1s ease-out forwards}
.float.neg{color:var(--bad)}
@keyframes float{from{opacity:1;transform:translateY(4px)}to{opacity:0;transform:translateY(-26px)}}
.strip{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px}
.strip::-webkit-scrollbar{display:none}
.strip .brow{flex:none;width:auto;min-width:118px;max-width:190px;border:1px solid var(--line);background:var(--card);padding:6px 10px 6px 6px;gap:7px}
.strip .brow.cur{border-color:var(--accent)}
.strip .brow .sc{font-size:20px;min-width:0}
.strip .brow .rk{width:auto;font-size:13px}
@media (min-width:980px){.strip{display:none}}
@media (max-width:979px){.g-board{display:none}}

/* Barre d'action de la partie */
.g-act{position:sticky;bottom:calc(var(--tabh) + 8px + env(safe-area-inset-bottom));z-index:20;display:flex;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow-lg);padding:9px}
@media (min-width:760px){.g-act{bottom:12px}}
.g-act .btn{min-height:56px}
.g-act .btn.primary{flex:1;font-size:18px}
.g-act .kb{font-size:12px;opacity:.75;font-weight:600;margin-left:4px}
@media (max-width:759px){.g-act .kb{display:none}}

/* Fin de partie */
.podium{display:flex;align-items:flex-end;justify-content:center;gap:clamp(8px,2vw,18px);margin:10px 0 4px;min-height:230px}
.pod{flex:1 1 0;max-width:200px;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.pod .nm{font-weight:800;text-align:center;font-size:clamp(14px,1.8vw,18px);overflow-wrap:anywhere;line-height:1.2}
.pod .sc{font-weight:850;font-size:clamp(20px,2.6vw,28px);font-variant-numeric:tabular-nums}
.pod .blk{width:100%;border-radius:14px 14px 6px 6px;display:grid;place-items:start center;padding-top:10px;font-weight:900;font-size:26px;color:#fff;background:var(--c)}
.pod.p1 .blk{height:130px}.pod.p2 .blk{height:92px;opacity:.92}.pod.p3 .blk{height:66px;opacity:.85}
.pod .crown{color:var(--gold);height:26px}
.pod .crown svg{width:26px;height:26px}
.pod.rise{animation:risep .7s cubic-bezier(.2,.8,.2,1) both}
.pod.p2.rise{animation-delay:.15s}.pod.p3.rise{animation-delay:.3s}
@keyframes risep{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}
.winner{text-align:center;margin:4px 0 8px}
.winner h1{font-size:clamp(26px,4.6vw,44px);margin:0;letter-spacing:-.02em}
.winner p{margin:4px 0 0;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:9px}
.stat{border:1px solid var(--line);background:var(--card2);border-radius:14px;padding:11px 12px;min-width:0}
.stat small{display:block;color:var(--muted);font-size:12.5px;font-weight:650}
.stat b{display:block;font-size:22px;font-weight:850;margin-top:2px;overflow-wrap:anywhere;line-height:1.15}
.stat b.s{font-size:16px}
.tbl{width:100%;border-collapse:collapse;font-size:14.5px}
.tbl th{text-align:left;font-size:12.5px;color:var(--muted);font-weight:650;padding:6px 6px;border-bottom:1px solid var(--line)}
.tbl td{padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl td.n,.tbl th.n{text-align:right;font-variant-numeric:tabular-nums}
.tblw{overflow-x:auto;-webkit-overflow-scrolling:touch}
.moments{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.moments li{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--card2)}
.moments li svg{color:var(--accent);margin-top:2px}
.rbars{display:grid;gap:8px}
.rbar{display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr) 48px;gap:10px;align-items:center;font-size:14px}
.rbar .l{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rbar .t{height:10px;background:var(--line);border-radius:999px;overflow:hidden}
.rbar .t i{display:block;height:100%;border-radius:999px;background:var(--accent)}
.rbar .v{text-align:right;font-weight:750;font-variant-numeric:tabular-nums}
@media (max-width:380px){.rbar{grid-template-columns:minmax(0,96px) minmax(0,1fr) 42px}}

/* Revue */
.qitem{border:1px solid var(--line);border-radius:13px;background:var(--card);padding:11px 12px}
.qitem+.qitem{margin-top:8px}
.qitem .qt{font-weight:650;margin:6px 0 2px;overflow-wrap:anywhere}
.qitem .qa{font-size:14px;color:var(--muted);overflow-wrap:anywhere}
.qitem .qa b{color:var(--good)}
.qitem details{margin-top:6px}
.qitem summary{font-size:13.5px;color:var(--accent);font-weight:650;cursor:pointer;list-style:none;min-height:30px;display:flex;align-items:center}
.qitem summary::-webkit-details-marker{display:none}
.qitem .ex{font-size:14.5px;color:var(--text);margin-top:4px}
.qitem .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.res{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.res span{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;border-radius:999px;padding:2px 9px 2px 3px;background:var(--card2);border:1px solid var(--line)}
.res span.ok{background:var(--good-bg);border-color:transparent;color:var(--good)}
.res span.half{background:var(--warn-bg);border-color:transparent;color:var(--warn)}
.res span.ko{background:var(--bad-bg);border-color:transparent;color:var(--bad)}
.res .av{width:18px;height:18px}
.list{display:grid;gap:9px}
.litem{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--card)}
.litem .t{flex:1;min-width:0}
.litem .t b{display:block;font-size:15.5px;overflow:hidden;text-overflow:ellipsis}
.litem .t small{display:block;color:var(--muted);font-size:13px}
.litem .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:560px){.litem{flex-wrap:wrap}.litem .acts{width:100%;justify-content:flex-start}}
.filters{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));margin-bottom:12px}

/* Feuille modale */
#modal{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center;background:rgba(10,6,12,.45);padding:0}
#modal[hidden]{display:none}
.sheet{width:100%;max-width:640px;max-height:92vh;max-height:92dvh;background:var(--card);border-radius:22px 22px 0 0;display:flex;flex-direction:column;box-shadow:var(--shadow-lg);animation:sheetin .25s cubic-bezier(.2,.8,.2,1)}
@media (min-width:700px){#modal{align-items:center;padding:20px}.sheet{border-radius:22px}}
@keyframes sheetin{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
.sh-h{display:flex;align-items:center;gap:10px;padding:16px 16px 10px;border-bottom:1px solid var(--line)}
.sh-h h2{margin:0;font-size:18px;flex:1;min-width:0}
.x{border:0;background:var(--card2);width:38px;height:38px;border-radius:50%;font-size:22px;line-height:1;color:var(--muted);flex:none}
.sh-b{padding:14px 16px;overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1}
.sh-f{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;padding:10px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.sh-f:empty{display:none}
.sh-f .btn{flex:1 1 auto}
@media (min-width:700px){.sh-f .btn{flex:0 0 auto}}
.chs{display:grid;gap:8px}
.chs .r{display:flex;gap:8px;align-items:center}
.chs .r .rad{flex:none;width:44px;height:44px;border-radius:11px;border:1.5px solid var(--line);background:var(--card);display:grid;place-items:center;color:transparent}
.chs .r .rad[aria-pressed=true]{background:var(--good);border-color:var(--good);color:#fff}
.palette{display:flex;flex-wrap:wrap;gap:8px}
.palette button{width:42px;height:42px;border-radius:50%;border:3px solid transparent;background:var(--c)}
.palette button[aria-pressed=true]{border-color:var(--text)}
.shapes{display:flex;flex-wrap:wrap;gap:8px}
.shapes button{width:46px;height:46px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);display:grid;place-items:center}
.shapes button svg{width:24px;height:24px;fill:var(--text);stroke:none}
.shapes button[aria-pressed=true]{border-color:var(--accent);background:var(--accent-soft)}
.shapes button[aria-pressed=true] svg{fill:var(--accent)}
.adj{display:grid;gap:10px}
.adj .r{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.adj .r .nm{flex:1 1 120px;font-weight:700;display:flex;gap:8px;align-items:center;min-width:0}
.adj .r .sc{font-weight:850;font-size:20px;min-width:40px;text-align:right}
.menu{display:grid;gap:6px}
.menu button{display:flex;gap:12px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:13px;padding:12px 14px;min-height:52px;font-weight:650}
.menu button small{display:block;color:var(--muted);font-weight:500;font-size:13px}
.menu button.danger{color:var(--bad)}

/* Installation */
.install{position:relative;background:var(--accent-soft);border:1px solid var(--accent-line);border-radius:16px;padding:14px 16px;margin-bottom:14px}
.install h3{margin:0 0 4px;font-size:16px;padding-right:36px}
.install ol{margin:8px 0 0;padding-left:20px}
.install li{margin:4px 0}
.install .x{position:absolute;top:10px;right:10px}
.install .sh{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:7px;background:var(--card);border:1px solid var(--line);vertical-align:-6px}

/* Toast */
#toast{position:fixed;left:50%;bottom:calc(var(--tabh) + 22px + env(safe-area-inset-bottom));transform:translate(-50%,20px);z-index:70;background:var(--text);color:var(--bg);border-radius:14px;padding:10px 12px 10px 16px;display:flex;gap:12px;align-items:center;box-shadow:var(--shadow-lg);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:min(560px,calc(100vw - 24px));font-weight:600;font-size:15px}
#toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast .btn{background:transparent;color:inherit;border-color:rgba(127,127,127,.5);min-height:36px}
@media (min-width:760px){#toast{bottom:22px}}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:80}

/* Mouvement réduit */
:root[data-motion=reduce] *,:root[data-motion=reduce] *:before,:root[data-motion=reduce] *:after{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){:root:not([data-motion=full]) *,:root:not([data-motion=full]) *:before,:root:not([data-motion=full]) *:after{animation:none!important;transition:none!important}}

/* Mode présentation */
:root[data-focus] .top,:root[data-focus] .tabs-bot{display:none}
:root[data-focus] main#view{padding-top:calc(12px + env(safe-area-inset-top));max-width:1400px}
:root[data-focus]{--tabh:0px}
:root[data-focus] .g-act{bottom:calc(10px + env(safe-area-inset-bottom))}
@media (min-width:1200px){:root[data-focus] .qtext{font-size:42px}:root[data-focus] .opt{font-size:24px;min-height:72px}}

@media print{.top,.tabs-bot,.dock,.g-act,#toast{display:none!important}body{background:#fff}}

/* Ajustements téléphone */
.quick{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;margin:-4px 0 14px;padding:2px;align-items:center}
.quick::-webkit-scrollbar{display:none}
.quick>span{white-space:nowrap;display:inline-flex;gap:5px;align-items:center;flex:none}
.quick .chip{flex:none;white-space:nowrap}
.dock.static{position:static;box-shadow:var(--shadow)}
.g-top .gt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.tcards{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.tcard{border:1px solid var(--line);border-radius:14px;padding:11px 12px;background:var(--card2);min-width:0}
.tcard .rk{width:20px;text-align:center;color:var(--soft)}
.tcard .t{flex:1;min-width:0}
.tcard .t b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tcard .t small{display:block;color:var(--muted);font-size:12.5px}
.tcard .pts{font-size:26px;font-weight:850;font-variant-numeric:tabular-nums}
.tstats{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:9px;font-size:13.5px;color:var(--muted);align-items:center}
.tstats b{color:var(--text)}
@media (max-width:560px){
  .g-top .gt{display:none}
  .g-top{gap:6px}
  .g-top .prog{min-width:96px}
  .g-top .ib{width:38px;height:38px}
  .dock{padding:8px;gap:8px;flex-wrap:nowrap}
  .dock .info{flex:1 1 auto;min-width:0;font-size:12.5px;line-height:1.25}
  .dock .info b{font-size:14px;display:block}
  .dock .info .sub,.dock .info br{display:none}
  .dock .btn{flex:0 0 auto;min-height:48px;padding:8px 14px}
  .dock .btn.xl{min-height:50px;font-size:16.5px;padding:8px 16px}
  .dock.multi .info{display:none}
  .dock.multi .btn{flex:1 1 0}
  .dock.static{flex-wrap:wrap}
  .dock.static .info{flex:1 1 100%}
  .dock.static .info br{display:inline}
  .dock.static .btn{flex:1 1 40%}
  .g-act .btn.pz{flex:none;padding:9px 14px}
  .g-act .btn.pz span{display:none}
  .g-act .btn.primary{font-size:17px}
  .stats{grid-template-columns:repeat(auto-fit,minmax(118px,1fr))}
  .filters{grid-template-columns:1fr 1fr}
}
.pod .nm{overflow-wrap:break-word;word-break:normal;-webkit-hyphens:auto;hyphens:auto}
@media (max-width:370px){.dock .lg,.g-act .lg{display:none}}

</style>

<div id="app">
<header class="top"><div class="brand"><span class="logo" aria-hidden="true"></span><div><b>Quiz</b><small>Culture générale en groupe</small></div></div><span class="sp"></span><nav class="tabs-top" id="tabsTop" aria-label="Sections"></nav><span id="saved" class="saved" role="img" aria-label="Enregistré automatiquement"></span></header>

<script>
(function(){
'use strict';
/* =====================================================================
   BANQUE DE QUESTIONS — culture générale uniquement
   Format : [sous-thème, niveau 1-3, format, énoncé, réponse, explication]
   qcm : [bonne, fausse, fausse, fausse] (mélangées au tirage)
   vf : true/false · court/num/lieu/rapide : [réponse, variantes…]
   estim : [valeur, unité] · ordre : [éléments dans le bon ordre]
   Ne jamais réordonner : l’identifiant d’une question = thème + rang.
   ===================================================================== */
var BANK={
auto:[
["Constructeurs",1,"qcm","Quel constructeur a produit la 2 CV ?",["Citroën","Renault","Peugeot","Simca"],"Présentée au Salon de Paris en 1948, la 2 CV a été produite jusqu’en 1990 : près de 3,9 millions de berlines, plus de 5 millions avec les fourgonnettes."],
["Histoire de l’automobile",1,"vf","La Ford T a été la première voiture produite sur une chaîne d’assemblage mobile.",true,"Vrai. Ford met en service la chaîne mobile en 1913 à Highland Park : le temps d’assemblage d’un châssis passe d’environ 12 h à 1 h 30."],
["Mécanique",1,"qcm","Dans un moteur à essence, quelle pièce produit l’étincelle qui enflamme le mélange ?",["La bougie d’allumage","L’injecteur","La soupape d’admission","La bougie de préchauffage"],"La bougie d’allumage crée un arc électrique entre ses électrodes. Le Diesel, lui, s’enflamme par compression : la bougie de préchauffage ne sert qu’au démarrage à froid."],
["Constructeurs",1,"rapide","De quel pays la marque Volvo est-elle originaire ?",["Suède","la Suède"],"Volvo a été fondée en 1927 à Göteborg. Sa branche automobile appartient au groupe chinois Geely depuis 2010."],
["Sport automobile",1,"lieu","Dans quelle ville se court la plus célèbre course d’endurance de 24 heures ?",["Le Mans"],"Les 24 Heures du Mans se disputent depuis 1923 sur le circuit de la Sarthe, qui emprunte en partie des routes ouvertes le reste de l’année."],
["Histoire de l’automobile",1,"vf","Le moteur Diesel doit son nom à son inventeur, l’ingénieur Rudolf Diesel.",true,"Vrai. Rudolf Diesel dépose son brevet en 1892 ; le premier moteur réellement fonctionnel tourne en 1897 à Augsbourg."],
["Histoire de l’automobile",2,"num","En quelle année Carl Benz dépose-t-il le brevet de sa Motorwagen, souvent considérée comme la première automobile ?",["1886"],"Le brevet DRP 37435 est déposé le 29 janvier 1886. En 1888, Bertha Benz réalise avec elle le premier long trajet automobile, d’une centaine de kilomètres."],
["Technologies",2,"qcm","Que signifie le sigle ABS ?",["Système antiblocage des roues","Assistance au braquage sécurisée","Amortissement à bilan stabilisé","Aide au démarrage en côte"],"De l’allemand Antiblockiersystem. Bosch le propose en série dès 1978 sur la Mercedes Classe S : les roues ne se bloquent plus au freinage et la voiture reste dirigeable."],
["Mécanique",1,"ordre","Remettez dans l’ordre les quatre temps d’un moteur à pistons.",["Admission","Compression","Combustion-détente","Échappement"],"Cycle décrit par Beau de Rochas en 1862 et appliqué par Nikolaus Otto en 1876 : deux tours de vilebrequin pour un cycle complet."],
["Mécanique",2,"qcm","Quel ingénieur allemand a donné son nom au moteur à piston rotatif ?",["Felix Wankel","Nikolaus Otto","Gottlieb Daimler","August Horch"],"Le moteur Wankel remplace les pistons alternatifs par un rotor triangulaire. Mazda l’a rendu célèbre (RX-7, RX-8, victoire au Mans en 1991)."],
["Constructeurs",2,"vf","La Renault 4 a été produite à plus de 8 millions d’exemplaires.",true,"Vrai. Lancée en 1961 et produite jusqu’en 1992, la 4L a dépassé les 8 millions d’exemplaires dans le monde."],
["Histoire de l’automobile",2,"qcm","Quel modèle a été élu « voiture du siècle » par un jury international en 1999 ?",["La Ford T","La Citroën DS","La Mini","La Volkswagen Coccinelle"],"La Ford T (1908-1927, environ 15 millions d’exemplaires) l’emporte devant la Mini, la Citroën DS, la Coccinelle et la Porsche 911."],
["Constructeurs",2,"lieu","Dans quelle commune italienne se trouvent le siège et l’usine historique de Ferrari ?",["Maranello"],"Ferrari s’installe à Maranello, près de Modène, en 1943. La piste d’essai de Fiorano y a été construite en 1972."],
["Histoire de l’automobile",3,"estim","Quelle vitesse, en km/h, la « Jamais contente » atteint-elle en 1899, premier véhicule à dépasser les 100 km/h ?",[105.9,"km/h"],"Au printemps 1899 à Achères, le Belge Camille Jenatzy atteint 105,88 km/h avec cette voiture électrique en forme d’obus."],
["Mécanique",2,"qcm","Quel est le principe d’un turbocompresseur ?",["Comprimer l’air d’admission grâce à l’énergie des gaz d’échappement","Comprimer l’air grâce à une courroie entraînée par le vilebrequin","Injecter le carburant sous très haute pression","Refroidir les gaz d’échappement avant le catalyseur"],"Une turbine placée dans l’échappement entraîne un compresseur sur l’admission. Le compresseur volumétrique, lui, est entraîné mécaniquement par le moteur."],
["Mécanique",1,"qcm","Quelle pièce transforme le mouvement de va-et-vient des pistons en rotation ?",["Le vilebrequin","L’arbre à cames","Le volant moteur","La boîte de vitesses"],"Les bielles relient les pistons au vilebrequin, qui tourne. L’arbre à cames, lui, commande l’ouverture des soupapes."],
["Technologies",3,"qcm","Quel modèle, présenté en 1955, a popularisé la suspension hydropneumatique ?",["Citroën DS","Mercedes 300 SL","Rolls-Royce Silver Shadow","Peugeot 403"],"Conçue par Paul Magès, cette suspension à sphères d’azote et liquide hydraulique avait été essayée dès 1954 à l’arrière de la Traction 15-Six H."],
["Sport automobile",2,"num","En quelle année s’est disputée la première édition des 24 Heures du Mans ?",["1923"],"Les 26 et 27 mai 1923. Elle est remportée par André Lagache et René Léonard sur Chenard & Walcker."],
["Sport automobile",3,"qcm","Quel pilote détient le record de victoires aux 24 Heures du Mans ?",["Tom Kristensen","Jacky Ickx","Derek Bell","Henri Pescarolo"],"Le Danois Tom Kristensen compte 9 victoires (de 1997 à 2013), devant Jacky Ickx (6), Derek Bell (5) et Henri Pescarolo (4)."],
["Mécanique",3,"qcm","Qu’appelle-t-on le rapport volumétrique (taux de compression) d’un moteur ?",["Le rapport entre le volume du cylindre au point mort bas et au point mort haut","Le rapport entre la puissance et la cylindrée","La pression maximale atteinte dans la chambre","Le rapport entre l’air et le carburant admis"],"Un moteur essence atmosphérique tourne souvent autour de 10 à 12:1, un Diesel autour de 15 à 18:1 : c’est la forte compression qui provoque l’auto-inflammation du gazole."],
["Histoire de l’automobile",2,"ordre","Classez ces modèles par date de lancement, du plus ancien au plus récent.",["Ford T","Citroën Traction Avant","Renault 4 CV","Citroën DS","Renault 5"],"Ford T 1908, Traction Avant 1934, 4 CV 1946 (Salon de Paris), DS 1955, Renault 5 1972."],
["Technologies",2,"qcm","Quel équipement, imposé sur les voitures essence neuves en Europe depuis 1993, transforme les gaz polluants grâce à des métaux précieux ?",["Le pot catalytique","Le filtre à particules","La vanne EGR","Le silencieux"],"Le catalyseur « trois voies » (platine, palladium, rhodium) convertit monoxyde de carbone, hydrocarbures et oxydes d’azote en CO₂, eau et azote. Il impose l’essence sans plomb."],
["Mécanique",3,"qcm","Dans une boîte de vitesses manuelle, à quoi servent les synchroniseurs ?",["À égaliser les vitesses de rotation avant l’engagement d’un rapport","À répartir le couple entre les roues gauche et droite","À débrayer automatiquement à l’arrêt","À limiter le régime maximal du moteur"],"Par friction, le synchroniseur amène le pignon à la vitesse de l’arbre avant le crabotage : on passe les rapports sans « double débrayage »."],
["Constructeurs",1,"rapide","Quel constructeur français a un lion pour emblème ?",["Peugeot"],"Le lion orne les outils et lames de scie Peugeot dès le milieu du XIXe siècle, bien avant les automobiles, pour évoquer la solidité des dents et la souplesse de la lame."],
["Technologies",1,"qcm","Quel constructeur a lancé en 1997 la première voiture hybride produite en grande série ?",["Toyota","Honda","Nissan","Renault"],"La Toyota Prius sort au Japon en 1997, puis en Europe en 2000. Elle associe un moteur essence à cycle Atkinson et un moteur électrique."],
["Constructeurs",3,"estim","Quelle puissance, en chevaux, annonçait la Bugatti Veyron 16.4 à sa sortie en 2005 ?",[1001,"ch"],"Son W16 de 8 litres à quatre turbos développait 1 001 ch, pour plus de 400 km/h en pointe : une première pour une voiture de série."],
["Constructeurs",2,"vf","Avant de produire des voitures de sport, Lamborghini fabriquait des tracteurs.",true,"Vrai. Ferruccio Lamborghini fonde Lamborghini Trattori en 1948, puis la marque automobile en 1963, piqué au vif par Enzo Ferrari selon la légende."],
["Histoire de l’automobile",3,"qcm","Quelle architecture la Mini d’Alec Issigonis (1959) a-t-elle popularisée ?",["Moteur transversal et traction avant","Moteur central arrière","Propulsion avec boîte-pont arrière","Transmission intégrale permanente"],"Moteur placé en travers, boîte logée sous le moteur, roues aux quatre coins : 80 % de la longueur pour l’habitacle. Presque toutes les citadines ont suivi."],
["Technologies",3,"qcm","Que mesure l’indice d’octane d’un carburant ?",["Sa résistance à l’auto-inflammation (cliquetis)","Son pouvoir calorifique","Sa teneur en éthanol","Sa vitesse d’évaporation"],"Plus l’indice est élevé, plus l’essence supporte la compression sans s’enflammer spontanément. Le SP98 résiste mieux au cliquetis que le SP95."],
["Technologies",3,"vf","Sur un moteur essence à injection directe, le carburant est injecté dans le collecteur d’admission.",false,"Faux. C’est l’injection indirecte qui pulvérise l’essence dans le collecteur. L’injection directe l’injecte dans la chambre de combustion, sous une pression bien plus élevée (souvent 200 bars et plus)."],
["Mécanique",3,"qcm","Que signifie le sigle DOHC sur une fiche technique ?",["Double arbre à cames en tête","Injection directe à haute compression","Double circuit de refroidissement","Distribution par chaîne hydraulique"],"Double Overhead Camshaft : un arbre à cames pour les soupapes d’admission, un pour l’échappement, au-dessus de la culasse. Il permet souvent 4 soupapes par cylindre."],
["Technologies",2,"qcm","À quoi sert le filtre à particules (FAP) d’un Diesel ?",["Piéger les suies des gaz d’échappement","Filtrer le gazole avant l’injection","Retenir les poussières de l’air d’admission","Réduire les oxydes d’azote par injection d’urée"],"Les suies s’accumulent puis sont brûlées lors des « régénérations ». PSA l’a introduit en 2000 sur la 607 HDi ; l’AdBlue (urée), lui, traite les oxydes d’azote."],
["Sport automobile",2,"qcm","Quel pilote français a été quatre fois champion du monde de Formule 1 ?",["Alain Prost","Jean Alesi","Didier Pironi","René Arnoux"],"Alain Prost est sacré en 1985, 1986, 1989 et 1993. Il reste le seul Français titré en Formule 1."],
["Sport automobile",3,"qcm","Quelle marque remporte le premier Grand Prix de l’Automobile Club de France, en 1906 près du Mans ?",["Renault","Peugeot","Panhard","Fiat"],"Le Hongrois Ferenc Szisz s’impose sur Renault. Les jantes amovibles Michelin lui font gagner un temps précieux lors des crevaisons."],
["Mécanique",2,"qcm","Sur un Diesel, quel organe facilite le démarrage à froid ?",["La bougie de préchauffage","La bougie d’allumage","Le carburateur","Le starter à volet"],"Elle chauffe la chambre de combustion pour atteindre la température d’auto-inflammation du gazole quand le moteur est froid."],
["Technologies",3,"vf","Le cycle Atkinson, utilisé par de nombreuses hybrides, privilégie le rendement au détriment de la puissance.",true,"Vrai. En refermant tard la soupape d’admission, la détente devient plus longue que la compression : meilleur rendement, mais moins de couple à bas régime, compensé par le moteur électrique."],
["Mécanique",2,"court","Comment s’appelle le mécanisme qui permet aux roues d’un même essieu de tourner à des vitesses différentes en virage ?",["Le différentiel","différentiel"],"En virage, la roue extérieure parcourt plus de chemin que la roue intérieure. Le différentiel répartit le mouvement entre les deux sans les faire riper."]
],
hist:[
["Époque moderne",1,"num","En quelle année a eu lieu la prise de la Bastille ?",["1789"],"Le 14 juillet 1789. La fête nationale célèbre aussi la fête de la Fédération du 14 juillet 1790."],
["Antiquité",1,"qcm","Qui fut le premier empereur romain ?",["Auguste","Jules César","Néron","Constantin"],"Octave reçoit le titre d’Auguste en 27 av. J.-C. Jules César, assassiné en 44 av. J.-C., fut dictateur mais jamais empereur."],
["Époque contemporaine",1,"num","En quelle année le mur de Berlin est-il tombé ?",["1989"],"Le 9 novembre 1989. L’Allemagne est réunifiée moins d’un an plus tard, le 3 octobre 1990."],
["Époque moderne",1,"vf","Christophe Colomb a atteint les Amériques en 1492.",true,"Vrai. Le 12 octobre 1492, il débarque aux Bahamas, persuadé d’avoir atteint les Indes."],
["Époque moderne",1,"rapide","Quel roi de France était surnommé le Roi-Soleil ?",["Louis XIV","Louis 14"],"Louis XIV règne de 1643 à 1715 : 72 ans, le plus long règne de l’histoire de France."],
["Moyen Âge",2,"lieu","Dans quelle ville Jeanne d’Arc est-elle brûlée en 1431 ?",["Rouen"],"Jugée par un tribunal ecclésiastique sous contrôle anglais, elle meurt le 30 mai 1431 place du Vieux-Marché. Elle est réhabilitée en 1456 et canonisée en 1920."],
["Moyen Âge",2,"num","En quelle année a eu lieu la bataille d’Hastings ?",["1066"],"Guillaume, duc de Normandie, bat le roi Harold et devient roi d’Angleterre : la conquête est racontée par la « tapisserie » de Bayeux."],
["Époque moderne",2,"qcm","Quels traités mettent fin à la guerre de Trente Ans en 1648 ?",["Les traités de Westphalie","Les traités d’Utrecht","Le traité des Pyrénées","Le traité de Nimègue"],"Signés à Münster et Osnabrück, ils fondent un ordre européen d’États souverains. Le traité des Pyrénées (1659) ne règle que la guerre franco-espagnole."],
["Moyen Âge",2,"ordre","Classez ces événements du plus ancien au plus récent.",["Couronnement de Charlemagne","Bataille d’Hastings","Début de la guerre de Cent Ans","Prise de Constantinople par les Ottomans"],"800, 1066, 1337, 1453. La chute de Constantinople est souvent retenue comme la fin du Moyen Âge."],
["Époque moderne",2,"qcm","Qui a rédigé l’essentiel de la Déclaration d’indépendance des États-Unis ?",["Thomas Jefferson","George Washington","Benjamin Franklin","John Adams"],"Jefferson en écrit le brouillon, amendé notamment par Franklin et Adams. Elle est adoptée le 4 juillet 1776."],
["Époque moderne",2,"vf","Napoléon Bonaparte est né un an seulement après que la Corse est passée sous souveraineté française.",true,"Vrai. Gênes cède la Corse à la France par le traité de Versailles de mai 1768 ; Napoléon naît à Ajaccio le 15 août 1769."],
["Antiquité",1,"qcm","Quel pharaon a vu son tombeau, presque intact, découvert par Howard Carter en 1922 ?",["Toutânkhamon","Ramsès II","Khéops","Akhenaton"],"La tombe KV62 de la Vallée des Rois contenait plus de 5 000 objets, dont le célèbre masque d’or."],
["Époque contemporaine",2,"num","En quelle année Napoléon Ier est-il sacré empereur à Notre-Dame de Paris ?",["1804"],"Le 2 décembre 1804, en présence du pape Pie VII. Napoléon se couronne lui-même, puis couronne Joséphine, comme le montre le tableau de David."],
["Civilisations",1,"qcm","Quelle civilisation a bâti la cité de Machu Picchu ?",["Les Incas","Les Mayas","Les Aztèques","Les Olmèques"],"Construite au XVe siècle dans les Andes péruviennes, elle a été révélée au monde en 1911 par l’explorateur Hiram Bingham."],
["Moyen Âge",2,"qcm","Quel empire avait Constantinople pour capitale jusqu’en 1453 ?",["L’Empire byzantin","L’Empire ottoman","Le Saint-Empire romain germanique","L’Empire carolingien"],"L’Empire romain d’Orient, dit byzantin, prend fin quand le sultan Mehmed II s’empare de la ville le 29 mai 1453."],
["Époque moderne",1,"qcm","Quelle bataille de 1515 voit la victoire de François Ier sur les Suisses ?",["Marignan","Pavie","Azincourt","Rocroi"],"Victoire près de Milan. Dix ans plus tard, à Pavie (1525), François Ier sera au contraire fait prisonnier par les troupes de Charles Quint."],
["Époque moderne",2,"qcm","Quel édit, signé par Henri IV en 1598, accorde la liberté de culte aux protestants ?",["L’édit de Nantes","L’édit de Fontainebleau","L’édit de Poitiers","L’édit de Saint-Germain"],"Il met fin aux guerres de Religion. Louis XIV le révoque par l’édit de Fontainebleau en 1685."],
["Moyen Âge",3,"num","Combien de petits-fils de Charlemagne se partagent son empire au traité de Verdun en 843 ?",["3","trois"],"Charles le Chauve reçoit l’ouest (future France), Louis le Germanique l’est, et Lothaire une bande centrale, la Francie médiane, de la mer du Nord à l’Italie."],
["Civilisations",3,"qcm","Quelle dynastie a régné sur la Chine de 1368 à 1644 ?",["Les Ming","Les Qing","Les Tang","Les Song"],"Fondée après la dynastie mongole des Yuan, elle bâtit la Cité interdite et l’essentiel de la Grande Muraille visible aujourd’hui. Les Qing lui succèdent jusqu’en 1912."],
["Antiquité",1,"qcm","Quel chef gaulois est vaincu par Jules César à Alésia en 52 av. J.-C. ?",["Vercingétorix","Ambiorix","Brennus","Diviciacos"],"Chef des Arvernes, il se rend après le siège d’Alésia. Il est exécuté à Rome vers 46 av. J.-C., après le triomphe de César."],
["Époque contemporaine",2,"qcm","Comment appelle-t-on le pacte de non-agression germano-soviétique d’août 1939 ?",["Le pacte Molotov-Ribbentrop","Le pacte d’Acier","Le pacte de Varsovie","Les accords de Munich"],"Signé le 23 août 1939, il comporte un protocole secret de partage de l’Europe de l’Est. L’Allemagne envahit la Pologne une semaine plus tard."],
["Époque contemporaine",1,"num","En quelle année a eu lieu le débarquement allié en Normandie ?",["1944"],"Le 6 juin 1944, opération Overlord : environ 156 000 soldats débarquent le premier jour sur cinq plages."],
["Antiquité",2,"qcm","Quel empereur fait construire un mur fortifié à travers le nord de la Grande-Bretagne ?",["Hadrien","Trajan","Marc Aurèle","Caligula"],"Commencé en 122, le mur d’Hadrien court sur environ 117 km. Son successeur Antonin le Pieux fera bâtir un second mur plus au nord."],
["Sciences & techniques",1,"qcm","Qui met au point l’imprimerie à caractères mobiles en Europe vers 1450 ?",["Johannes Gutenberg","Léonard de Vinci","Galilée","Érasme"],"À Mayence, Gutenberg combine caractères métalliques mobiles, encre grasse et presse : sa Bible à 42 lignes est achevée vers 1455."],
["Sciences & techniques",2,"num","En quelle année les frères Wright réalisent-ils le premier vol motorisé contrôlé ?",["1903"],"Le 17 décembre 1903 à Kitty Hawk, en Caroline du Nord : 12 secondes et environ 37 mètres pour le premier vol."],
["Sciences & techniques",2,"qcm","Qui conçoit la « Pascaline », l’une des premières machines à calculer, en 1642 ?",["Blaise Pascal","René Descartes","Gottfried Leibniz","Pierre de Fermat"],"Pascal la conçoit à 19 ans pour aider son père, chargé de la collecte des impôts. Elle additionne et soustrait grâce à des roues dentées."],
["Sciences & techniques",2,"qcm","Quel ingénieur écossais améliore nettement la machine à vapeur en y ajoutant un condenseur séparé (1769) ?",["James Watt","Thomas Newcomen","George Stephenson","Denis Papin"],"Le condenseur séparé évite de refroidir le cylindre à chaque cycle et divise la consommation de charbon. L’unité de puissance, le watt, lui rend hommage."],
["Sciences & techniques",2,"vf","Louis Pasteur a mis au point le premier vaccin de l’histoire.",false,"Faux. Le premier vaccin est celui d’Edward Jenner contre la variole (1796). Pasteur développe ensuite des vaccins contre le choléra des poules, la maladie du charbon et la rage (1885)."],
["Sciences & techniques",2,"ordre","Classez ces inventions de la plus ancienne à la plus récente.",["Imprimerie de Gutenberg","Lunette astronomique de Galilée","Machine à vapeur de Watt","Téléphone de Bell"],"Vers 1450, 1609, 1769, 1876."],
["Sciences & techniques",1,"qcm","Quelle scientifique a reçu deux prix Nobel dans deux disciplines scientifiques différentes ?",["Marie Curie","Irène Joliot-Curie","Lise Meitner","Rosalind Franklin"],"Physique en 1903 (avec Pierre Curie et Henri Becquerel), puis chimie en 1911 pour la découverte du polonium et du radium."],
["Sciences & techniques",2,"qcm","Qui démontre la rotation de la Terre avec un pendule suspendu sous la coupole du Panthéon en 1851 ?",["Léon Foucault","Hippolyte Fizeau","André-Marie Ampère","François Arago"],"Le plan d’oscillation du pendule semble tourner lentement : c’est en réalité la Terre qui tourne dessous. Une réplique y est toujours visible."],
["Sciences & techniques",2,"num","En quelle année l’URSS lance-t-elle Spoutnik 1, premier satellite artificiel ?",["1957"],"Le 4 octobre 1957. Le choc pousse les États-Unis à créer la NASA en 1958 : la course à l’espace commence."],
["Époque moderne",3,"qcm","Quel traité de 1494 partage les terres nouvellement découvertes entre l’Espagne et le Portugal ?",["Le traité de Tordesillas","Le traité de Saragosse","Le traité d’Utrecht","Le traité du Cateau-Cambrésis"],"La ligne de partage passe à 370 lieues à l’ouest du Cap-Vert : c’est pourquoi le Brésil, à l’est de la ligne, est devenu lusophone."],
["Époque contemporaine",2,"qcm","Quel ministre fait voter les lois rendant l’école primaire gratuite (1881), puis obligatoire et laïque (1882) ?",["Jules Ferry","Jean Jaurès","Victor Duruy","François Guizot"],"Les lois Ferry rendent l’instruction obligatoire de 6 à 13 ans. La loi Guizot (1833) avait imposé une école de garçons par commune."],
["Époque moderne",3,"num","En quelle année l’ordonnance de Villers-Cotterêts impose-t-elle le français dans les actes officiels ?",["1539"],"Signée par François Ier, elle impose le « langage maternel françois » à la place du latin dans la justice et les actes, et généralise les registres de baptêmes, ancêtres de l’état civil."],
["Époque moderne",3,"qcm","Quelle bataille navale de 1571 voit la Sainte Ligue vaincre la flotte ottomane ?",["Lépante","Trafalgar","Aboukir","Préveza"],"Au large de la Grèce, la flotte de Don Juan d’Autriche l’emporte. Cervantès y perd l’usage de la main gauche."],
["Moyen Âge",2,"qcm","Quel roi fonde en 987 la dynastie des Capétiens ?",["Hugues Capet","Charles Martel","Pépin le Bref","Louis VI le Gros"],"Élu roi en 987 après la mort du dernier Carolingien, Louis V. Ses descendants, Valois et Bourbons compris, régneront jusqu’en 1848."],
["Moyen Âge",3,"num","Selon la tradition, en quelle année Charles Martel arrête-t-il une armée omeyyade près de Poitiers ?",["732"],"La date traditionnelle est 732, certains historiens retiennent 733. La bataille renforce le prestige de la famille de Charles, les futurs Carolingiens."],
["Époque contemporaine",1,"rapide","Sur quelle île Napoléon Ier meurt-il en exil en 1821 ?",["Sainte-Hélène","Sainte Hélène"],"Île britannique perdue dans l’Atlantique Sud, choisie après Waterloo pour éviter une nouvelle évasion comme celle de l’île d’Elbe en 1815."],
["Époque moderne",2,"court","Quel navigateur portugais ouvre la route maritime des Indes en 1498 ?",["Vasco de Gama","Vasco da Gama","de Gama"],"Il contourne le cap de Bonne-Espérance et atteint Calicut, en Inde. Le Portugal bâtit ensuite un empire commercial des épices."],
["Moyen Âge",2,"vf","La guerre de Cent Ans a duré exactement cent ans.",false,"Faux : de 1337 à 1453, soit 116 ans, entrecoupés de longues trêves. Elle oppose les Plantagenêts aux Valois pour la couronne de France."]
],
geo:[
["Pays & capitales",1,"rapide","Quelle est la capitale de l’Australie ?",["Canberra"],"Ville créée de toutes pièces au début du XXe siècle pour départager Sydney et Melbourne. Le Parlement y siège depuis 1927."],

["Pays & capitales",1,"rapide","Quelle est la capitale du Canada ?",["Ottawa"],"Choisie par la reine Victoria en 1857, à la limite entre l’Ontario anglophone et le Québec francophone. Toronto et Montréal sont plus peuplées."],

["Géographie physique",2,"lieu","Dans quel pays se trouve le désert d’Atacama, l’un des plus arides du monde ?",["Chili","le Chili"],"Coincé entre le Pacifique et les Andes, il compte des stations n’ayant presque jamais enregistré de pluie. Sa sécheresse et son altitude en font un haut lieu de l’astronomie."],

["Reliefs",1,"estim","Quelle est l’altitude du mont Blanc, en mètres ?",[4806,"m"],"Mesuré à 4 805,59 m en 2023 : l’altitude varie de quelques mètres d’une mesure à l’autre selon l’épaisseur de la calotte de neige et de glace."],
["Géographie physique",1,"qcm","Quel détroit sépare l’Europe de l’Afrique ?",["Le détroit de Gibraltar","Le Bosphore","Le détroit de Messine","Le pas de Calais"],"Environ 14 km au plus étroit, entre l’Espagne et le Maroc. Le Bosphore, lui, sépare l’Europe de l’Asie."],

["Fleuves & lacs",2,"qcm","Quel est le lac le plus profond du monde ?",["Le Baïkal","Le Tanganyika","Le lac Supérieur","La mer Caspienne"],"En Sibérie, il atteint 1 642 m de profondeur et contient environ 20 % de l’eau douce liquide de surface du globe."],
["Fleuves & lacs",3,"lieu","Dans quel pays le Danube prend-il sa source ?",["Allemagne","l’Allemagne"],"Dans la Forêt-Noire : la Breg et la Brigach se rejoignent à Donaueschingen."],
["Pays & capitales",3,"qcm","Quelle est la capitale du Kazakhstan ?",["Astana","Almaty","Tachkent","Bichkek"],"Almaty a été capitale jusqu’en 1997. Astana s’est appelée Noursoultan de 2019 à 2022."],
["Fleuves & lacs",2,"vf","L’Amazone déverse plus d’eau dans l’océan que n’importe quel autre fleuve.",true,"Vrai. Son débit moyen, environ 200 000 m³/s, représente à lui seul près d’un cinquième de l’eau douce apportée aux océans."],
["Reliefs",3,"qcm","Comment appelle-t-on un plateau isolé, au sommet plat et aux flancs abrupts, typique de l’Ouest américain ?",["Une mesa","Une cuesta","Une moraine","Un inlandsis"],"La mesa est un reste de plateau protégé par une couche de roche dure. La cuesta est un relief dissymétrique, la moraine un dépôt glaciaire, l’inlandsis une calotte glaciaire."],

["Géographie physique",2,"lieu","Avec quel pays le Brésil partage-t-il les chutes d’Iguaçu ?",["Argentine","l’Argentine"],"Environ 275 chutes s’étendent sur près de 3 km à la frontière, non loin du Paraguay."],
["Géographie physique",3,"qcm","Comment appelle-t-on la remontée d’eaux profondes et froides le long de certaines côtes (Pérou, Californie, Mauritanie) ?",["L’upwelling","El Niño","Le Gulf Stream","La thermocline"],"Ces eaux riches en nutriments nourrissent le plancton, d’où des zones de pêche très abondantes. El Niño, au contraire, affaiblit l’upwelling péruvien."],

["Démographie",2,"estim","Combien la France comptait-elle d’habitants au 1er janvier 2025, en millions, selon l’Insee ?",[68.6,"millions"],"Environ 68,6 millions, outre-mer compris. La croissance repose désormais surtout sur le solde migratoire, les naissances dépassant à peine les décès."],

["Pays & capitales",2,"qcm","Quel pays a un drapeau national qui n’est pas un quadrilatère ?",["Le Népal","Le Bhoutan","La Suisse","Le Qatar"],"Il est formé de deux triangles superposés. Les drapeaux de la Suisse et du Vatican sont carrés, mais restent des quadrilatères."],
["Démographie",2,"qcm","Quel continent connaît la croissance démographique la plus rapide ?",["L’Afrique","L’Asie","L’Amérique du Sud","L’Océanie"],"L’Afrique compte environ 1,5 milliard d’habitants et pourrait approcher 2,5 milliards en 2050 selon l’ONU."],
["Pays & capitales",1,"rapide","Quelle est la capitale du Brésil ?",["Brasília","Brasilia"],"Ville nouvelle inaugurée en 1960 à l’intérieur des terres, dessinée par Lúcio Costa et Oscar Niemeyer. Rio de Janeiro était capitale auparavant."],
["Géographie physique",2,"court","Comment s’appelle le parallèle situé à environ 23° 26′ au nord de l’équateur ?",["Le tropique du Cancer","tropique du Cancer","Cancer"],"Le Soleil y passe au zénith au solstice de juin. Son symétrique au sud est le tropique du Capricorne."],

["Reliefs",3,"vf","Le sommet de l’Everest est le point de la surface terrestre le plus éloigné du centre de la Terre.",false,"Faux. C’est le Chimborazo (6 263 m, Équateur) : la Terre est renflée à l’équateur, ce qui place son sommet environ 2 km plus loin du centre que celui de l’Everest."],
["Géographie physique",2,"estim","Quelle est la longueur de l’équateur terrestre, en kilomètres ?",[40075,"km"],"Environ 40 075 km. Le mètre a été défini à l’origine, en 1791, comme le dix-millionième du quart d’un méridien terrestre."]

geopol:[
["Organisations",1,"lieu","Dans quelle ville se trouve le siège de l’ONU ?",["New York"],"Le siège est à Manhattan depuis 1952. L’ONU a d’autres grands sièges à Genève, Vienne et Nairobi."],
["Organisations",1,"num","Combien de membres permanents compte le Conseil de sécurité de l’ONU ?",["5","cinq"],"Chine, États-Unis, France, Royaume-Uni et Russie, dotés d’un droit de veto. Dix autres membres sont élus pour deux ans."],

["Relations internationales",1,"vf","Le Royaume-Uni a officiellement quitté l’Union européenne le 31 janvier 2020.",true,"Vrai, après le référendum de juin 2016. Une période de transition a duré jusqu’au 31 décembre 2020."],
["Organisations",1,"qcm","Quelle organisation, fondée en 1960 à Bagdad, regroupe des pays exportateurs de pétrole ?",["L’OPEP","L’OCDE","L’AIE","Le G20"],"Fondée par l’Arabie saoudite, l’Iran, l’Irak, le Koweït et le Venezuela. Depuis 2016, elle coordonne sa production avec d’autres pays au sein de l’« OPEP+ »."],
